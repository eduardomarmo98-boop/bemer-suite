<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folha · BeMer</title>
<meta name="theme-color" content="#00296B">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="../marca/icon-192.png">
<link rel="apple-touch-icon" href="../marca/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   FOLHA INTERNA — módulo da suíte BeMer (06/10/2026)
   ---------------------------------------------------------------------
   A folha do DP (tem SALÁRIO) saiu do Docs e mora aqui. O código das telas
   é o MESMO do Docs v.171 (funções com o mesmo nome), portado para o padrão
   dos módulos: login do portal, portão do 2FA no boot, "Portal" como única
   saída, ← do celular fecha camadas, aviso de versão.
   A trava de verdade é o banco: regras das folha_* exigem a ação do perfil
   em Cadastros › Permissões › Folha (core.folha_pode, migração 0052) E a
   sessão com o 2FA do dia (folha-trava-2fa-2026-10-06.sql).
   Cada abertura (folha, tela, ficha, documento, exportação) vai para
   public.folha_acessos pela RPC folha_registrar_acesso.
   v2026.10.06.3: aba "Documentos pessoais" na ficha (RG, CTPS, filiação,
   naturalidade, raça/cor, instrução, título, CNH, reservista — SQL
   folha-documentos-pessoais-2026-10-06.sql), ficha em modo leitura para
   quem só vê, "Imprimir ficha" e relatório "Cadastro completo" (Excel).
   ===================================================================== */
:root{
  --azul:#00296B; --azul-escuro:#001B4D; --laranja:#FE9400; --laranja-claro:#FFF1DC;
  --texto:#0F1B2D; --texto2:#4F5B6D; --borda:#E3E7ED; --borda-forte:#C9D1DD;
  --fundo:#F5F7FA; --branco:#fff; --campo:#F7F9FC;
  --erro-fundo:#FDECEB; --erro:#9B1C14; --ok-fundo:#E7F5EC; --ok-txt:#1B5E34;
  /* nomes que o código portado do Docs usa nos estilos em linha */
  --bm-blue:#00296B; --bm-orange:#FE9400; --bm-orange-txt:#9A5B00;
  --text:#0F1B2D; --muted:#5B6576; --border:#E3E7ED; --card:#fff;
  --shadow:0 1px 3px rgba(0,20,60,.07),0 1px 2px rgba(0,20,60,.04);
  --ok:#16a34a; --warn:#d97706; --crit:#b91c1c; --info:#2563eb; --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;font-size:14px}
.oculto{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
a{color:var(--azul)}

/* ---- cabeçalho padrão dos módulos ---- */
header.topo{background:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;
  padding-top:calc(9px + env(safe-area-inset-top));border-bottom:3px solid var(--laranja);
  box-shadow:0 2px 8px rgba(0,20,60,.08);position:sticky;top:0;z-index:40}
.marca{display:flex;align-items:center;gap:7px;text-decoration:none;min-height:36px}
.marca img{height:28px;width:auto;display:block}
.fio{width:1px;height:26px;background:var(--borda)}
.modulo{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--azul);font-size:15px;min-width:0}
.tile{width:28px;height:28px;border-radius:8px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.direita{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn-topo{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borda-forte);color:var(--azul);
  border-radius:9px;height:36px;padding:0 12px;cursor:pointer;text-decoration:none;font-weight:600}
.btn-topo.so-icone{border:0;padding:0;width:36px;justify-content:center}
/* ---- botão "← Portal" — PADRÃO DA SUÍTE (07/10/2026) ----
   Copiado do Docs (.btn.btn-secondary.btn-sm do #btnPortal): canto superior
   direito, fundo branco, texto e borda azul 294, raio 6, 12px/500, fonte do
   Docs. Sobre topo AZUL é o mesmo botão branco, só a borda fica branca.
   É a ÚNICA saída para o portal. Mesmo bloco em Flow, Custos, Cadastros,
   Patrimônio e Folha — mudou aqui, muda nos cinco. */
.bm-portal{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:0 0 auto;box-sizing:border-box;
  margin:0;padding:4px 10px;border:1px solid #00296B;border-radius:6px;background:#fff;color:#00296B;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1.5;
  white-space:nowrap;text-decoration:none;cursor:pointer;transition:background .15s}
.bm-portal:hover{background:#f0f4fb;color:#00296B}
.bm-portal:focus-visible{outline:3px solid #FE9400;outline-offset:2px}
.bm-portal.sobre-azul{border-color:#fff}
@media (max-width:768px){.bm-portal{min-height:40px;padding:8px 10px;font-size:13px}}
@media (max-width:520px){ .fio,.btn-topo .txt{display:none} .btn-topo{padding:0 9px} header.topo{padding-left:12px;padding-right:12px} }
@media (max-width:360px){ .marca img{height:24px} }

/* ---- abas ---- */
nav.abas{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:30}
nav.abas .trilho{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.abas .trilho::-webkit-scrollbar{display:none}
nav.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;cursor:pointer;
  color:var(--texto2);font-weight:600;white-space:nowrap;min-height:46px}
nav.abas button.ativa{color:var(--azul);border-bottom-color:var(--laranja)}

main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
.carregando{padding:60px 16px;text-align:center;color:var(--texto2)}
.rodape{text-align:center;color:var(--texto2);font-size:11px;padding:10px 0 24px}

/* ---- o que as telas portadas do Docs usam (mesmos nomes de classe) ---- */
.page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.page-title{font-size:20px;font-weight:700;color:var(--azul)}
.page-sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--borda);padding:18px;margin-bottom:14px;max-width:100%;overflow-x:auto}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
/* ficha em modo leitura: campo travado continua legível */
input:disabled,select:disabled,textarea:disabled{background:var(--campo);color:var(--texto);-webkit-text-fill-color:var(--texto);opacity:1;cursor:default}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin-bottom:5px}
input,select,textarea{font-size:14px;padding:8px 12px;border:1px solid var(--borda-forte);border-radius:8px;width:100%;background:#fff;min-height:38px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--azul)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,41,107,.12)}
.btn{padding:8px 16px;border-radius:8px;font-weight:600;transition:background .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:38px;font-size:14px;border:1px solid transparent}
.btn:disabled,.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--azul);color:#fff} .btn-primary:hover{background:var(--azul-escuro)}
.btn-secondary{background:#fff;color:var(--azul);border-color:var(--azul)} .btn-secondary:hover{background:#EEF2F9}
.btn-danger{background:#fee2e2;color:#991b1b} .btn-danger:hover{background:#fecaca}
.btn-success{background:var(--ok);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px;min-height:32px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{background:#F7F9FC;text-align:left;padding:10px 12px;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--borda)}
td{padding:10px 12px;border-bottom:1px solid var(--borda);font-size:13px;vertical-align:middle}
.small-actions{display:flex;flex-wrap:wrap;gap:4px;width:1%}
td.small-actions{display:table-cell}
td.small-actions .btn{margin:2px 0}
.status{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.status.ok{background:#dcfce7;color:#166534} .status.warn{background:#fef3c7;color:#92400e}
.status.crit{background:#fee2e2;color:#991b1b} .status.info{background:#dbeafe;color:#1e40af}
.alert{padding:12px 16px;background:#fef3c7;border-left:4px solid var(--warn);border-radius:8px;margin-bottom:14px;font-size:13px}
.alert.info{background:#E8EEF8;border-color:var(--azul)}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty-icon{font-size:36px;margin-bottom:8px}
.pill{display:inline-block;background:#eef2f9;color:var(--azul);padding:2px 8px;border-radius:10px;font-size:11px;margin-right:4px;font-weight:500}
.benef-in{min-height:34px}

/* ---- modal (mesma assinatura do Docs: showModal / closeModal) ---- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,20,50,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:700px;max-height:92vh;max-height:92dvh;overflow:auto}
.modal.lg{max-width:900px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.modal-title{font-size:17px;font-weight:600;color:var(--azul)}
.modal-close{color:var(--muted);font-size:24px;line-height:1;width:40px;height:40px;border-radius:8px}
.modal-close:hover{background:var(--fundo)}
.modal-body{padding:18px 20px}
.modal-footer{padding:12px 20px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--borda);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:2}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:200;
  background:var(--azul);color:#fff;border-radius:10px;padding:10px 16px;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--erro)} .toast.warn{background:#92400e}
.faixa-atualizar{position:fixed;left:0;right:0;top:0;z-index:55;background:var(--laranja);color:var(--azul);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:700}
.faixa-atualizar button{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;min-height:40px;font-weight:600}
.cartao-aviso{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:24px;max-width:560px;margin:30px auto;box-shadow:var(--shadow)}
.cartao-aviso h1{font-size:20px;color:var(--azul);margin-bottom:6px}
.cartao-aviso p{color:var(--texto2);line-height:1.5}

/* ---- celular ---- */
@media (max-width:768px){
  main{padding:14px 12px 60px}
  input,select,textarea,.benef-in{font-size:16px!important}
  .grid-2,.grid-3{grid-template-columns:1fr;gap:0 12px}
  .grid-4{grid-template-columns:1fr 1fr;gap:0 12px}
  .grid-3 > .form-group[style*="span 2"]{grid-column:auto!important}
  .page-header{align-items:stretch}
  .page-header > div:last-child:not(:first-child){display:flex;flex-wrap:wrap;gap:8px}
  .card{padding:14px}
  .btn{min-height:40px}
  .btn-sm{min-height:36px;padding:4px 12px}
  .modal-bg{padding:0;align-items:flex-end}
  .modal,.modal.lg{max-width:100%;border-radius:16px 16px 0 0;max-height:94svh}
  .modal-body{padding:14px 14px}
  .modal-footer .btn{flex:1}
  td,th{padding:9px 10px}
  /* tabelas dentro do modal (documentos, histórico) quebram linha em vez de vazar */
  .modal-body table{min-width:0}
  .modal-body th,.modal-body td{padding:7px 6px;white-space:normal!important}
  /* caixinhas: a área de toque é a linha inteira do rótulo */
  label:has(> input[type=checkbox]){min-height:40px;display:flex;align-items:center}
}
@media print{ header.topo,nav.abas,.rodape{display:none} }
</style>
</head>

/* ---------------------------------------------------------------------
   VOLTA — o ← do celular fecha primeiro o que está por cima (mesmo
   mecanismo de Cadastros/Flow): cada camada que abre empilha um passo no
   histórico e o ← fecha a do topo. Na tela inicial o ← NÃO sai para o
   portal — o único caminho é o botão "Portal".
   --------------------------------------------------------------------- */
var Volta = {
  pilha: [], sobra: 0, ignorar: 0,
  abrir: function(k, fechar){
    var c = { k:k, fechar:fechar };
    Volta.pilha.push(c);
    try {
      var st = { bm:Volta.pilha.length };
      if(Volta.sobra > 0){ Volta.sobra--; history.replaceState(st, '', location.href); }
      else history.pushState(st, '', location.href);
    } catch(e){ Volta.pilha.pop(); }
    return c;
  },
  fechou: function(c){
    var i = c ? Volta.pilha.indexOf(c) : -1;
    if(i < 0) return;
    Volta.pilha.splice(i, 1); Volta.sobra++;
    setTimeout(Volta.desfazer, 0);
  },
  desfazer: function(){
    var n = Volta.sobra; if(!n) return;
    Volta.sobra = 0; Volta.ignorar++;
    try { history.go(-n); } catch(e){ Volta.ignorar--; }
  }
};
var Guarda = {
  posta: false,
  armar: function(){
    if(Guarda.posta || Volta.pilha.length || Volta.sobra || Volta.ignorar) return;
    try {
      history.replaceState({ bm:0, raiz:1 }, '', location.href);
      history.pushState({ bm:0 }, '', location.href);
      Guarda.posta = true;
    } catch(e){}
  }
};
document.addEventListener('pointerdown', Guarda.armar, true);
document.addEventListener('keydown', Guarda.armar, true);
document.addEventListener('touchstart', Guarda.armar, { capture:true, passive:true });
window.addEventListener('popstate', function(e){
  var d = (e.state && typeof e.state.bm === 'number') ? e.state.bm : 0;
  if(e.state && e.state.raiz && !Volta.ignorar){
    Guarda.posta = false;
    if(!Volta.pilha.length){ toast('Para voltar ao portal, toque em Portal.'); return; }
  }
  if(Volta.ignorar){ Volta.ignorar--; return; }
  while(Volta.pilha.length > d){ var c = Volta.pilha.pop(); try { c.fechar(); } catch(x){} }
  if(d > Volta.pilha.length){ Volta.ignorar++; try { history.go(Volta.pilha.length - d); } catch(x){ Volta.ignorar--; } }
});
try { if(history.state && history.state.bm) history.replaceState(null, '', location.href); } catch(e){}

/* ---- modal: mesma assinatura do Docs ---- */
let modalSaveFn=null, modalExtras=[], _modalCamada=null;
function showModal(title,body,saveFn,extras=[],readOnly=false,size='',rotuloOk=''){
  $('modalTitle').textContent=title;
  $('modalBody').innerHTML=body;
  $('modalEl').className='modal '+(size||'');
  modalSaveFn=saveFn; modalExtras=extras;
  let html=extras.map((b,i)=>`<button class="btn ${b.cls||'btn-secondary'}" onclick="modalExtra(${i})">${b.label}</button>`).join('');
  html+=`<button class="btn btn-secondary" onclick="closeModal()">${readOnly?'Fechar':'Cancelar'}</button>`;
  if(!readOnly && saveFn) html+=`<button class="btn btn-primary" onclick="modalSave()">${rotuloOk||'Salvar'}</button>`;
  $('modalFooter').innerHTML=html;
  const jaAberto = $('modal').classList.contains('show');
  $('modal').classList.add('show');
  $('modalEl').scrollTop = 0;
  if(!jaAberto || !_modalCamada) _modalCamada = Volta.abrir('modal', function(){ _modalCamada = null; _fecharModalTela(); });
}
function modalExtra(i){ modalExtras[i]?.fn(); }
async function modalSave(){
  if(!modalSaveFn) return;
  const btns = document.querySelectorAll('#modalFooter .btn');
  const salvar = document.querySelector('#modalFooter .btn-primary');
  const rotulo = salvar ? salvar.innerHTML : '';
  btns.forEach(b=>b.disabled=true);
  if(salvar) salvar.innerHTML = 'Salvando…';
  try{
    const result = await Promise.resolve(modalSaveFn());
    if(result!==false) closeModal();
  } finally {
    btns.forEach(b=>b.disabled=false);
    if(salvar) salvar.innerHTML = rotulo;
  }
}
function _fecharModalTela(){ $('modal').classList.remove('show'); modalSaveFn=null; }
function closeModal(){
  _fecharModalTela();
  if(_modalCamada){ const c=_modalCamada; _modalCamada=null; Volta.fechou(c); }
}
$('modal').addEventListener('click', function(e){ if(e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && $('modal').classList.contains('show')) closeModal(); });

async function _selTudo(makeQuery, maxLinhas){
  const PAGE=1000, out=[];
  for(let from=0;;from+=PAGE){
    /* 🚨 02/09 — UMA PÁGINA QUE FALHA ZERAVA A SESSÃO INTEIRA. Foi o que
       aconteceu com FOLEGO, PORTENGE e PJ TERCEIRIZADOS: `documentos` estourou
       o tempo do servidor (8 s), `DB.documentos` ficou vazio, toda exigência
       virou "NÃO ENVIADO" e o `_cargaIncompleta` bloqueou o envio.
       A causa raiz era a policy (corrigida em `rls-documentos-timeout-2026-09-02`),
       mas timeout e oscilação de rede vão acontecer de novo. Três tentativas
       com espera crescente antes de declarar carga incompleta.
       ⚠️ `makeQuery()` é chamada de novo a cada tentativa DE PROPÓSITO: o
       construtor do PostgREST não pode ser aguardado duas vezes. */
    let _r = null;
    for(let _t=0; _t<3; _t++){
      _r = await makeQuery().range(from, from+PAGE-1);
      if(!_r || !_r.error) break;
      if(_t<2) await new Promise(function(ok){ setTimeout(ok, 500*(_t+1)); });
    }
    const {data,error} = _r || {data:null, error:{message:'sem resposta'}};
    if(error) return {data:out, error};
    out.push(...(data||[]));
    if(!data || data.length<PAGE || (maxLinhas && out.length>=maxLinhas)) return {data: maxLinhas?out.slice(0,maxLinhas):out, error:null};
  }
}

const UP_MAX_PX = 2000;
const UP_QUALIDADE = 0.85;
const PDF_COMP_MIN    = 3*1024*1024;   // 3 MB
const PDF_COMP_DPI    = 150;
const PDF_COMP_Q      = 0.72;
/* 01/09, depois da primeira simulação: era 40 e barrou justamente os dois
   maiores do acervo — um contrato de 45 páginas e um PGR de 59, que são o alvo.
   A memória não é o gargalo (cada canvas é liberado ao fim da página); o que
   faltava era AVISAR que está trabalhando, senão parece travado. Daí o
   `_pdfCompProgresso`. 200 é folga de sobra para documento escaneado. */
const PDF_COMP_MAXPAG = 200;
const PDF_COMP_MAXPX  = 2200;
const PDF_COMP_GANHO  = 0.30;          // tem de encolher pelo menos 30%

/* Procura marca de assinatura digital nos bytes crus. Falso positivo é
   inofensivo (deixa de comprimir um arquivo); falso negativo quebraria uma
   assinatura — então a lista é generosa de propósito. */
function _pdfTemAssinatura(buf){
  try{
    const txt = new TextDecoder('latin1').decode(new Uint8Array(buf));
    return /\/ByteRange|\/Adbe\.pkcs7|\/ETSI\.CAdES|\/DocMDP|\/Type\s*\/Sig\b/.test(txt);
  }catch(e){ return true; }            // não consegui ler: trata como assinado
}

/* Tem texto de verdade? Amostra as três primeiras páginas. PDF nativo (gerado
   por sistema) tem centenas de caracteres; scan tem zero, ou um punhado de
   lixo se passou por OCR. */
async function _pdfTemTexto(pdf){
  const ate = Math.min(3, pdf.numPages);
  let chars = 0;
  for(let i=1;i<=ate;i++){
    const c = await (await pdf.getPage(i)).getTextContent();
    chars += (c.items||[]).reduce(function(a,it){ return a + String(it.str||'').trim().length; }, 0);
    if(chars > 200) return true;
  }
  return false;
}

/* Devolve {blob, antes, depois} quando dá para comprimir, ou null com o motivo
   em `_pdfCompMotivo` (usado no log e na tela de acervo). */
let _pdfCompMotivo = '';
/* Quem chama define como mostrar o andamento — a tela de acervo escreve na
   barra de progresso, o envio usa toast. Sem isto, 59 páginas é um minuto de
   tela parada. */
let _pdfCompProgresso = null;
async function _pdfComprimir(file){
  _pdfCompMotivo = '';
  try{
    if(!file || (file.size||0) < PDF_COMP_MIN){ _pdfCompMotivo = 'pequeno'; return null; }
    const buf = await file.arrayBuffer();
    if(_pdfTemAssinatura(buf)){ _pdfCompMotivo = 'assinatura digital'; return null; }

    await libPdfJs();
    if(typeof pdfjsLib === 'undefined'){ _pdfCompMotivo = 'pdf.js não carregou'; return null; }
    try{ pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
    /* cópia do buffer: o pdf.js assume o ArrayBuffer e depois ele fica vazio */
    const pdf = await pdfjsLib.getDocument({data: buf.slice(0)}).promise;

    if(pdf.numPages > PDF_COMP_MAXPAG){ _pdfCompMotivo = pdf.numPages+' páginas'; return null; }
    if(await _pdfTemTexto(pdf)){ _pdfCompMotivo = 'tem texto (PDF nativo)'; return null; }

    await libJsPdf();
    if(!(window.jspdf && window.jspdf.jsPDF)){ _pdfCompMotivo = 'jsPDF não carregou'; return null; }

    let doc = null;
    for(let i=1;i<=pdf.numPages;i++){
      if(_pdfCompProgresso){ try{ _pdfCompProgresso(i, pdf.numPages); }catch(e){} }
      const page = await pdf.getPage(i);
      const base = page.getViewport({scale:1});                 // 1 = 72 dpi
      let escala = PDF_COMP_DPI/72;
      const maior = Math.max(base.width, base.height) * escala;
      if(maior > PDF_COMP_MAXPX) escala = escala * (PDF_COMP_MAXPX/maior);
      const vp = page.getViewport({scale:escala});
      const cv = document.createElement('canvas');
      cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
      const ctx = cv.getContext('2d');
      /* fundo branco: página com transparência viraria preta no JPEG */
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      const jpg = cv.toDataURL('image/jpeg', PDF_COMP_Q);
      /* a PÁGINA fica do tamanho original em pontos — o papel não muda, só a
         resolução da imagem dentro dele */
      const larg = base.width, alt = base.height;
      if(!doc) doc = new window.jspdf.jsPDF({unit:'pt', format:[larg, alt],
                                             orientation: larg>alt?'landscape':'portrait'});
      else doc.addPage([larg, alt], larg>alt?'landscape':'portrait');
      doc.addImage(jpg, 'JPEG', 0, 0, larg, alt);
      cv.width = cv.height = 0;                                  // libera memória
    }
    if(!doc){ _pdfCompMotivo = 'sem páginas'; return null; }
    const blob = doc.output('blob');
    if(!blob || blob.size > file.size*(1-PDF_COMP_GANHO)){
      _pdfCompMotivo = 'ganho menor que '+Math.round(PDF_COMP_GANHO*100)+'%';
      return null;
    }
    return {blob: blob, antes: file.size, depois: blob.size};
  }catch(e){
    console.warn('[pdf] não consegui comprimir:', e);
    _pdfCompMotivo = 'erro: '+(e && e.message || e);
    return null;
  }
}
function _mb(n){ return (n/1048576).toFixed(1).replace('.',',')+' MB'; }


async function _otimizarParaUpload(file){
  try{
    if(!file) return file;
    /* v.98: PDF grande e escaneado passa a ser compactado — com as quatro
       travas e perguntando antes. Ver `_pdfComprimir`. */
    if(/pdf$/i.test(file.type||'') || /\.pdf$/i.test(file.name||'')){
      if((file.size||0) < PDF_COMP_MIN) return file;
      toast('Analisando o PDF ('+_mb(file.size)+')…');
      _pdfCompProgresso = function(i, n){ if(n > 4 && (i===1 || i%5===0)) toast('Compactando página '+i+' de '+n+'…'); };
      let r = null;
      try{ r = await _pdfComprimir(file); } finally { _pdfCompProgresso = null; }
      if(!r){ console.log('[pdf] mantido inteiro —', _pdfCompMotivo); return file; }
      const pct = Math.round((1 - r.depois/r.antes)*100);
      if(!confirm('Este PDF é um documento escaneado de '+_mb(r.antes)+'.\n\n' +
                  'Posso enviar uma versão compactada de '+_mb(r.depois)+' ('+pct+'% menor)?\n\n' +
                  'O documento continua legível e nada é assinado digitalmente nele — ' +
                  'PDF com assinatura de certificado o sistema nem tenta comprimir.\n\n' +
                  'Cancelar envia o arquivo original, do jeito que está.')) return file;
      try{
        const nome = String(file.name||'documento.pdf');
        const menor = new File([r.blob], nome, {type:'application/pdf'});
        console.log('[pdf]', _mb(r.antes), '->', _mb(r.depois));
        return menor;
      }catch(e){ return file; }        // WebView antigo sem construtor File
    }
    if(!/^image\//.test(file.type||'')) return file;
    if((file.size||0) < 400*1024) return file;                     // já é pequeno
    const url = URL.createObjectURL(file);
    const img = await new Promise(function(res, rej){
      const i = new Image(); i.onload = function(){ res(i); }; i.onerror = rej; i.src = url;
    });
    const maior = Math.max(img.width, img.height);
    const escala = maior > UP_MAX_PX ? UP_MAX_PX/maior : 1;
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width*escala); cv.height = Math.round(img.height*escala);
    /* Fundo branco: PNG com transparência viraria preto no JPEG, e foto de
       documento com fundo preto é documento perdido. */
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    const blob = await new Promise(function(res){ cv.toBlob(res, 'image/jpeg', UP_QUALIDADE); });
    if(!blob || blob.size > file.size*0.9) return file;             // não compensou
    const nome = String(file.name||'foto').replace(/\.[^.]+$/, '') + '.jpg';
    try{
      const menor = new File([blob], nome, {type:'image/jpeg'});
      console.log('[upload] foto', (file.size/1048576).toFixed(2)+' MB ->', (menor.size/1048576).toFixed(2)+' MB');
      return menor;
    }catch(e){
      /* WebView antigo sem construtor `File`. Sem nome e sem tipo o upload
         subiria como octet-stream e o navegador do SESMT baixaria em vez de
         abrir — melhor mandar o original. */
      return file;
    }
  }catch(e){ console.warn('otimizar imagem', e); return file; }
}

function folhaDeslFaltando(f){
  if(!f || f.ativo!==false) return [];
  const tem = new Set(DB.folhaDocs.filter(d=>d.funcionario_id===f.id).map(d=>d.tipo));
  return FOLHA_DOCS_DESLIGAMENTO.filter(t=>!tem.has(t));
}

/* false até a migration-folha-sindicato-turno rodar. Enquanto isso o app não
   manda `sindicato_id`/`turno_id` no upsert — mandar coluna que não existe faria
   TODO salvamento de funcionário falhar (mesma armadilha do foto_ajuste). */
let _folhaTemCadastros = false;
async function folhaLoad(force){
  if(_folha.loaded && !force) return true;
  try{
    const [cc, fu, dep, doc, alt, sin, tur, docp] = await Promise.all([
      sb.from('folha_centros_custo').select('*').order('nome'),
      _selTudo(()=>sb.from('folha_funcionarios').select('*').order('nome')),
      _selTudo(()=>sb.from('folha_dependentes').select('*').order('id')),
      _selTudo(()=>sb.from('folha_documentos').select('*').order('id')),
      _selTudo(()=>sb.from('folha_alteracoes').select('*').order('id')),
      /* sindicatos e turnos chegaram depois (migration-folha-sindicato-turno).
         Não entram no `throw`: se a migration ainda não rodou, a Folha continua
         funcionando sem eles em vez de a tela toda morrer. */
      sb.from('folha_sindicatos').select('*').order('nome'),
      sb.from('folha_turnos').select('*').order('nome'),
      /* documentos pessoais (folha-documentos-pessoais-2026-10-06.sql): pergunta
         se as colunas existem — sem o SQL, mandá-las faria o salvar inteiro falhar. */
      sb.from('folha_funcionarios').select(FOLHA_DOCP_COLS.join(',')).limit(1)
    ]);
    if(cc.error) throw cc.error; if(fu.error) throw fu.error;
    DB.folhaCC = cc.data||[]; DB.folhaFuncs = fu.data||[]; DB.folhaDeps = dep.data||[]; DB.folhaDocs = doc.data||[]; DB.folhaAlt = alt.data||[];
    DB.folhaSind = (sin && !sin.error) ? (sin.data||[]) : [];
    DB.folhaTurnos = (tur && !tur.error) ? (tur.data||[]) : [];
    _folhaTemCadastros = !!(sin && !sin.error && tur && !tur.error);
    _folhaTemDocsPessoais = !!(docp && !docp.error);
    _folha.loaded = true;
    if(!DB.folhaFuncs.length) _conferirSessao();   // módulo: vazio pode ser 2FA vencido
    return true;
  }catch(e){
    console.error('folhaLoad', e);
    toast('Folha Interna: rode a migration-folha-interna.sql ('+(e.message||e)+')','err');
    return false;
  }
}

/* ---- alertas por funcionário (experiência/documentos) ---- */
function folhaAlertas(f){
  if(f.ativo===false) return [];
  const out=[]; const today=new Date(); today.setHours(0,0,0,0); const in30=new Date(today.getTime()+30*86400000);
  [['exp1_fim','1ª experiência'],['exp2_fim','2ª experiência']].forEach(function(t){
    if(f[t[0]]){ const d=new Date(f[t[0]]+'T00:00:00'); if(d>=today && d<=in30) out.push(t[1]+' vence '+folhaData(f[t[0]])); }
  });
  DB.folhaDocs.filter(d=>d.funcionario_id===f.id && d.validade).forEach(function(d){
    const dv=new Date(d.validade+'T00:00:00'); const nome=FOLHA_DOC_TIPOS[d.tipo]||d.tipo;
    if(dv<today) out.push(nome+' vencido'); else if(dv<=in30) out.push(nome+' vence '+folhaData(d.validade));
  });
  if(DB.folhaDocs.filter(d=>d.funcionario_id===f.id).length===0) out.push('sem documentos');
  if(f.cnh_validade){ const dv=new Date(f.cnh_validade+'T00:00:00'); if(dv<today) out.push('CNH vencida'); else if(dv<=in30) out.push('CNH vence '+folhaData(f.cnh_validade)); }
  return out;
}

function folhaFuncFilter(){
  const q=(document.getElementById('folha_busca')?.value||'').toLowerCase().trim();
  const fcc=document.getElementById('folha_fcc')?.value||'';
  const fcargo=document.getElementById('folha_fcargo')?.value||'';
  const inc=!!(document.getElementById('folha_finativos')&&document.getElementById('folha_finativos').checked);
  let list=DB.folhaFuncs.slice();
  if(!inc) list=list.filter(f=>f.ativo!==false);
  if(fcc) list=list.filter(f=>String(f.centro_custo_id||'')===String(fcc));
  if(fcargo) list=list.filter(f=>f.cargo===fcargo);
  if(q) list=list.filter(f=>[f.nome,f.cpf,f.matricula,f.cargo,folhaCCNome(f.centro_custo_id)].some(v=>(v||'').toLowerCase().includes(q)));
  list.sort((a,b)=>(a.nome||'').localeCompare(b.nome||''));
  const tb=document.getElementById('folha_tbody'); if(!tb) return;
  tb.innerHTML=list.map(function(f){
    const nd=DB.folhaDocs.filter(d=>d.funcionario_id===f.id).length;
    const al=folhaAlertas(f);
    const _fd = folhaDeslFaltando(f);
    const sit = f.ativo===false
      ? (_fd.length
          ? `<span class="status crit" title="Faltam: ${escapeHtml(_fd.map(t=>String(FOLHA_DOC_TIPOS[t]||t).replace('Desligamento · ','')).join(' | '))}">Desligamento incompleto (${_fd.length})</span>`
          : '<span class="status ok">Desligado — documentação completa</span>')
      : (al.length?`<span class="status warn" title="${escapeHtml(al.join(' | '))}">⚠️ ${al.length}</span>`:'<span class="status ok">OK</span>');
    return `<tr>
      <td><b>${escapeHtml(f.nome||'')}</b>${f.matricula?`<div style="font-size:11px;color:var(--muted)">mat. ${escapeHtml(f.matricula)}</div>`:''}</td>
      <td>${escapeHtml(f.cargo||'-')}</td>
      <td>${escapeHtml(folhaCCNome(f.centro_custo_id)||'-')}</td>
      <td>${folhaData(f.data_admissao)}</td>
      <td>${folhaMoney(f.salario_base)}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="folhaDocs(${f.id})">📄 ${nd}</button></td>
      <td>${sit}</td>
      <td class="small-actions" style="white-space:nowrap">
        <button class="btn btn-secondary btn-sm" onclick="folhaFuncForm(${f.id})">${folhaEdita()?'Editar':'Ver ficha'}</button>
        <button class="btn btn-secondary btn-sm" title="Histórico de alterações" onclick="folhaHist(${f.id})">🕘</button>
        <button class="btn btn-secondary btn-sm" title="Enviar cadastro para o SESMT" onclick="folhaParaSesmt(${f.id})">→ SESMT</button>
        ${f.ativo===false?`<button class="btn btn-success btn-sm" title="Reativar" onclick="folhaReativar(${f.id})">♻️</button>`:`<button class="btn btn-secondary btn-sm" title="Arquivar (desligar)" onclick="folhaArquivar(${f.id})">🗄️</button>`}
      </td>
    </tr>`;
  }).join('');
  const emp=document.getElementById('folha_empty'); if(emp) emp.innerHTML = list.length?'':'<div class="empty"><div class="empty-icon">👥</div>Nenhum funcionário</div>';
}

async function folhaFuncSave(id){
  const val=(x)=>{ const el=document.getElementById(x); return el?String(el.value).trim():''; };
  const num=(x)=>{ const v=parseFloat(document.getElementById(x)?.value); return isNaN(v)?0:v; };
  const chk=(x)=>{ const el=document.getElementById(x); return !!(el&&el.checked); };
  const dOrNull=(x)=>{ const v=val(x); return v||null; };
  if(!folhaEdita()){ toast('Seu perfil é somente leitura.','err'); return false; }
  const nome=val('fi_nome');
  if(!nome){ toast('Informe o nome','err'); folhaTab('pessoal'); return false; }
  /* documentos pessoais: confere antes de gravar (datas, tamanhos) */
  const _docp = _folhaTemDocsPessoais ? folhaDocpLer() : null;
  if(_docp){
    const v = folhaDocpValidar(_docp, dOrNull('fi_nasc'));
    if(v.erros.length){ toast(v.erros.join(' · '),'err'); folhaTab('docs'); return false; }
    if(v.avisos.length) toast('Atenção: '+v.avisos.join(' · '),'warn');
  }
  const ccEl=document.getElementById('fi_cc');
  const payload={
    matricula:val('fi_matricula'), nome:nome, sexo:val('fi_sexo'), nascimento:dOrNull('fi_nasc'),
    cpf:val('fi_cpf'), estado_civil:val('fi_ecivil'), pis:val('fi_pis'), obs:(document.getElementById('fi_obs')?document.getElementById('fi_obs').value.trim():''), tel_principal:val('fi_tel'), contato_emergencia:val('fi_emerg'), email_pessoal:val('fi_email'),
    cep:val('fi_cep'), rua:val('fi_rua'), numero:val('fi_num'), complemento:val('fi_compl'), bairro:val('fi_bairro'), cidade:val('fi_cidade'), estado:val('fi_uf'),
    empresa:val('fi_empresa'), centro_custo_id:(ccEl&&ccEl.value)?parseInt(ccEl.value):null,
    departamento:val('fi_depto'), cargo:val('fi_cargo'), funcao:val('fi_funcao'), tipo_contrato:val('fi_tipo')||'clt',
    data_admissao:dOrNull('fi_adm'), exp1_fim:dOrNull('fi_exp1'), exp2_fim:dOrNull('fi_exp2'),
    salario_base:num('fi_sal'), tipo_pagamento:val('fi_pgto'),
    banco:val('fi_banco'), agencia:val('fi_ag'), conta:val('fi_conta'),
    ben_vt:chk('fi_ben_vt'), ben_vr:chk('fi_ben_vr'), ben_va:chk('fi_ben_va'), ben_conv_medico:chk('fi_ben_conv_medico'),
    ben_conv_odonto:chk('fi_ben_conv_odonto'), ben_seguro_vida:chk('fi_ben_seguro_vida'), ben_ajuda_custo:chk('fi_ben_ajuda_custo'),
    atualizado_em:new Date().toISOString()
  };
  /* Só manda as colunas novas se a migration já rodou — senão o upsert inteiro
     falha (mesma armadilha do foto_ajuste no crachá). Guarda também o NOME do
     turno/sindicato nas colunas de texto legadas: relatórios antigos e o
     histórico de alterações leem de lá. */
  if(_folhaTemCadastros){
    const tEl=document.getElementById('fi_turno_id'), sEl=document.getElementById('fi_sind_id');
    const tId=(tEl&&tEl.value)?parseInt(tEl.value):null, sId=(sEl&&sEl.value)?parseInt(sEl.value):null;
    payload.turno_id=tId; payload.sindicato_id=sId;
    const t=DB.folhaTurnos.find(x=>x.id===tId), sd=DB.folhaSind.find(x=>x.id===sId);
    payload.turno = t?(t.nome||''):'';
    payload.sindicato = sd?((sd.sigla||sd.nome||'')):'';
  }
  if(_docp) Object.assign(payload, _docp);   // só com o SQL dos documentos pessoais rodado
  toast('Salvando...');
  let funcId=id; const alteracoes=[];
  if(id){
    const old=DB.folhaFuncs.find(x=>x.id===id)||{};
    const motivo=val('fi_motivo');
    [['salario_base','salario','Salário',true],['cargo','cargo','Cargo',false],['centro_custo_id','centro_custo','Centro de custo',false],['turno','turno','Turno',false]].forEach(function(t){
      const col=t[0], isNum=t[3]; const a=old[col], b=payload[col];
      const same = isNum ? (Number(a||0)===Number(b||0)) : (String(a==null?'':a)===String(b==null?'':b));
      if(!same){
        const fmtV=function(v){ if(col==='salario_base') return folhaMoney(v); if(col==='centro_custo_id') return folhaCCNome(v)||'(nenhum)'; return (v==null||v==='')?'(vazio)':String(v); };
        alteracoes.push({funcionario_id:id, tipo:t[1], campo:t[2], valor_anterior:fmtV(a), valor_novo:fmtV(b), motivo:motivo, usuario_id:session.id, usuario_nome:session.nome||''});
      }
    });
    const {error}=await sb.from('folha_funcionarios').update(payload).eq('id',id);
    if(error){ toast('Erro ao salvar: '+error.message,'err'); return false; }
  } else {
    payload.ativo=true; payload.criado_em=new Date().toISOString();
    const {data,error}=await sb.from('folha_funcionarios').insert(payload).select().single();
    if(error){ toast('Erro ao salvar: '+error.message,'err'); return false; }
    funcId=data.id;
  }
  await sb.from('folha_dependentes').delete().eq('funcionario_id', funcId);
  const deps=_folha.deps.filter(d=>(d.nome||'').trim()).map(d=>({funcionario_id:funcId, nome:d.nome.trim(), cpf:d.cpf||'', nascimento:d.nascimento||null, parentesco:d.parentesco||'', dep_ir:!!d.dep_ir, dep_salario_familia:!!d.dep_salario_familia}));
  if(deps.length){ const {error:de}=await sb.from('folha_dependentes').insert(deps); if(de) console.warn('deps', de); }
  if(alteracoes.length){ const {error:ae}=await sb.from('folha_alteracoes').insert(alteracoes); if(ae) console.warn('alt', ae); }
  await folhaLoad(true);
  toast(id?'Funcionário atualizado':'Funcionário cadastrado');
  if(currentPage==='folha_func') folhaFuncFilter(); else if(currentPage==='folha_dash') renderFolhaDash();
  return true;
}

const FOLHA_DOCP_COLS = ['nome_mae','nome_pai','nascimento_cidade','nascimento_uf','nacionalidade','raca_cor','grau_instrucao',
  'rg_numero','rg_orgao','rg_uf','rg_emissao','ctps_numero','ctps_serie','ctps_uf','ctps_emissao','ctps_digital',

  'Fundamental 6º ao 9º ano incompleto','Fundamental completo','Médio incompleto','Médio completo',

function _docpOpts(lista, atual, rotulo){
  const a = atual==null ? '' : String(atual);
  const itens = [''].concat(lista); if(a && !lista.includes(a)) itens.push(a);   // valor antigo fora da lista: não some
  return itens.map(o=>`<option value="${escapeHtml(o)}" ${o===a?'selected':''}>${o?escapeHtml(rotulo?rotulo(o):o):'--'}</option>`).join('');
}
function folhaInstrucaoRot(o){ const i=FOLHA_INSTRUCAO.indexOf(o); return i>=0 ? String(i+1).padStart(2,'0')+' · '+o : o; }
function folhaTituloFmt(v){ const d=_soDig(v); return d.length===12 ? d.slice(0,4)+' '+d.slice(4,8)+' '+d.slice(8) : d; }
/* máscaras: dig = só números · titulo = 0000 0000 0000 · doc = RG/reservista · sigla = órgão emissor */
function docpMascara(el, tipo, max){
  let v=String(el.value||'');
  if(tipo==='dig') v=v.replace(/\D/g,'').slice(0,max||20);
  else if(tipo==='titulo'){ const d=v.replace(/\D/g,'').slice(0,12); v=[d.slice(0,4),d.slice(4,8),d.slice(8)].filter(Boolean).join(' '); }
  else if(tipo==='doc') v=v.toUpperCase().replace(/[^0-9A-Z.\-\/ ]/g,'').slice(0,max||20);
  else if(tipo==='sigla') v=v.toUpperCase().replace(/[^A-Z\/\- ]/g,'').slice(0,max||12);
  if(v!==el.value) el.value=v;
}
/* CTPS digital: o número é o CPF — marca e o número vazio vem do CPF da aba Pessoal */
function folhaCtpsDigital(el){
  const n=$('fi_ctps_num'); if(!el.checked || !n || n.value.trim()) return;
  const c=_soDig(($('fi_cpf')||{}).value); if(c.length===11){ n.value=c; toast('Número da CTPS = CPF (CTPS digital)'); }
}

/* modo leitura (perfil só "ver") ou banco sem as colunas: trava os campos */
function folhaDocpTravar(soLeitura){
  const body=$('modalBody'); if(!body) return;
  if(soLeitura){
    body.querySelectorAll('input,select,textarea').forEach(e=>{ e.disabled=true; });
    body.querySelectorAll('button[onclick^="folhaDep"]').forEach(b=>{ b.style.display='none'; });
    const m=$('fi_cep_msg'); if(m) m.style.display='none';
  } else if(!_folhaTemDocsPessoais){
    const p=$('ftp_docs'); if(p) p.querySelectorAll('input,select').forEach(e=>{ e.disabled=true; });
  }
}
function folhaDocpLer(){
  const v=id=>{ const el=$(id); return el?String(el.value).trim():''; };
  const d=id=>v(id)||null;
  return {
    nome_mae:v('fi_mae'), nome_pai:v('fi_pai'), nascimento_cidade:v('fi_nasc_cidade'), nascimento_uf:v('fi_nasc_uf').toUpperCase(),
    nacionalidade:v('fi_nacionalidade'), raca_cor:v('fi_raca'), grau_instrucao:v('fi_instrucao'),
    rg_numero:v('fi_rg_num').toUpperCase(), rg_orgao:v('fi_rg_orgao').toUpperCase(), rg_uf:v('fi_rg_uf').toUpperCase(), rg_emissao:d('fi_rg_emissao'),
    ctps_numero:_soDig(v('fi_ctps_num')), ctps_serie:_soDig(v('fi_ctps_serie')), ctps_uf:v('fi_ctps_uf').toUpperCase(), ctps_emissao:d('fi_ctps_emissao'),
    ctps_digital:!!($('fi_ctps_digital') && $('fi_ctps_digital').checked),
    titulo_eleitor:_soDig(v('fi_titulo')), titulo_zona:_soDig(v('fi_titulo_zona')), titulo_secao:_soDig(v('fi_titulo_secao')),
    cnh_numero:_soDig(v('fi_cnh_num')), cnh_categoria:v('fi_cnh_cat').toUpperCase(), cnh_validade:d('fi_cnh_val'),
    reservista_numero:v('fi_reservista').toUpperCase()
  };
}
/* regras comuns à ficha e à importação. erros = não grava; avisos = grava e avisa */
function folhaDocpValidar(p, nasc){
  const erros=[], avisos=[], h=hoje();
  const dataOk=x=>/^\d{4}-\d{2}-\d{2}$/.test(x) && +x.slice(0,4)>=1900 && +x.slice(0,4)<=2100;
  [['rg_emissao','Emissão do RG',true],['ctps_emissao','Emissão da CTPS',true],['cnh_validade','Validade da CNH',false]].forEach(function(c){
    const x=p[c[0]]; if(!x) return;
    if(!dataOk(x)){ erros.push(c[1]+': data inválida'); return; }
    if(c[2] && x>h) erros.push(c[1]+' no futuro');
    if(c[2] && nasc && x<nasc) erros.push(c[1]+' antes do nascimento');
  });
  [['nascimento_uf','UF de nascimento'],['rg_uf','UF do RG'],['ctps_uf','UF da CTPS']].forEach(function(c){
    if(p[c[0]] && !_UFS.includes(p[c[0]])) erros.push(c[1]+' inválida ('+p[c[0]]+')');
  });
  if(p.cnh_categoria && !FOLHA_CNH_CAT.includes(p.cnh_categoria)) erros.push('Categoria da CNH inválida ('+p.cnh_categoria+')');
  const nt=_soDig(p.titulo_eleitor).length; if(nt && nt!==12) avisos.push('Título de eleitor com '+nt+' dígitos (o normal é 12)');
  const nc=_soDig(p.cnh_numero).length;     if(nc && nc!==11) avisos.push('CNH com '+nc+' dígitos (o normal é 11)');
  if(nc && !p.cnh_categoria) avisos.push('CNH sem categoria');
  if(p.cnh_validade && dataOk(p.cnh_validade) && p.cnh_validade<h) avisos.push('CNH vencida');
  return {erros, avisos};
}

/* ============================================================================
   CEP -> ENDERECO  (v.131)
   Digitar rua, bairro e cidade a mao em 100 fichas gera erro de grafia que
   depois quebra relatorio e busca. O ViaCEP e publico, sem cadastro e sem
   chave. Regras que valem aqui:
   - Nao apaga o que ja esta preenchido. Quem corrigiu a rua na mao nao perde.
   - Sem internet ou CEP invalido: avisa e deixa digitar. Nunca trava o Salvar.
   - Numero e complemento nunca vem do CEP; o foco vai para o Numero.
   ========================================================================= */
function cepMascara(el){
  const d = String(el.value||'').replace(/\D/g,'').slice(0,8);
  el.value = d.length>5 ? d.slice(0,5)+'-'+d.slice(5) : d;
}
let _cepUltimo = '';
async function cepBuscar(){
  const el=document.getElementById('fi_cep'); if(!el) return;
  const msg=document.getElementById('fi_cep_msg');
  const diz=(t,cor)=>{ if(msg){ msg.textContent=t; msg.style.color=cor||'var(--muted)'; } };
  const cep = String(el.value||'').replace(/\D/g,'');
  if(cep.length!==8){ if(cep.length) diz('CEP incompleto — precisa de 8 dígitos.','#b45309'); return; }
  if(cep===_cepUltimo) return;                 // nao repete a consulta a cada blur
  const set=(id,v)=>{ const c=document.getElementById(id); if(c && !c.value.trim() && v) c.value=v; };
  diz('Buscando endereço…');
  try{
    const r = await fetch('https://viacep.com.br/ws/'+cep+'/json/');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    if(d.erro){ diz('CEP não encontrado nos Correios — preencha à mão.','#b45309'); return; }
    _cepUltimo = cep;
    set('fi_rua', d.logradouro); set('fi_bairro', d.bairro);
    set('fi_cidade', d.localidade); set('fi_uf', d.uf);
    diz('✓ '+[d.localidade,d.uf].filter(Boolean).join('/')+' — confira e informe o número.','#15803d');
    const num=document.getElementById('fi_num'); if(num && !num.value.trim()) num.focus();
  }catch(e){
    console.warn('viacep', e);
    diz('Não consegui consultar o CEP agora — preencha à mão.','#b45309');
  }
}

async function folhaDocUpload(id){
  /* v.130 CORRECAO: aqui era `const arq` e a linha do _otimizarParaUpload
     reatribuia — TypeError em tempo de execucao. Numa funcao async sem
     try/catch isso vira rejeicao silenciosa: o botao nao fazia NADA, sem
     erro na tela. So quebrava para quem escolhia arquivo (que e todo mundo
     que ia de fato enviar). Agora e `let`, e o try/catch garante que
     qualquer falha futura apareca em vez de sumir. */
  const arqEl=document.getElementById('fd_arq'); let arq=arqEl&&arqEl.files[0];
  if(!arq){ toast('Selecione o arquivo','err'); return; }
  const tipo=document.getElementById('fd_tipo').value;
  const desc=document.getElementById('fd_desc').value.trim();
  const emit=document.getElementById('fd_emit').value||null;
  const valid=document.getElementById('fd_val').value||null;
  try{
  arq = await _otimizarParaUpload(arq);           // v.92
  const stamp=Date.now(), safe=arq.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(0,80);
  const path=`folha/${id}/${tipo}_${stamp}_${safe}`;
  toast('Enviando...');
  const {error:upErr}=await sb.storage.from('documentos').upload(path, arq, {contentType:arq.type||'application/pdf', upsert:true});
  if(upErr){ toast('Erro ao subir: '+upErr.message,'err'); return; }
  const {data,error}=await sb.from('folha_documentos').insert({funcionario_id:id, tipo:tipo, descricao:desc, arquivo:arq.name, arquivo_path:path, emitido_em:emit, validade:valid}).select().single();
  if(error){ toast('Erro ao salvar: '+error.message,'err'); return; }
  DB.folhaDocs.push(data);
  const list=document.getElementById('folha_docs_list'); if(list) list.innerHTML=folhaDocsListHtml(DB.folhaDocs.filter(d=>d.funcionario_id===id));
  if(arqEl) arqEl.value=''; const dEl=document.getElementById('fd_desc'); if(dEl) dEl.value='';
  toast('Documento anexado'); if(currentPage==='folha_func') folhaFuncFilter();
  }catch(e){ console.error('folhaDocUpload', e); toast('Falha ao enviar: '+(e&&e.message||e),'err'); }
}

/* ============================================================================
   FOLHA INTERNA · BENEFÍCIOS POR COMPETÊNCIA   (31/08/2026, v.95)
   ----------------------------------------------------------------------------
   A planilha do DP, dentro do sistema. Uma linha por pessoa POR MÊS, porque os
   valores mudam com dias úteis, admissão e desligamento — não são fixos na
   ficha. As marcações `ben_vt`/`ben_vr`/`ben_va` de `folha_funcionarios`
   continuam sendo outra coisa: dizem A QUE a pessoa tem direito; aqui é QUANTO
   ela recebeu naquele mês.

   ⚠️ FUNCIONÁRIO e CENTRO DE CUSTO não são gravados aqui — saem da ficha na
      hora de desenhar. Guardar o nome junto criaria duas verdades: trocar o
      centro de custo na ficha e a planilha do mês continuar mostrando o antigo.
   ⚠️ LIBERAÇÃO é a soma das quatro colunas e é CALCULADA PELO BANCO (coluna
      `generated`). Nunca mandar no insert/update — o PostgREST recusa a linha
      inteira. É o que impede o defeito clássico de planilha: o total que
      deixou de bater com as parcelas.
   ⚠️ Os valores são digitados como o DP digita: "1.070,08" e "1070,08" valem
      igual, porque passam pelo `folhaImportNum` que a importação já usava. Um
      `<input type="number">` recusaria a vírgula em parte dos navegadores.

   🚨 O QUE O USUÁRIO DIGITOU MORA EM `_benef.pend`, NÃO NO DOM.
      A primeira versão lia os valores dos `<input>`. Bastava digitar e depois
      filtrar por nome — a tela se redesenha, os inputs somem e o que tinha sido
      digitado ia junto, sem aviso. Agora o DOM é só a pintura: toda tecla cai
      em `_benef.pend`, e desenhar é `pend ?? banco`. Filtrar, trocar de busca e
      voltar não perde nada; só trocar de competência descarta, e aí pergunta.
   ============================================================================ */
let _benef = {comp:'', linhas:{}, pend:{}, visiveis:[], busca:''};

function benefComp(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function benefCompAnterior(comp){
  const [y,m] = comp.split('-').map(Number);
  const d = new Date(y, m-2, 1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
const BENEF_CAMPOS = ['vale_cafe','va_vr','vale_transporte','passagem'];
/* Reaproveita o parser de dinheiro da importação de planilha em vez de escrever
   um segundo — dois parsers de dinheiro divergem, e o que diverge em silêncio é
   o pior tipo. */
function benefNum(v){ return folhaImportNum(v); }
function benefFmt(n){ const x=Number(n)||0; return x ? x.toFixed(2).replace('.',',') : ''; }

/* A ÚNICA fonte de valor da tela: o que foi digitado, senão o que veio do
   banco, senão zero. Não olha o DOM. */
function benefValor(fid, campo){
  const p = _benef.pend[fid];
  if(p && p[campo] !== undefined) return p[campo];
  const b = _benef.linhas[fid];
  return b ? (Number(b[campo])||0) : 0;
}
function benefTotalLinha(fid){
  return BENEF_CAMPOS.reduce(function(a,c){ return a + benefValor(fid,c); }, 0);
}
function benefEdit(el){
  const fid = Number(el.getAttribute('data-fid'));
  const campo = el.getAttribute('data-campo');
  if(!_benef.pend[fid]) _benef.pend[fid] = {};
  _benef.pend[fid][campo] = benefNum(el.value);
  const cel = document.getElementById('benef_lib_'+fid);
  if(cel) cel.textContent = folhaMoney(benefTotalLinha(fid));
  benefTotais();
}

async function benefLoad(comp){
  const {data, error} = await sb.from('folha_beneficios').select('*').eq('competencia', comp);
  if(error){ console.error('benefLoad', error); return {erro:error}; }
  const m = {};
  (data||[]).forEach(function(r){ m[r.funcionario_id] = r; });
  return {linhas:m};
}



async function renderFolhaBenef(){
  if(!folhaPode()){ document.getElementById('main').innerHTML='<div class="empty">Sem permissão.</div>'; return; }
  const main=document.getElementById('main');
  const ok=await folhaLoad();
  if(!ok){ main.innerHTML='<div class="empty">Rode a <b>migration-folha-interna.sql</b> no Supabase e recarregue.</div>'; return; }
  if(!_benef.comp) _benef.comp = benefComp();
  main.innerHTML = '<div class="empty">Carregando benefícios…</div>';
  const r = await benefLoad(_benef.comp);
  if(r.erro){
    main.innerHTML = '<div class="empty"><div class="empty-icon">🎟️</div>Rode a <b>folha-beneficios-2026-08-31.sql</b> no Supabase e recarregue.' +
      '<div style="margin-top:8px;font-size:12px;color:var(--muted)">'+escapeHtml(r.erro.message||'')+'</div></div>';
    return;
  }
  _benef.linhas = r.linhas;
  benefDesenhar();
}

function benefAtivos(){
  return DB.folhaFuncs.filter(function(f){ return f.ativo!==false; })
    .sort(function(a,b){ return String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'); });
}

function benefDesenhar(){
  const comp = _benef.comp;
  const busca = _normTxt(_benef.busca||'');
  const lista = benefAtivos().filter(function(f){
    return !busca || _normTxt(f.nome||'').indexOf(busca)>=0 || _normTxt(folhaCCNome(f.centro_custo_id)).indexOf(busca)>=0;
  });
  _benef.visiveis = lista.map(function(f){ return f.id; });

  const linha = function(f){
    const inp = function(campo){
      return '<input class="benef-in" data-fid="'+f.id+'" data-campo="'+campo+'" inputmode="decimal" ' +
             'value="'+escapeHtml(benefFmt(benefValor(f.id, campo)))+'" oninput="benefEdit(this)" ' +
             'style="width:100%;min-width:82px;text-align:right;padding:4px 6px;font-size:13px">';
    };
    return '<tr>' +
      '<td style="white-space:nowrap"><b>'+escapeHtml(f.nome||'')+'</b></td>' +
      '<td style="white-space:nowrap;color:var(--muted)">'+escapeHtml(folhaCCNome(f.centro_custo_id)||'-')+'</td>' +
      BENEF_CAMPOS.map(function(c){ return '<td>'+inp(c)+'</td>'; }).join('') +
      '<td id="benef_lib_'+f.id+'" style="text-align:right;white-space:nowrap;font-weight:700;background:#f3f4f6">' +
        folhaMoney(benefTotalLinha(f.id)) + '</td>' +
    '</tr>';
  };

  const nPend = benefDiferencas().length;
  document.getElementById('main').innerHTML =
    '<div class="page-header"><div><div class="page-title">🎟️ Benefícios</div>' +
      '<div class="page-sub">'+fopagCompLabel(comp)+' · '+lista.length+' de '+benefAtivos().length+' pessoa(s) · a <b>Liberação</b> é a soma das quatro colunas, calculada pelo sistema</div></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-secondary" onclick="benefCopiarMesAnterior()" title="Traz os valores de '+fopagCompLabel(benefCompAnterior(comp))+' para a tela. Nada é gravado até clicar em Salvar.">⧉ Copiar de '+fopagCompLabel(benefCompAnterior(comp))+'</button>' +
        (PODE.exportar ? '<button class="btn btn-secondary" onclick="benefExportar()">⬇ Excel</button>' : '') +
        '<button class="btn '+(nPend?'btn-primary':'btn-secondary')+'" onclick="benefSalvar()">💾 Salvar'+(nPend?(' ('+nPend+')'):'')+'</button>' +
      '</div></div>' +
    (nPend ? '<div class="alert" style="background:#fef3c7;border:1px solid #f59e0b">✏️ <b>'+nPend+' linha(s) alterada(s) e ainda não salva(s).</b> Buscar e filtrar não perde o que você digitou; trocar de competência, sim (o sistema avisa antes).</div>' : '') +
    '<div class="card" style="margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:end">' +
      '<div class="form-group" style="margin:0"><label>Competência</label>' +
        '<input type="month" id="benef_comp" value="'+comp+'" onchange="benefTrocarComp(this.value)"></div>' +
      '<div class="form-group" style="margin:0;flex:1;min-width:180px"><label>Buscar</label>' +
        '<input id="benef_busca" placeholder="nome ou centro de custo" value="'+escapeHtml(_benef.busca||'')+'" oninput="benefBuscar(this.value)"></div>' +
    '</div>' +
    '<div class="card" style="overflow-x:auto"><table><thead><tr>' +
      '<th>Funcionário</th><th>Centro de Custo</th><th style="text-align:right">Vale café</th>' +
      '<th style="text-align:right">VA / VR</th><th style="text-align:right">Vale Transporte</th>' +
      '<th style="text-align:right">Passagem</th><th style="text-align:right">Liberação</th>' +
    '</tr></thead><tbody>' + lista.map(linha).join('') + '</tbody>' +
    '<tfoot><tr id="benef_totais"></tr></tfoot></table>' +
    (lista.length?'':'<div class="empty"><div class="empty-icon">🎟️</div>'+(busca?'Ninguém com esse nome':'Nenhum funcionário ativo na Folha Interna')+'</div>') +
    '</div>';
  benefTotais();
}

/* Totaliza o que está VISÍVEL — filtrou por centro de custo, o total é daquele
   centro. É o que a pessoa espera de uma planilha filtrada. */
function benefTotais(){
  const tr = document.getElementById('benef_totais'); if(!tr) return;
  const soma = {}; BENEF_CAMPOS.forEach(function(c){ soma[c] = 0; });
  _benef.visiveis.forEach(function(fid){ BENEF_CAMPOS.forEach(function(c){ soma[c] += benefValor(fid, c); }); });
  const geral = BENEF_CAMPOS.reduce(function(a,c){ return a+soma[c]; }, 0);
  tr.innerHTML = '<th colspan="2" style="text-align:right">TOTAL ('+_benef.visiveis.length+')</th>' +
    BENEF_CAMPOS.map(function(c){ return '<th style="text-align:right">'+folhaMoney(soma[c])+'</th>'; }).join('') +
    '<th style="text-align:right;background:#e5e7eb">'+folhaMoney(geral)+'</th>';
}

function benefBuscar(v){
  _benef.busca = v; benefDesenhar();
  const el=document.getElementById('benef_busca');
  if(el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} }
}

async function benefTrocarComp(v){
  if(!/^\d{4}-\d{2}$/.test(String(v||''))) return;
  if(v === _benef.comp) return;
  if(benefDiferencas().length &&
     !confirm('Há alterações não salvas em '+fopagCompLabel(_benef.comp)+'.\n\n' +
              'Trocar de mês agora DESCARTA o que você digitou. Continuar?')){
    const el=document.getElementById('benef_comp'); if(el) el.value=_benef.comp; return;
  }
  _benef.comp = v; _benef.pend = {}; renderFolhaBenef();
}

/* O que mudou em relação ao banco. Percorre TODOS os ativos, não só os
   visíveis: filtrar a tela não pode esconder alteração na hora de salvar. */
function benefDiferencas(){
  const out = [];
  benefAtivos().forEach(function(f){
    const b = _benef.linhas[f.id] || null;
    const novo = {}; let mudou = false, temAlgo = false;
    BENEF_CAMPOS.forEach(function(c){
      novo[c] = benefValor(f.id, c);
      if(novo[c] !== 0) temAlgo = true;
      if(Math.abs(novo[c] - (b ? (Number(b[c])||0) : 0)) > 0.004) mudou = true;
    });
    if(mudou && (b || temAlgo)) out.push({fid:f.id, valores:novo});
  });
  return out;
}

async function benefSalvar(){
  const difs = benefDiferencas();
  if(!difs.length){ toast('Nada mudou — nenhuma linha para salvar'); return; }
  const agora = new Date().toISOString();
  /* `liberacao` FICA DE FORA: é coluna calculada no banco. Mandar faz o
     PostgREST recusar a linha inteira. */
  const linhas = difs.map(function(d){
    return {funcionario_id:d.fid, competencia:_benef.comp,
            vale_cafe:d.valores.vale_cafe, va_vr:d.valores.va_vr,
            vale_transporte:d.valores.vale_transporte, passagem:d.valores.passagem,
            atualizado_em:agora};
  });
  toast('Salvando '+linhas.length+' linha(s)…');
  const {error} = await sb.from('folha_beneficios')
    .upsert(linhas, {onConflict:'funcionario_id,competencia'});
  if(error){ console.error('benefSalvar', error); toast('Erro ao salvar: '+error.message,'err'); return; }
  const r = await benefLoad(_benef.comp);
  if(r.erro){ toast('Salvou, mas não consegui reler: '+r.erro.message,'warn'); return; }
  _benef.linhas = r.linhas; _benef.pend = {};
  toast(linhas.length+' linha(s) salva(s) ✓');
  benefDesenhar();
}

async function benefCopiarMesAnterior(){
  const ant = benefCompAnterior(_benef.comp);
  if(!confirm('Trazer os valores de '+fopagCompLabel(ant)+' para '+fopagCompLabel(_benef.comp)+'?\n\n' +
              'Preenche a tela para conferir. NADA é gravado até você clicar em 💾 Salvar.')) return;
  const r = await benefLoad(ant);
  if(r.erro){ toast('Não consegui ler '+fopagCompLabel(ant)+': '+r.erro.message,'err'); return; }
  const origem = r.linhas || {};
  let n = 0;
  benefAtivos().forEach(function(f){
    const b = origem[f.id]; if(!b) return;
    if(!_benef.pend[f.id]) _benef.pend[f.id] = {};
    BENEF_CAMPOS.forEach(function(c){ _benef.pend[f.id][c] = Number(b[c])||0; });
    n++;
  });
  benefDesenhar();
  if(n) toast(n+' pessoa(s) preenchida(s) — confira e clique em Salvar');
  else toast('Não havia benefícios lançados em '+fopagCompLabel(ant),'warn');
}

/* Exporta o que está na TELA (com filtro e com o que foi digitado), não o que
   está no banco — senão exportar antes de salvar devolveria o mês passado. */
async function benefExportar(){
  try{
    if(!_benef.visiveis.length){ toast('Nada para exportar','warn'); return; }
    if(!window.XLSX) await folhaLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const cab = ['Funcionário','Centro de Custo','Vale café','VA / VR','Vale Transporte','Passagem','Liberação'];
    const linhas = [];
    _benef.visiveis.forEach(function(fid){
      const f = DB.folhaFuncs.find(function(x){ return x.id===fid; }); if(!f) return;
      const v = BENEF_CAMPOS.map(function(c){ return benefValor(fid,c); });
      linhas.push([f.nome||'', folhaCCNome(f.centro_custo_id)||''].concat(v, [v.reduce(function(a,b){return a+b;},0)]));
    });
    const ws = XLSX.utils.aoa_to_sheet([cab].concat(linhas));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Benefícios');
    XLSX.writeFile(wb, 'Beneficios - '+_benef.comp+'.xlsx');
  }catch(e){ toast('Erro ao exportar: '+(e.message||e),'err'); }
}
/* ============================================================================
   FOLHA INTERNA — SINDICATOS E TURNOS  (pedido do DP, 30/07/2026)
   Eram campos de TEXTO LIVRE em `folha_funcionarios`. Cada pessoa digitava de um
   jeito ("SINTRACON", "Sintracon-SP", "sintracon sp"), o que não agrupa em
   relatório nem serve para o motor de cálculo da fase 3. Viraram cadastros, no
   mesmo padrão do centro de custo.
   As colunas de texto continuam sendo gravadas com o nome escolhido, porque os
   relatórios e o histórico de alterações já existentes leem de lá.
   ============================================================================ */
/* Reusa o MESES_PT que já existe no app (0-indexado, MAIÚSCULO) — declarar um
   segundo com o mesmo nome quebrava o script inteiro. */
function folhaSindRotulo(s){ return (s.sigla ? s.sigla+' — ' : '') + (s.nome||''); }
function folhaTurnoRotulo(t){
  const h = v => v ? String(v).slice(0,5) : '';
  const faixa = (t.entrada||t.saida) ? ' ('+h(t.entrada)+'–'+h(t.saida)+')' : '';
  return (t.nome||'') + faixa;
}
/* <option>s de um cadastro. `legado` é o texto antigo digitado à mão: se o
   funcionário tem texto mas nenhum vínculo, ele aparece como opção marcada para
   o DP não perder de vista o que estava lá. */
function _optCad(lista, idAtual, legado, rotulo){
  const opts = ['<option value="">--</option>'];
  (lista||[]).filter(x=>x.ativo!==false || x.id===idAtual).forEach(function(x){
    opts.push('<option value="'+x.id+'"'+(String(x.id)===String(idAtual)?' selected':'')+'>'+escapeHtml(rotulo(x))+'</option>');
  });
  if(!idAtual && legado) opts.push('<option value="" selected>'+escapeHtml(legado)+' (texto antigo — escolha na lista)</option>');
  return opts.join('');
}
/* Experiência 45 + 45 (limite legal são 90 dias somados).
   O 1º período TERMINA no 45º dia contado a partir da admissão, por isso +44. */
function folhaCalcExp(){
  const adm = document.getElementById('fi_adm');
  const e1 = document.getElementById('fi_exp1'), e2 = document.getElementById('fi_exp2');
  if(!adm || !adm.value || !e1 || !e2) return;
  e1.value = plusDays(44, adm.value);
  e2.value = plusDays(45, e1.value);
}

/* ============================================================================
   TURNO POR DIA DA SEMANA  (v.130)
   Antes o turno era um par entrada/saída só. Na obra isso nunca fecha: seg a
   qui 7h–17h, sexta até 16h, sábado alternado. Sem os dias, a carga semanal
   era um número digitado no chute — e a hora extra da fase 3 nasceria errada.
   Guardamos em `folha_turnos.dias` (jsonb): {"1":{e,s,i}, ...}, 1=segunda e
   7=domingo. Dia que não está no objeto é folga. Turno antigo (sem `dias`)
   continua valendo: cai no par entrada/saída de segunda a sexta.
   ========================================================================= */
const TURNO_DIAS = [['1','Segunda'],['2','Terça'],['3','Quarta'],['4','Quinta'],['5','Sexta'],['6','Sábado'],['7','Domingo']];
const TURNO_DIAS_CURTO = {'1':'Seg','2':'Ter','3':'Qua','4':'Qui','5':'Sex','6':'Sáb','7':'Dom'};

function turnoDias(t){
  if(t && t.dias && typeof t.dias==='object' && Object.keys(t.dias).length) return t.dias;
  if(!t || !t.entrada || !t.saida) return {};
  const d={}; ['1','2','3','4','5'].forEach(function(k){
    d[k]={e:String(t.entrada).slice(0,5), s:String(t.saida).slice(0,5), i:(t.intervalo_min!=null?t.intervalo_min:60)};
  });
  return d;
}
function _turnoMin(hhmm){ const m=/^(\d{1,2}):(\d{2})/.exec(String(hhmm||'')); return m?(Number(m[1])*60+Number(m[2])):null; }
/* Soma da semana. Vira-noite (saída menor que entrada) conta até o dia seguinte. */
function turnoHorasSemana(t){
  const d=turnoDias(t); let tot=0, achou=false;
  Object.keys(d).forEach(function(k){
    const e=_turnoMin(d[k].e), sa=_turnoMin(d[k].s); if(e==null||sa==null) return;
    let dur = sa - e; if(dur<0) dur += 1440;
    dur -= (d[k].i!=null?Number(d[k].i)||0:0);
    if(dur>0){ tot+=dur; achou=true; }
  });
  return achou ? Math.round(tot/60*100)/100 : null;
}
/* "Seg a Sex 07:00–17:00 · Sáb 07:00–11:00": agrupa dias seguidos de mesmo horário. */
function turnoResumoDias(t){
  const d=turnoDias(t); const ks=Object.keys(d).filter(k=>d[k]&&d[k].e&&d[k].s).sort();
  if(!ks.length) return '<span style="color:var(--muted)">sem dias definidos</span>';
  const blocos=[]; let atual=null;
  ks.forEach(function(k){
    const rot=d[k].e+'–'+d[k].s;
    if(atual && atual.rot===rot && Number(k)===Number(atual.fim)+1){ atual.fim=k; return; }
    atual={ini:k, fim:k, rot:rot}; blocos.push(atual);
  });
  return blocos.map(function(b){
    const dias = b.ini===b.fim ? TURNO_DIAS_CURTO[b.ini]
               : (Number(b.fim)-Number(b.ini)===1 ? TURNO_DIAS_CURTO[b.ini]+' e '+TURNO_DIAS_CURTO[b.fim]
                                                  : TURNO_DIAS_CURTO[b.ini]+' a '+TURNO_DIAS_CURTO[b.fim]);
    return '<b>'+dias+'</b> '+b.rot;
  }).join(' · ');
}

    const dias=_turnoLerDias();
    if(!Object.keys(dias).length){ toast('Marque pelo menos um dia da semana','err'); return false; }
    /* entrada/saida/intervalo continuam gravados como o padrão do turno — é o
       1º dia marcado. Telas e relatórios antigos que leem essas colunas seguem
       funcionando; a verdade completa está em `dias`. */
    const k1=Object.keys(dias).sort()[0]; const base=dias[k1];
    const carga=document.getElementById('ft_carga').value;
    const payload={nome:nome, dias:dias, entrada:base.e||null, saida:base.s||null,
      intervalo_min: base.i!=null?Number(base.i):null,
      carga_semanal: carga!==''?Number(carga):null,

    const q = id ? sb.from('folha_turnos').update(payload).eq('id',id) : sb.from('folha_turnos').insert(payload);
    const {error}=await q;
    if(error){
      if(/dias/.test(error.message||'') && /column/i.test(error.message||''))
        toast('Falta rodar o SQL que cria a coluna `dias` em folha_turnos','err');
      else toast('Erro: '+error.message,'err');
      return false;
    }
    await folhaLoad(true); toast('Turno salvo'); renderFolhaTurnos(); return true;
  });
  _turnoRecalc();
}
function _turnoLinhaToggle(k){
  const on=document.querySelector('.ft_on[data-dia="'+k+'"]').checked;
  ['ft_e','ft_s','ft_i'].forEach(function(c){
    const el=document.querySelector('.'+c+'[data-dia="'+k+'"]'); if(el) el.disabled=!on;
  });
  _turnoRecalc();
}
function _turnoLerDias(){
  const out={};
  TURNO_DIAS.forEach(function(par){
    const k=par[0]; const ck=document.querySelector('.ft_on[data-dia="'+k+'"]');
    if(!ck||!ck.checked) return;
    const e=document.querySelector('.ft_e[data-dia="'+k+'"]').value;
    const sa=document.querySelector('.ft_s[data-dia="'+k+'"]').value;
    const iv=document.querySelector('.ft_i[data-dia="'+k+'"]').value;
    if(!e||!sa) return;
    out[k]={e:e, s:sa, i: iv!==''?Number(iv):0};
  });
  return out;
}
function _turnoRecalc(){
  const el=document.getElementById('ft_calc'); if(!el) return;
  const h=turnoHorasSemana({dias:_turnoLerDias()});
  el.textContent = h==null ? 'nenhum dia marcado' : ('a soma dos dias dá ' + h.toLocaleString('pt-BR') + 'h por semana');
  el.style.color = (h!=null && h>44) ? '#b45309' : 'var(--muted)';
}
function _turnoUsarCalculada(){
  const h=turnoHorasSemana({dias:_turnoLerDias()});
  if(h==null){ toast('Marque pelo menos um dia','err'); return; }
  document.getElementById('ft_carga').value=h;
}
function _turnoCopiarPrimeiro(){
  const dias=_turnoLerDias(); const ks=Object.keys(dias).sort();
  if(!ks.length){ toast('Marque pelo menos um dia','err'); return; }
  const base=dias[ks[0]];
  ks.slice(1).forEach(function(k){
    document.querySelector('.ft_e[data-dia="'+k+'"]').value=base.e;
    document.querySelector('.ft_s[data-dia="'+k+'"]').value=base.s;
    document.querySelector('.ft_i[data-dia="'+k+'"]').value=base.i;
  });
  _turnoRecalc();
}
function _turnoPreset(qual){
  const marcar = qual==='6x1' ? ['1','2','3','4','5','6'] : ['1','2','3','4','5'];
  TURNO_DIAS.forEach(function(par){
    const k=par[0]; const ck=document.querySelector('.ft_on[data-dia="'+k+'"]');
    if(ck){ ck.checked = marcar.indexOf(k)>=0; _turnoLinhaToggle(k); }
  });
  _turnoRecalc();
}

/* ============================================================================
   ===== FOLHA INTERNA — FASE 2: Relatórios + Export (PDF/Excel) + Import =====
   Reusa o loader _efmLoad e as libs XLSX (SheetJS) e pdf-lib já usadas no Efetivo.
   ============================================================================ */
function folhaLib(url){ return _efmLoad(url); }

/* ---- montagem de relatórios: retorna {titulo, colunas, linhas} ---- */
function folhaRelBuild(tipo, de, ate){
  const ativos=DB.folhaFuncs.filter(f=>f.ativo!==false);
  const tc=(f)=>FOLHA_TIPO_CONTRATO[f.tipo_contrato]||f.tipo_contrato||'';
  if(tipo==='custo_cc' || tipo==='custo_cargo'){
    const porCargo=tipo==='custo_cargo';
    const grupos={}; ativos.forEach(function(f){ const k=(porCargo?(f.cargo||'(sem cargo)'):(folhaCCNome(f.centro_custo_id)||'(sem centro)')); grupos[k]=grupos[k]||{n:0,tot:0}; grupos[k].n++; grupos[k].tot+=Number(f.salario_base)||0; });
    const linhas=Object.keys(grupos).sort().map(k=>[k, String(grupos[k].n), folhaMoney(grupos[k].tot)]);
    const tot=ativos.reduce((s,f)=>s+(Number(f.salario_base)||0),0);
    linhas.push(['TOTAL', String(ativos.length), folhaMoney(tot)]);
    return {titulo:(porCargo?'Custo por cargo':'Custo por centro de custo')+' (salário base)', colunas:[porCargo?'Cargo':'Centro de custo','Funcionários','Custo mensal'], linhas:linhas};
  }
  if(tipo==='admitidos' || tipo==='demitidos'){
    const campo=tipo==='admitidos'?'data_admissao':'data_demissao';
    const linhas=DB.folhaFuncs.filter(function(f){ const d=f[campo]; if(!d) return false; return (!de||d>=de) && (!ate||d<=ate); }).sort((a,b)=>(a[campo]||'').localeCompare(b[campo]||''))
      .map(f=>[folhaData(f[campo]), f.nome||'', f.cargo||'', folhaCCNome(f.centro_custo_id)||'', folhaMoney(f.salario_base)]);
    return {titulo:(tipo==='admitidos'?'Admitidos':'Demitidos')+' no período', colunas:[tipo==='admitidos'?'Admissão':'Demissão','Nome','Cargo','Centro de custo','Salário'], linhas:linhas};
  }
  if(tipo==='aniversariantes'){
    const m=(new Date()).getMonth()+1;
    const linhas=ativos.filter(f=>f.nascimento && (new Date(f.nascimento+'T00:00:00').getMonth()+1)===m).sort((a,b)=>(a.nascimento||'').slice(5).localeCompare((b.nascimento||'').slice(5)))
      .map(f=>[new Date(f.nascimento+'T00:00:00').toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}), f.nome||'', f.cargo||'']);
    return {titulo:'Aniversariantes do mês', colunas:['Data','Nome','Cargo'], linhas:linhas};
  }
  if(tipo==='experiencia'){
    const today=new Date(); today.setHours(0,0,0,0); const lim=new Date(today.getTime()+60*86400000); const linhas=[];
    ativos.forEach(f=>['exp1_fim','exp2_fim'].forEach(function(k){ if(f[k]){ const d=new Date(f[k]+'T00:00:00'); if(d>=today&&d<=lim) linhas.push([folhaData(f[k]), f.nome||'', k==='exp1_fim'?'1º período':'2º período', f.cargo||'']); } }));
    linhas.sort((a,b)=>a[0].localeCompare(b[0]));
    return {titulo:'Experiência vencendo (60 dias)', colunas:['Vence','Nome','Período','Cargo'], linhas:linhas};
  }
  if(tipo==='docs_vencendo'){
    const today=new Date(); today.setHours(0,0,0,0); const lim=new Date(today.getTime()+60*86400000); const linhas=[];
    DB.folhaDocs.forEach(function(d){ if(!d.validade) return; const f=DB.folhaFuncs.find(x=>x.id===d.funcionario_id); if(!f||f.ativo===false) return; const dv=new Date(d.validade+'T00:00:00'); if(dv<=lim) linhas.push([folhaData(d.validade), f.nome||'', FOLHA_DOC_TIPOS[d.tipo]||d.tipo, dv<today?'VENCIDO':'a vencer']); });
    linhas.sort((a,b)=>a[0].localeCompare(b[0]));
    return {titulo:'Documentos vencendo/vencidos (60 dias)', colunas:['Validade','Nome','Documento','Situação'], linhas:linhas};
  }
  if(tipo==='cadastro'){
    /* 06/10/2026: todas as colunas da ficha, com os MESMOS cabeçalhos do modelo
       de importação — o Excel sai pronto para corrigir e importar de volta
       (com "Atualizar quem já está cadastrado"). */
    const campos=FOLHA_IMP_CAMPOS.filter(c=>_folhaTemDocsPessoais || !c[7]);
    const fmt=function(c, f){

      if(k==='__cc') return folhaCCNome(f.centro_custo_id)||'';
      if(k==='__turno') return f.turno||'';
      if(k==='__sind') return f.sindicato||'';
      const v=f[k];
      if(t==='simnao') return v?'Sim':'Não';
      if(v==null||v==='') return '';

      if(t==='contrato') return FOLHA_TIPO_CONTRATO[v]||v;
      if(t==='titulo') return folhaTituloFmt(v);
      return String(v);
    };
    return {titulo:'Cadastro completo', modelo:true, colunas:campos.map(c=>c[0]).concat(['Situação']),
      linhas: DB.folhaFuncs.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(f=>campos.map(c=>fmt(c,f)).concat([f.ativo===false?'Arquivado':'Ativo']))};
  }
  // relacao (padrão)
  return {titulo:'Relação de funcionários', colunas:['Nome','CPF','Matrícula','Cargo','Departamento','Centro de custo','Contrato','Admissão','Salário','Situação'],
    linhas: DB.folhaFuncs.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(f=>[f.nome||'', f.cpf||'', f.matricula||'', f.cargo||'', f.departamento||'', folhaCCNome(f.centro_custo_id)||'', tc(f), folhaData(f.data_admissao), folhaMoney(f.salario_base), f.ativo===false?'Arquivado':'Ativo'])};

function _impNorm(s){ return String(s==null?'':s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,' ').trim(); }
function _soDig(v){ return String(v==null?'':v).replace(/\D/g,''); }
function folhaCpfValido(v){
  const c=_soDig(v); if(c.length!==11 || /^(\d)\1{10}$/.test(c)) return false;
  let s=0; for(let i=0;i<9;i++) s+=Number(c[i])*(10-i); let d=(s*10)%11; if(d===10) d=0; if(d!==Number(c[9])) return false;
  s=0; for(let i=0;i<10;i++) s+=Number(c[i])*(11-i); d=(s*10)%11; if(d===10) d=0; return d===Number(c[10]);
}
function folhaCpfFmt(v){ const c=_soDig(v).padStart(11,'0'); return c.slice(0,3)+'.'+c.slice(3,6)+'.'+c.slice(6,9)+'-'+c.slice(9); }
function folhaPisValido(v){
  const c=_soDig(v); if(c.length!==11) return false; const p=[3,2,9,8,7,6,5,4,3,2];
  let s=0; for(let i=0;i<10;i++) s+=Number(c[i])*p[i]; let d=11-(s%11); if(d>=10) d=0; return d===Number(c[10]);
}
/* data da planilha -> 'AAAA-MM-DD' | null (vazio) | undefined (inválida) */
function folhaImportData(v){
  if(v==null||v==='') return null;
  let y,m,d;
  if(v instanceof Date){ if(isNaN(v)) return undefined; const x=new Date(v.getTime()-v.getTimezoneOffset()*60000); y=x.getUTCFullYear(); m=x.getUTCMonth()+1; d=x.getUTCDate(); }
  else if(typeof v==='number'){
    if(window.XLSX && XLSX.SSF && XLSX.SSF.parse_date_code){ const o=XLSX.SSF.parse_date_code(v); if(!o) return undefined; y=o.y; m=o.m; d=o.d; }
    else { const x=new Date(Math.round((v-25569)*86400*1000)); y=x.getUTCFullYear(); m=x.getUTCMonth()+1; d=x.getUTCDate(); }
  } else {
    const s=String(v).trim(); let r;
    if((r=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})(?:[T ].*)?$/))){ y=+r[1]; m=+r[2]; d=+r[3]; }
    else if((r=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/))){ d=+r[1]; m=+r[2]; y=+r[3]; if(y<100) y += (y>40?1900:2000); }
    else return undefined;
  }
  const t=new Date(Date.UTC(y,m-1,d));
  if(t.getUTCFullYear()!==y || t.getUTCMonth()!==m-1 || t.getUTCDate()!==d || y<1900 || y>2100) return undefined;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}
/* valor em reais -> número | null (vazio) | NaN (inválido). folhaImportNum (benefícios) segue devolvendo 0 no vazio/inválido. */
function folhaImportValor(v){
  if(v==null||v==='') return null; if(typeof v==='number') return v;
  let s=String(v).trim().replace(/^R\$\s*/i,'').replace(/\s/g,'');
  if(!/^-?[\d.,]+$/.test(s)) return NaN;
  if(s.indexOf(',')>-1) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s)) s=s.replace(/\./g,'');
  const n=Number(s); return isFinite(n)?n:NaN;
}
function folhaImportNum(v){ const n=folhaImportValor(v); return (n==null||isNaN(n))?0:n; }

const _UFS=['AC','AL','AP','AM','BA','CE','DF','ES','GO','MA','MT','MS','MG','PA','PB','PR','PE','PI','RJ','RN','RS','RO','RR','SC','SP','SE','TO'];
const _EST_CIVIL={'solteiro':'Solteiro(a)','solteira':'Solteiro(a)','solteiro a':'Solteiro(a)','casado':'Casado(a)','casada':'Casado(a)','casado a':'Casado(a)',
  'uniao estavel':'União estável','divorciado':'Divorciado(a)','divorciada':'Divorciado(a)','divorciado a':'Divorciado(a)','separado':'Separado(a)','separada':'Separado(a)','separado a':'Separado(a)',

const _PARENT={'conjuge':'Cônjuge','esposa':'Cônjuge','esposo':'Cônjuge','companheiro':'Cônjuge','companheira':'Cônjuge','filho':'Filho(a)','filha':'Filho(a)','filho a':'Filho(a)',

const _CONTRATO={'clt':'clt','estagio':'estagio','estagiario':'estagio','estagiaria':'estagio','aprendiz':'aprendiz','jovem aprendiz':'aprendiz','pj':'pj','pessoa juridica':'pj','temporario':'temporario','temporaria':'temporario'};
