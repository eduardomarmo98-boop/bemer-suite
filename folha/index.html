/* grau de instrução: texto da lista (com ou sem "ensino"), código eSocial 1..12 ou os nomes de sempre */
function folhaInstrucaoImp(v){
  let n=_impNorm(v).replace(/^(ensino|educacao) /,'');
  if(/^\d{1,2}$/.test(n)){ const i=Number(n); return (i>=1 && i<=12) ? FOLHA_INSTRUCAO[i-1] : null; }
  const porNome={}; FOLHA_INSTRUCAO.forEach(o=>{ porNome[_impNorm(o)]=o; });
  if(porNome[n]) return porNome[n];
  const alias={'analfabeta':0,'fundamental completo':4,'1 grau completo':4,'primeiro grau completo':4,
    'medio incompleto':5,'2 grau incompleto':5,'segundo grau incompleto':5,
    'medio completo':6,'2 grau completo':6,'segundo grau completo':6,
    'superior incompleto':7,'graduacao incompleta':7,'superior completo':8,'graduacao completa':8,'graduado':8,
    'pos graduacao':9,'pos graduacao completa':9,'pos graduado':9,'especializacao':9,
    'mestrado':10,'mestre':10,'doutorado':11,'doutor':11};
  return (n in alias) ? FOLHA_INSTRUCAO[alias[n]] : null;
}
/* converte UMA célula conforme o tipo. Devolve {v} (valor; undefined = vazio) ou {erro} / {aviso} */
function _impCelula(tipo, bruto, rot){
  if(typeof bruto==='number' && (tipo==='cpf'||tipo==='pis')) bruto=String(Math.round(bruto)).padStart(11,'0');
  if(typeof bruto==='number' && tipo==='cep') bruto=String(Math.round(bruto)).padStart(8,'0');
  const vazio = bruto==null || String(bruto).trim()==='';
  if(vazio) return {v:undefined};
  const s=String(bruto).trim(), n=_impNorm(bruto);
  switch(tipo){
    case 'texto': return {v:s};
    case 'cpf': { if(!folhaCpfValido(bruto)) return {erro:rot+' inválido ('+s+')'}; return {v:folhaCpfFmt(bruto)}; }
    case 'pis': { const d=_soDig(bruto); return folhaPisValido(d) ? {v:d} : {v:d||s, aviso:rot+' com dígito que não confere ('+s+') — gravado assim mesmo'}; }
    case 'data': { const d=folhaImportData(bruto); return d===undefined ? {erro:rot+': data inválida ('+s+') — use DD/MM/AAAA'} : {v:d}; }
    case 'valor': { const x=folhaImportValor(bruto); if(isNaN(x)) return {erro:rot+': valor inválido ('+s+')'}; if(x<0) return {erro:rot+' negativo'}; if(x>1000000) return {erro:rot+' fora do normal ('+s+')'}; return {v:Math.round(x*100)/100}; }
    case 'simnao': { if(['sim','s','x','1','true','verdadeiro','yes'].includes(n)) return {v:true}; if(['nao','n','0','false','falso','no'].includes(n)) return {v:false}; return {erro:rot+': use Sim ou Não ('+s+')'}; }
    case 'sexo': { const m={'m':'Masculino','masculino':'Masculino','f':'Feminino','feminino':'Feminino','outro':'Outro'}[n]; return m?{v:m}:{erro:'Sexo inválido ('+s+') — Masculino, Feminino ou Outro'}; }
    case 'estado_civil': { const m=_EST_CIVIL[n]; return m?{v:m}:{v:s, aviso:'Estado civil fora da lista ('+s+') — gravado como está'}; }
    case 'parentesco': { const m=_PARENT[n]; return m?{v:m}:{erro:'Parentesco inválido ('+s+')'}; }
    case 'contrato': { const m=_CONTRATO[n]; return m?{v:m}:{erro:'Tipo de contrato inválido ('+s+') — CLT, Estágio, Aprendiz, PJ ou Temporário'}; }
    case 'uf': { const u=s.toUpperCase(); return _UFS.includes(u)?{v:u}:{erro:rot+' inválida ('+s+')'}; }
    case 'cep': { const d=_soDig(bruto); return d.length===8 ? {v:d.slice(0,5)+'-'+d.slice(5)} : {v:s, aviso:'CEP com '+d.length+' dígitos ('+s+')'}; }
    case 'email': { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s) ? {v:s.toLowerCase()} : {v:s, aviso:'E-mail estranho ('+s+')'}; }
    /* documentos pessoais (06/10/2026) */
    case 'doc':   { const u=s.toUpperCase().replace(/[^0-9A-Z.\-\/ ]/g,'').slice(0,20); return u ? {v:u} : {erro:rot+' inválido ('+s+')'}; }
    case 'sigla': { const u=s.toUpperCase().replace(/[^A-Z\/\- ]/g,'').trim().slice(0,12); return u ? {v:u} : {erro:rot+' inválido ('+s+') — use a sigla, ex.: SSP'}; }
    case 'digitos': { const d=(typeof bruto==='number') ? String(Math.round(bruto)) : _soDig(bruto); if(!d) return {erro:rot+': só números ('+s+')'}; if(d.length>14) return {erro:rot+' longo demais ('+s+')'}; return /[A-Za-z]/.test(s) ? {v:d, aviso:rot+': tirei as letras ('+s+' → '+d+')'} : {v:d}; }
    case 'cnh_cat': { const u=s.toUpperCase().replace(/[^A-Z]/g,''); return FOLHA_CNH_CAT.includes(u) ? {v:u} : {erro:'Categoria da CNH inválida ('+s+') — A, B, AB, C, D, E, AC, AD, AE ou ACC'}; }
    case 'raca': { const m=_RACA_IMP[n]; return m ? {v:m} : {erro:'Raça/cor inválida ('+s+') — Branca, Preta, Parda, Amarela, Indígena ou Não informada'}; }
    case 'instrucao': { const m=folhaInstrucaoImp(s); return m ? {v:m} : {erro:'Grau de instrução fora da lista ('+s+') — use o texto ou o código eSocial 01 a 12'}; }
  }
  return {v:s};
}
/* acha a coluna da planilha para cada campo (cabeçalho ou nome alternativo, sem acento/caixa) */
function _impMapa(cabecalhos, campos){
  const porNome={}; cabecalhos.forEach(h=>{ porNome[_impNorm(h)]=h; });
  const mapa={}, usadas=new Set();
  campos.forEach(c=>{ for(const nome of [c[0]].concat(c[5])){ const h=porNome[_impNorm(nome)]; if(h!=null && !usadas.has(h)){ mapa[c[1]]=h; usadas.add(h); break; } } });
  const sobrando=cabecalhos.filter(h=>!usadas.has(h) && String(h).trim() && !/^__EMPTY/.test(h));
  return {mapa, sobrando};
}
function _impAba(wb, nomes){
  const alvo=nomes.map(_impNorm);
  const n=wb.SheetNames.find(s=>alvo.includes(_impNorm(s)));
  return n ? wb.Sheets[n] : null;
}

/* 1) ler e conferir — NADA é gravado aqui */
async function folhaImportRun(){
  const arq=$('fim_arq') && $('fim_arq').files[0];
  if(!arq){ toast('Selecione o arquivo','err'); return false; }
  const st=$('fim_status'); const diz=t=>{ if(st) st.textContent=t; };
  diz('Lendo arquivo…');
  try{
    if(!window.XLSX) await folhaLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(new Uint8Array(await arq.arrayBuffer()),{type:'array',cellDates:false,raw:false});
    const wsF=_impAba(wb,['Funcionários','Funcionarios','Modelo']) || wb.Sheets[wb.SheetNames[0]];
    const wsD=_impAba(wb,['Dependentes']);
    const ler=ws=>XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
    const cabec=ws=>((XLSX.utils.sheet_to_json(ws,{header:1,raw:false})[0])||[]).map(h=>String(h).replace(/\s*\*\s*$/,'').trim());
    const rowsF=ler(wsF);
    /* cabeçalho com " *" (obrigatório no modelo): tira o asterisco para casar */
    const limpaChaves=rows=>rows.map(r=>{ const o={}; Object.keys(r).forEach(k=>o[String(k).replace(/\s*\*\s*$/,'').trim()]=r[k]); return o; });
    const linhasF=limpaChaves(rowsF), linhasD=wsD?limpaChaves(ler(wsD)):[];
    const mF=_impMapa(cabec(wsF), FOLHA_IMP_CAMPOS), mD=wsD?_impMapa(cabec(wsD), FOLHA_IMP_DEP):{mapa:{},sobrando:[]};
    if(!mF.mapa.nome){ diz(''); toast('Não achei a coluna "Nome" na aba de funcionários.','err'); return false; }
    const atualiza=!!($('fim_atualiza')&&$('fim_atualiza').checked);
    const existentes={}; DB.folhaFuncs.forEach(f=>{ const c=_soDig(f.cpf); if(c.length===11) existentes[c]=f; });
    const ccPorNome={}; DB.folhaCC.forEach(c=>ccPorNome[_impNorm(c.nome)]=c);
    const turnoPorNome={}; DB.folhaTurnos.forEach(t=>turnoPorNome[_impNorm(t.nome)]=t);
    const sindPorNome={}; DB.folhaSind.forEach(s=>{ if(s.sigla) sindPorNome[_impNorm(s.sigla)]=s; sindPorNome[_impNorm(s.nome)]=s; sindPorNome[_impNorm(folhaSindRotulo(s))]=s; });
    const vistos={};
    const linhas=[];
    linhasF.forEach(function(row, i){
      const L={n:i+2, dados:{}, erros:[], avisos:[], cc:null, ccNovo:'', turno:null, sind:null};
      const vazia=FOLHA_IMP_CAMPOS.every(c=>{ const h=mF.mapa[c[1]]; return !h || String(row[h]==null?'':row[h]).trim()===''; });
      if(vazia) return;
      FOLHA_IMP_CAMPOS.forEach(function(c){
        const h=mF.mapa[c[1]]; if(!h) return;
        const r=_impCelula(c[2], row[h], c[0]);
        if(r.erro) L.erros.push(r.erro); if(r.aviso) L.avisos.push(r.aviso);
        if(r.v!==undefined && !r.erro) L.dados[c[1]]=r.v;
      });
      const d=L.dados;
      if(!d.nome) L.erros.push('Nome vazio');
      if(d.nascimento && d.nascimento>hoje()) L.erros.push('Nascimento no futuro');
      if(d.nascimento && d.data_admissao && d.data_admissao<d.nascimento) L.erros.push('Admissão antes do nascimento');
      if(d.data_demissao && d.data_admissao && d.data_demissao<d.data_admissao) L.erros.push('Demissão antes da admissão');
      if(d.exp1_fim && d.data_admissao && d.exp1_fim<d.data_admissao) L.erros.push('Fim da 1ª experiência antes da admissão');
      if(d.exp2_fim && d.exp1_fim && d.exp2_fim<d.exp1_fim) L.erros.push('Fim da 2ª experiência antes da 1ª');
      if(d.data_admissao && !d.exp1_fim && !d.exp2_fim && !d.data_demissao && (d.tipo_contrato||'clt')==='clt'){ d.exp1_fim=plusDays(44,d.data_admissao); d.exp2_fim=plusDays(45,d.exp1_fim); }
      if(d.__cc){ const c=ccPorNome[_impNorm(d.__cc)]; if(c) L.cc=c; else { L.ccNovo=d.__cc; L.avisos.push('Centro de custo novo: "'+d.__cc+'" (será criado)'); } }
      if(d.__turno){ const t=turnoPorNome[_impNorm(d.__turno)]; if(t) L.turno=t; else L.avisos.push('Turno "'+d.__turno+'" não está cadastrado — fica só como texto'); }
      if(d.__sind){ const s=sindPorNome[_impNorm(d.__sind)]; if(s) L.sind=s; else L.avisos.push('Sindicato "'+d.__sind+'" não está cadastrado — fica só como texto'); }
      const cpf=_soDig(d.cpf);
      if(!d.cpf && !L.erros.some(e=>/^CPF/.test(e))) L.avisos.push('Sem CPF: não dá para achar duplicado nem ligar dependentes');
      if(cpf && vistos[cpf]) L.erros.push('CPF repetido na planilha (linha '+vistos[cpf]+')');
      else if(cpf) vistos[cpf]=L.n;
      L.existente = cpf ? existentes[cpf] : null;
      /* documentos pessoais: Excel come o zero da esquerda de número digitado como número */
      [['titulo_eleitor',12],['cnh_numero',11]].forEach(function(z){
        const h=mF.mapa[z[0]]; if(d[z[0]] && h && typeof row[h]==='number' && d[z[0]].length<z[1]) d[z[0]]=d[z[0]].padStart(z[1],'0');
      });
      if(FOLHA_IMP_CAMPOS.some(c=>c[7] && d[c[1]]!==undefined)){
        const ex=L.existente||{};
        const vd=folhaDocpValidar(Object.assign({}, d, {cnh_categoria: d.cnh_categoria || ex.cnh_categoria || '', cnh_numero: d.cnh_numero || ''}),
                                  d.nascimento || ex.nascimento || null);
        vd.erros.forEach(e=>L.erros.push(e)); vd.avisos.forEach(e=>L.avisos.push(e));
      }
      L.situacao = L.erros.length ? 'erro' : (L.existente ? (atualiza ? 'atualiza' : 'ignora') : 'novo');
      linhas.push(L);
    });
    /* dependentes */
    const cpfsPlanilha={}, cpfsErro={}; linhas.forEach(L=>{ const c=_soDig(L.dados.cpf); if(c && L.situacao!=='erro') cpfsPlanilha[c]=L; else if(c) cpfsErro[c]=L; });
    const deps=[];
    linhasD.forEach(function(row, i){
      const D_={n:i+2, dados:{}, erros:[], avisos:[]};
      const vazia=FOLHA_IMP_DEP.every(c=>{ const h=mD.mapa[c[1]]; return !h || String(row[h]==null?'':row[h]).trim()===''; });
      if(vazia) return;
      FOLHA_IMP_DEP.forEach(function(c){
        const h=mD.mapa[c[1]]; if(!h) return;
        const r=_impCelula(c[2], row[h], c[0]);
        if(r.erro) D_.erros.push(r.erro); if(r.aviso) D_.avisos.push(r.aviso);
        if(r.v!==undefined && !r.erro) D_.dados[c[1]]=r.v;
      });
      const d=D_.dados;
      if(!d.nome) D_.erros.push('Nome do dependente vazio');
      if(d.nascimento && d.nascimento>hoje()) D_.erros.push('Nascimento no futuro');
      const fc=_soDig(d.__func_cpf);
      if(!fc){ if(!D_.erros.some(e=>/CPF do funcion/.test(e))) D_.erros.push('CPF do funcionário vazio'); }
      else {
        D_.linhaFunc=cpfsPlanilha[fc]||null; D_.funcExist=existentes[fc]||null;
        if(D_.linhaFunc && D_.linhaFunc.situacao==='ignora') D_.linhaFunc=null;   // titular ignorado: dependente vai para o cadastro existente
        if(!D_.linhaFunc && !D_.funcExist) D_.erros.push(cpfsErro[fc] ? 'O funcionário dele (linha '+cpfsErro[fc].n+') está com erro' : 'Funcionário com este CPF não está na aba Funcionários nem cadastrado');
        const alvo=D_.funcExist && (!D_.linhaFunc || D_.linhaFunc.situacao!=='novo') ? D_.funcExist : null;
        if(alvo){
          const ja=DB.folhaDeps.some(x=>x.funcionario_id===alvo.id && ((d.cpf && _soDig(x.cpf)===_soDig(d.cpf)) || _impNorm(x.nome)===_impNorm(d.nome)));
          if(ja) D_.ja=true;
        }
      }
      if(!d.parentesco) d.parentesco='Filho(a)';
      D_.situacao = D_.erros.length ? 'erro' : (D_.ja ? 'ignora' : 'novo');
      deps.push(D_);
    });
    /* colunas de documentos pessoais na planilha, mas o banco ainda sem elas */
    const docpSemBanco = _folhaTemDocsPessoais ? [] : FOLHA_IMP_CAMPOS.filter(c=>c[7] && mF.mapa[c[1]] && linhas.some(L=>L.dados[c[1]]!==undefined)).map(c=>c[0]);
    _imp={linhas, deps, atualiza, arquivo:arq.name, sobrando:mF.sobrando.concat(mD.sobrando), temAbaDep:!!wsD, docpSemBanco};
    diz('');
    folhaImportPrevia();
    return false;   // a prévia substitui o conteúdo do modal
  }catch(e){ console.error('import',e); diz(''); toast('Erro ao ler a planilha: '+(e.message||e),'err'); return false; }
}

function _impRot(s){ return {novo:'<span class="status ok">Novo</span>', atualiza:'<span class="status info">Atualiza</span>', ignora:'<span class="status warn">Já existe — ignorado</span>', erro:'<span class="status crit">Erro</span>'}[s]||s; }
/* 2) prévia */

/* 3) gravar e 4) relatório */
async function folhaImportGravar(){
  const I=_imp; if(!I) return false;
  if(!PODE.importar){ toast('Seu perfil não importa planilha da folha.','err'); return false; }
  const agora=new Date().toISOString();
  const rel=[];   // [aba, linha, nome, resultado, detalhe]
  const motivo='Importação de planilha ('+I.arquivo+')';
  /* centros de custo novos (só os das linhas que vão entrar) */
  const vaoGravar=I.linhas.filter(L=>L.situacao==='novo'||L.situacao==='atualiza');
  const novosCC=[...new Map(vaoGravar.filter(L=>L.ccNovo).map(L=>[_impNorm(L.ccNovo), L.ccNovo])).values()];
  const ccCriado={};
  if(novosCC.length){
    const {data,error}=await sb.from('folha_centros_custo').insert(novosCC.map(n=>({nome:n,ativo:true}))).select();
    if(error) toast('Centros de custo novos não foram criados: '+error.message,'warn');
    else (data||[]).forEach(c=>ccCriado[_impNorm(c.nome)]=c.id);
  }
  function payloadDe(L, completo){
    const d=L.dados, p={};
    FOLHA_IMP_CAMPOS.forEach(c=>{ if(c[1].indexOf('__')===0) return; if(c[7] && !_folhaTemDocsPessoais) return; if(d[c[1]]!==undefined) p[c[1]]=d[c[1]]; });
    if(L.cc) p.centro_custo_id=L.cc.id; else if(L.ccNovo && ccCriado[_impNorm(L.ccNovo)]) p.centro_custo_id=ccCriado[_impNorm(L.ccNovo)];
    if(d.__turno!==undefined){ p.turno = L.turno ? (L.turno.nome||'') : d.__turno; if(_folhaTemCadastros) p.turno_id = L.turno ? L.turno.id : null; }
    if(d.__sind!==undefined){ p.sindicato = L.sind ? (L.sind.sigla||L.sind.nome||'') : d.__sind; if(_folhaTemCadastros) p.sindicato_id = L.sind ? L.sind.id : null; }
    if(completo){ if(!p.tipo_contrato) p.tipo_contrato='clt'; p.ativo=!p.data_demissao; p.criado_em=agora; }
    else if(p.data_demissao) p.ativo=false;
    p.atualizado_em=agora;
    return p;
  }
  const idPorLinha={};
  /* novos: em lotes; se o lote falhar, linha a linha para saber qual */
  const novos=I.linhas.filter(L=>L.situacao==='novo');
  for(let i=0;i<novos.length;i+=50){
    const lote=novos.slice(i,i+50);
    const r=await sb.from('folha_funcionarios').insert(lote.map(L=>payloadDe(L,true))).select('id');
    if(!r.error && r.data && r.data.length===lote.length){ lote.forEach((L,k)=>{ idPorLinha[L.n]=r.data[k].id; rel.push(['Funcionários',L.n,L.dados.nome,'Incluído',L.avisos.join(' | ')]); }); continue; }
    for(const L of lote){
      const r1=await sb.from('folha_funcionarios').insert(payloadDe(L,true)).select('id').single();
      if(r1.error) rel.push(['Funcionários',L.n,L.dados.nome,'FALHOU',r1.error.message]);
      else { idPorLinha[L.n]=r1.data.id; rel.push(['Funcionários',L.n,L.dados.nome,'Incluído',L.avisos.join(' | ')]); }
    }
  }
  /* atualizar: só o que veio preenchido; histórico de salário/cargo/centro/turno */
  for(const L of I.linhas.filter(L=>L.situacao==='atualiza')){
    const old=L.existente, p=payloadDe(L,false), alt=[];
    [['salario_base','salario','Salário'],['cargo','cargo','Cargo'],['centro_custo_id','centro_custo','Centro de custo'],['turno','turno','Turno']].forEach(function(t){
      if(!(t[0] in p)) return;
      const a=old[t[0]], b=p[t[0]];
      const igual = t[0]==='salario_base' ? Number(a||0)===Number(b||0) : String(a==null?'':a)===String(b==null?'':b);
      if(igual) return;
      const f=v=>t[0]==='salario_base'?folhaMoney(v):t[0]==='centro_custo_id'?(folhaCCNome(v)||'(nenhum)'):((v==null||v==='')?'(vazio)':String(v));
      alt.push({funcionario_id:old.id, tipo:t[1], campo:t[2], valor_anterior:f(a), valor_novo:f(b), motivo:motivo, usuario_id:session.id, usuario_nome:session.nome||''});
    });
    const r=await sb.from('folha_funcionarios').update(p).eq('id',old.id).select('id');
    if(r.error || !(r.data||[]).length) rel.push(['Funcionários',L.n,L.dados.nome,'FALHOU', r.error?r.error.message:'nada foi alterado (sem permissão?)']);
    else {
      idPorLinha[L.n]=old.id;
      if(alt.length){ const ae=await sb.from('folha_alteracoes').insert(alt); if(ae.error) console.warn('alt', ae.error); }
      rel.push(['Funcionários',L.n,L.dados.nome,'Atualizado',[Object.keys(p).filter(k=>k!=='atualizado_em').length+' campo(s)'].concat(L.avisos).join(' | ')]);
    }
  }
  I.linhas.filter(L=>L.situacao==='ignora').forEach(L=>rel.push(['Funcionários',L.n,L.dados.nome,'Ignorado','CPF já cadastrado ('+(L.existente.nome||'')+')']));
  I.linhas.filter(L=>L.situacao==='erro').forEach(L=>rel.push(['Funcionários',L.n,L.dados.nome||'','NÃO ENTROU',L.erros.join(' | ')]));
  /* dependentes */
  const depIns=[], depLin=[];
  I.deps.forEach(function(D_){
    if(D_.situacao==='erro'){ rel.push(['Dependentes',D_.n,D_.dados.nome||'','NÃO ENTROU',D_.erros.join(' | ')]); return; }
    if(D_.situacao==='ignora'){ rel.push(['Dependentes',D_.n,D_.dados.nome,'Ignorado','já está na ficha']); return; }
    const fid = D_.linhaFunc ? idPorLinha[D_.linhaFunc.n] : (D_.funcExist ? D_.funcExist.id : null);
    if(!fid){ rel.push(['Dependentes',D_.n,D_.dados.nome,'NÃO ENTROU','o funcionário dele não foi gravado']); return; }
    const d=D_.dados;
    depIns.push({funcionario_id:fid, nome:d.nome, cpf:d.cpf||'', nascimento:d.nascimento||null, parentesco:d.parentesco||'', dep_ir:!!d.dep_ir, dep_salario_familia:!!d.dep_salario_familia});
    depLin.push(D_);
  });
  if(depIns.length){
    const r=await sb.from('folha_dependentes').insert(depIns);
    if(!r.error) depLin.forEach(D_=>rel.push(['Dependentes',D_.n,D_.dados.nome,'Incluído',D_.avisos.join(' | ')]));
    else for(let k=0;k<depIns.length;k++){
      const r1=await sb.from('folha_dependentes').insert(depIns[k]);
      rel.push(['Dependentes',depLin[k].n,depLin[k].dados.nome, r1.error?'FALHOU':'Incluído', r1.error?r1.error.message:depLin[k].avisos.join(' | ')]);
    }
  }
  await folhaLoad(true);
  _imp.relatorio=rel;
  folhaImportRelatorio();
  if(currentPage==='folha_func') folhaFuncFilter();
  return false;
}
function folhaImportRelatorio(){
  const rel=(_imp&&_imp.relatorio)||[];
  const conta=(aba,res)=>rel.filter(r=>r[0]===aba && r[3]===res).length;
  const falhas=rel.filter(r=>r[3]==='FALHOU'||r[3]==='NÃO ENTROU');
  const resumo=`Funcionários: ${conta('Funcionários','Incluído')} incluído(s), ${conta('Funcionários','Atualizado')} atualizado(s), ${conta('Funcionários','Ignorado')} ignorado(s), ${rel.filter(r=>r[0]==='Funcionários'&&(r[3]==='FALHOU'||r[3]==='NÃO ENTROU')).length} não entraram.`
    + (rel.some(r=>r[0]==='Dependentes') ? ` Dependentes: ${conta('Dependentes','Incluído')} incluído(s), ${rel.filter(r=>r[0]==='Dependentes'&&(r[3]==='FALHOU'||r[3]==='NÃO ENTROU')).length} não entraram.` : '');
  toast(resumo, falhas.length?'warn':'');
  showModal('Importação concluída', `
    <div class="alert ${falhas.length?'':'info'}" style="font-size:13px">${escapeHtml(resumo)}</div>
    ${falhas.length?`<div style="font-weight:700;color:var(--crit);margin:8px 0 4px">O que não entrou</div><div style="overflow:auto;max-height:40vh"><table><thead><tr><th>Aba</th><th>Linha</th><th>Nome</th><th>Motivo</th></tr></thead><tbody>${falhas.map(r=>`<tr><td>${escapeHtml(r[0])}</td><td>${r[1]}</td><td>${escapeHtml(r[2]||'')}</td><td style="font-size:12px">${escapeHtml(r[4]||'')}</td></tr>`).join('')}</tbody></table></div>`:''}
    <div style="font-size:12px;color:var(--muted);margin-top:8px">O relatório completo (linha a linha) sai em Excel no botão abaixo.</div>
  `, null, [{label:'⬇ Relatório (Excel)', fn:()=>folhaImportRelatorioExcel()}], true);
}
async function folhaImportRelatorioExcel(){
  const rel=(_imp&&_imp.relatorio)||[]; if(!rel.length) return;
  try{
    if(!window.XLSX) await folhaLib('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const ws=XLSX.utils.aoa_to_sheet([['Aba','Linha da planilha','Nome','Resultado','Detalhe']].concat(rel));

    XLSX.writeFile(wb, 'Importacao folha - resultado - '+hoje()+'.xlsx');
  }catch(e){ toast('Erro: '+(e.message||e),'err'); }
}

   REGISTRO DE ACESSOS (novo no módulo, 06/10/2026) — quem abriu e quem gravou.
   Só quem EDITA a folha (diretoria e DP) lê; o banco confere (folha_acessos_ler).

const FOLHA_ACAO_ROT = {abriu_modulo:'Abriu a Folha', abriu_tela:'Abriu a tela', abriu_funcionario:'Abriu a ficha',
  abriu_documento:'Abriu documento', abriu_historico:'Abriu o histórico', exportou:'Exportou', imprimiu:'Imprimiu',
  incluiu:'Incluiu', alterou:'Alterou', excluiu:'Excluiu'};
const FOLHA_TELA_ROT = {folha_dash:'Painel', folha_func:'Funcionários', folha_benef:'Benefícios', folha_rel:'Relatórios',
  folha_cc:'Centros de custo', folha_sind:'Sindicatos', folha_turnos:'Turnos', folha_acessos:'Acessos', folha_docs:'Documentos'};
const FOLHA_TAB_ROT = {folha_funcionarios:'Funcionário', folha_dependentes:'Dependente', folha_documentos:'Documento',
  folha_alteracoes:'Histórico', folha_beneficios:'Benefício', folha_centros_custo:'Centro de custo',
  folha_sindicatos:'Sindicato', folha_turnos:'Turno'};
let _acs = {linhas:[], busca:'', acao:'', dias:30, erro:''};
function _acsAlvo(a){
  const fNome = id => { const f=DB.folhaFuncs.find(x=>String(x.id)===String(id)); return f ? f.nome : ('#'+id); };
  if(a.tabela){
    if(a.tabela==='folha_funcionarios') return 'Funcionário: '+fNome(a.registro_id);
    return (FOLHA_TAB_ROT[a.tabela]||a.tabela)+(a.registro_id!=null?' #'+a.registro_id:'');
  }
  if(a.registro_id!=null && /funcionario|historico/.test(a.acao)) return 'Funcionário: '+fNome(a.registro_id);
  if(a.registro_id!=null && a.acao==='abriu_documento') return 'Documento #'+a.registro_id;
  return FOLHA_TELA_ROT[a.tela]||a.tela||'';
}
async function renderFolhaAcessos(){
  const main=document.getElementById('main');
  if(!PODE.acessos){ main.innerHTML='<div class="empty">Sem permissão.</div>'; return; }
  main.innerHTML='<div class="empty">Carregando registro…</div>';
  await folhaLoad();
  const desde=new Date(Date.now()-_acs.dias*86400000).toISOString();
  const r=await _selTudo(()=>sb.from('folha_acessos').select('id,momento,usuario_nome,acao,tela,tabela,registro_id,detalhe').gte('momento',desde).order('momento',{ascending:false}), 20000);
  _acs.erro = r.error ? (r.error.message||String(r.error)) : '';
  _acs.linhas = r.data||[];
  folhaAcessosDesenhar();
}
function folhaAcessosFiltrados(){
  const q=_normTxt(_acs.busca||'');
  return _acs.linhas.filter(a=> (!_acs.acao || a.acao===_acs.acao) &&
    (!q || _normTxt([a.usuario_nome, FOLHA_ACAO_ROT[a.acao]||a.acao, _acsAlvo(a), a.detalhe].join(' ')).indexOf(q)>=0));
}
function folhaAcessosDesenhar(){
  const main=document.getElementById('main'); if(currentPage!=='folha_acessos') return;
  if(_acs.erro){
    main.innerHTML='<div class="page-header"><div><div class="page-title">Acessos à Folha</div></div></div>'+
      '<div class="alert">O registro ainda não existe neste banco — rode <b>folha-trava-2fa-2026-10-06.sql</b>.<div style="font-size:12px;margin-top:4px;color:var(--muted)">'+escapeHtml(_acs.erro)+'</div></div>';
    return;
  }
  const lista=folhaAcessosFiltrados();

  main.innerHTML=`
    <div class="page-header"><div><div class="page-title">Acessos à Folha</div><div class="page-sub">Quem abriu, exportou ou gravou — últimos ${_acs.dias} dias · ${lista.length} registro(s)</div></div>
      ${PODE.exportar?'<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="folhaAcessosCsv()">⬇ CSV</button></div>':''}</div>
    <div class="card" style="margin-bottom:12px"><div class="grid-3" style="align-items:end">

      <div class="form-group" style="margin:0"><label>Ação</label><select id="acs_acao" onchange="_acs.acao=this.value;folhaAcessosTabela()"><option value="">Todas</option>${acoes.map(a=>`<option value="${escapeHtml(a)}" ${_acs.acao===a?'selected':''}>${escapeHtml(FOLHA_ACAO_ROT[a]||a)}</option>`).join('')}</select></div>
      <div class="form-group" style="margin:0"><label>Período</label><select onchange="_acs.dias=Number(this.value);renderFolhaAcessos()">${[7,30,90,365].map(d=>`<option value="${d}" ${_acs.dias===d?'selected':''}>Últimos ${d} dias</option>`).join('')}</select></div>
    </div></div>
    <div class="card"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Onde / o quê</th><th>Detalhe</th></tr></thead><tbody id="acs_tbody"></tbody></table><div id="acs_vazio"></div></div>`;
  folhaAcessosTabela();
}
function folhaAcessosTabela(){
  const tb=document.getElementById('acs_tbody'); if(!tb) return;

  tb.innerHTML=lista.slice(0,500).map(a=>`<tr>

}
function folhaAcessosCsv(){
  const lista=folhaAcessosFiltrados(); if(!lista.length){ toast('Nada para exportar','warn'); return; }
  const cel=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const linhas=[['Quando','Quem','Ação','Onde / o quê','Detalhe'].map(cel).join(';')].concat(lista.map(a=>[
    new Date(a.momento).toLocaleString('pt-BR'), a.usuario_nome||'', FOLHA_ACAO_ROT[a.acao]||a.acao, _acsAlvo(a), a.detalhe||''].map(cel).join(';')));
  const blob=new Blob(['﻿'+linhas.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Acessos a Folha - '+hoje()+'.csv'; a.click();
  folhaLog('exportou','folha_acessos',null,'CSV do registro de acessos');
}

async function _sesmtListas(){

    _selTudo(()=>sb.from('empresas').select('id,razao').order('id')),
    _selTudo(()=>sb.from('funcionarios').select('id,nome,cpf').order('id')),
    _selTudo(()=>sb.from('catalogo_funcoes').select('id,nome').order('id')),
    _selTudo(()=>sb.from('obras').select('id,nome,ativa').order('id'))
  ]);
  const erro = [emp,fun,cat,obr].find(x=>x.error);
  if(erro){ toast('Não consegui ler o cadastro do SESMT: '+(erro.error.message||erro.error),'err'); return false; }
  DB.empresas = emp.data||[]; DB.funcionarios = fun.data||[]; DB.catalogoFuncoes = cat.data||[]; DB.obras = obr.data||[];
  _sesmtCarregado = true; return true;
}

/* ---- guarda de leitura (igual ao Docs): perfil que só VÊ a folha ---- */
const _ESCRITA_FOLHA = /^folha(CCForm|SindForm|TurnoForm|CCDel|SindDel|TurnoDel|DepAdd|DepDel|DocUpload|DocDel|Arquivar|Reativar|ParaSesmt|Import|ImportRun|ImportGravar)\b|^benef(Salvar|CopiarMesAnterior)\b/;
const _IMPORT_FOLHA = /^folhaImport(Run|Gravar)?\b/;
const _EXPORT_FOLHA = /^(folhaRelExcel|folhaRelPdf|folhaFichaImprimir|benefExportar|folhaAcessosCsv)\b/;
document.addEventListener('click', function(ev){
  if(!session) return;
  const alvo = ev.target && ev.target.closest ? ev.target.closest('[onclick]') : null;
  if(!alvo) return;
  const m = String(alvo.getAttribute('onclick')||'').match(/^\s*([A-Za-z_$][\w$]*)\s*\(/);
  if(!m) return;
  let msg = '';
  if(_EXPORT_FOLHA.test(m[1]) && !PODE.exportar) msg = 'Exportar não está liberado para o seu perfil (Cadastros › Permissões › Folha).';
  else if(_IMPORT_FOLHA.test(m[1]) && !PODE.importar) msg = 'Importar planilha não está liberado para o seu perfil.';
  else if(!PODE.edita && _ESCRITA_FOLHA.test(m[1])) msg = 'Seu perfil é somente leitura — esta ação é do Departamento Pessoal.';
  if(!msg) return;
  ev.preventDefault(); ev.stopPropagation();
  toast(msg,'warn');
}, true);
document.addEventListener('input', function(ev){
  if(!session || PODE.edita) return;
  if(ev.target && ev.target.classList && ev.target.classList.contains('benef-in')){ ev.target.blur(); toast('Seu perfil é somente leitura.','warn'); }
}, true);

/* ---- registro: quem abriu cada coisa (envolve as funções do Docs sem mexer nelas) ---- */
(function(){
  function envolver(nome, antes){
    const orig = window[nome]; if(typeof orig !== 'function') return;
    window[nome] = function(){ try{ antes.apply(null, arguments); }catch(e){} return orig.apply(this, arguments); };
  }
  envolver('folhaFuncForm', function(id){ if(id) folhaLog('abriu_funcionario', 'folha_func', id); });
  envolver('folhaHist',     function(id){ folhaLog('abriu_historico', 'folha_func', id); });
  envolver('folhaDocs',     function(id){ folhaLog('abriu_funcionario', 'folha_docs', id, 'lista de documentos'); });
  envolver('folhaRelExcel', function(){ folhaLog('exportou', 'folha_rel', null, 'Excel: '+((_folha.lastRep||{}).titulo||'')); });
  envolver('folhaRelPdf',   function(){ folhaLog('exportou', 'folha_rel', null, 'PDF: '+((_folha.lastRep||{}).titulo||'')); });
  envolver('benefExportar', function(){ folhaLog('exportou', 'folha_benef', null, 'Excel de benefícios '+_benef.comp); });
})();

/* ============================================================================
   NAVEGAÇÃO — abas no lugar do menu FOLHA INTERNA do Docs
   ============================================================================ */
function abas(){
  const a = [['folha_dash','Painel'],['folha_func','Funcionários'],['folha_benef','Benefícios'],['folha_rel','Relatórios'],
             ['folha_cc','Centros de custo'],['folha_sind','Sindicatos'],['folha_turnos','Turnos']];
  if(PODE.acessos) a.push(['folha_acessos','Acessos']);
  return a;
}
const _TELAS = {folha_dash:()=>renderFolhaDash(), folha_func:()=>renderFolhaFunc(), folha_benef:()=>renderFolhaBenef(),
  folha_rel:()=>renderFolhaRel(), folha_cc:()=>renderFolhaCC(), folha_sind:()=>renderFolhaSind(),
  folha_turnos:()=>renderFolhaTurnos(), folha_acessos:()=>renderFolhaAcessos()};
function go(page){
  if(!abas().some(a=>a[0]===page)) page='folha_dash';
  const mudou = currentPage !== page;
  currentPage = page;
  $('trilho').innerHTML = abas().map(a=>`<button type="button" data-p="${a[0]}" class="${a[0]===page?'ativa':''}">${a[1]}</button>`).join('');
  const at = $('trilho').querySelector('.ativa'); if(at && at.scrollIntoView) try{ at.scrollIntoView({block:'nearest', inline:'nearest'}); }catch(e){}
  try{ history.replaceState(history.state, '', location.pathname + location.search + '#' + page); }catch(e){}
  if(mudou) folhaLog('abriu_tela', page);
  const fn=_TELAS[page];
  Promise.resolve().then(fn).catch(function(e){ console.error(e); $('main').innerHTML='<div class="empty">Erro ao abrir: '+escapeHtml(e.message||e)+'</div>'; });
}
$('trilho').addEventListener('click', function(e){ const b=e.target.closest('button[data-p]'); if(b){ go(b.getAttribute('data-p')); window.scrollTo(0,0); } });
$('marca-inicio').addEventListener('click', function(e){
  e.preventDefault();
  if($('modal').classList.contains('show')) closeModal();
  if(session && PODE.ver) go('folha_dash');
  window.scrollTo(0,0);
});

function semAcesso(titulo, texto){
  $('abas').classList.add('oculto');
  $('main').innerHTML = '<div class="cartao-aviso"><h1>'+escapeHtml(titulo)+'</h1><p>'+texto+'</p><p style="margin-top:14px"><a href="../">Voltar ao portal</a></p></div>';
}

/* ============================================================================
   ENTRADA — quem autentica é o portal (mesmo padrão de Cadastros/Flow)
   ============================================================================ */
async function iniciar(){
  try{
    const s = await sb.auth.getSession();
    const sessao = s.data && s.data.session;
    if(!sessao){ location.replace('../'); return; }
    const r = await sb.schema('core').from('pessoas').select('id,nome,perfil,tipo,ativo').eq('id', sessao.user.id).maybeSingle();
    if(r.error) throw r.error;
    if(!r.data || !r.data.ativo || r.data.tipo !== 'colaborador'){ location.replace('../'); return; }
    /* entrou por link e ainda não criou a senha? -> portal ("Criar senha nova") */
    let semSenha = false;
    try { semSenha = !!(JSON.parse(localStorage.getItem('bemer_definir_senha') || '{}') || {})[sessao.user.id]; } catch(e){}
    if(!semSenha){ const x = await sb.schema('core').rpc('senha_pendente').then(v=>v, ()=>({error:1})); semSenha = !x.error && x.data === true; }
    if(semSenha){ location.replace('../'); return; }
    /* 2FA do dia (0041): pendente -> portal pede o código. Erro = segue (o banco barra de todo jeito). */
    const p2 = await sb.schema('core').rpc('dois_fatores_pendente').then(v=>v, ()=>({error:1}));
    if(!p2.error && p2.data === true){ location.replace('../'); return; }

    session = { id: sessao.user.id, nome: r.data.nome || '', email: sessao.user.email || '', perfil: r.data.perfil };
    /* Quem vê e quem mexe: o BANCO decide (as mesmas funções das regras). */
    const fa = await sb.schema('core').rpc('folha_minhas_acoes').then(x=>x, ()=>({error:1}));
    if(!fa.error && fa.data && typeof fa.data === 'object'){
      const a = fa.data;
      PODE = { ver: !!(a.ver || a.editar), edita: !!a.editar, importar: !!(a.importar && a.editar), exportar: !!a.exportar, acessos: !!a.acessos };
    } else {
      /* banco ainda sem a 0052: as funções de antes (caixas do Docs) */
      const [v1, v2] = await Promise.all([
        sb.rpc('eh_visual_folha').then(x=>!x.error && x.data===true, ()=>false),
        sb.rpc('eh_folha').then(x=>!x.error && x.data===true, ()=>false)
      ]);
      PODE = { ver: v1 || v2, edita: v2, importar: v2, exportar: v1 || v2, acessos: v2 };
    }
    if(!PODE.ver){
      semAcesso('Sem acesso à Folha', 'A folha interna é só de quem a diretoria ou o DP liberou (Cadastros › Permissões › Folha). Se você precisa dela, peça à diretoria ou ao DP.');
      return;
    }
    folhaLog('abriu_modulo', '', null, PODE.edita ? 'edição' : 'leitura');
    $('abas').classList.remove('oculto');
    const alvo = (location.hash||'').replace('#','');
    go(_TELAS[alvo] ? alvo : 'folha_dash');
  }catch(e){
    $('main').innerHTML = '<div class="cartao-aviso"><h1>Não foi possível carregar</h1><p>'+escapeHtml((e && (e.message||e.error_description)) || String(e))+'</p><p style="margin-top:14px"><a href="../">Voltar ao portal</a></p></div>';
  }
}

/* ---------- aviso de nova versão (mesmo padrão do portal e dos módulos) ---------- */
(function(){
  var avisando = false, emVoo = false;
  function conferir(){
    if(avisando || emVoo || document.hidden) return;
    emVoo = true;
    fetch('version.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if(!v || !v.versao || v.versao === APP_VERSION || avisando) return;
        avisando = true;
        var f = document.createElement('div');
        f.className = 'faixa-atualizar'; f.setAttribute('role', 'status');
        f.innerHTML = '<span>Nova versão da Folha disponível</span><button type="button">Atualizar agora</button>';
        document.body.appendChild(f);
        f.querySelector('button').addEventListener('click', function(){
          if(document.querySelector('#modal.show') && !confirm('Há uma janela aberta. Atualizar agora descarta o que não foi salvo. Continuar?')) return;
          location.reload();
        });
      })
      .catch(function(){})
      .then(function(){ emVoo = false; });
  }
  setInterval(conferir, 120000);
  document.addEventListener('visibilitychange', conferir);
  setTimeout(conferir, 8000);
})();

iniciar();
</script>
