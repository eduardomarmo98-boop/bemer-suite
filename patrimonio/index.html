  $$('[data-action="scan"]').forEach(b => b.addEventListener('click', () => openScanner()));
  $$('[data-action="search"]').forEach(b => b.addEventListener('click', () => { State.tab = 'list'; render(); }));
  $$('[data-action="create"]').forEach(b => b.addEventListener('click', () => { State.tab = 'create'; render(); }));
  $$('[data-action="inventory"]').forEach(b => b.addEventListener('click', () => { State.tab = 'more'; render(); setTimeout(openInventoryStart, 50); }));
  $$('.timeline-item[data-action="open"]').forEach(el => el.addEventListener('click', () => {
    const id = parseInt(el.dataset.id); if (id) openDetail(id);
  }));
}

/* ============== LIST ============== */

function renderList() {
  const u = Lookup.user(DB.currentUser);
  const f = State.filter;
  const isAdmin = Perms.isAdmin(u);
  const isOperador = u.perfil === 'operador';
  let items = Lookup.visibleItems(u);

  if (f.q) {
    const q = f.q.toLowerCase();
    items = items.filter(p =>
      p.descricao.toLowerCase().includes(q) ||
      (p.codigoBarras||'').toLowerCase().includes(q) ||
      (p.tipoSoftware || '').toLowerCase().includes(q)
    );
  }
  if (f.status) items = items.filter(p => p.status === f.status);
  if (f.categoria) items = items.filter(p => String(p.categoriaId) === String(f.categoria));
  if (f.subcategoria) items = items.filter(p => String(p.subcategoriaId) === String(f.subcategoria));
  if (f.local) items = items.filter(p => String(p.localizacaoAtualId) === String(f.local));
  if (f.responsavel) items = items.filter(p => String(p.responsavelAtualId) === String(f.responsavel));

  // Categorias disponíveis para o usuário (admin_ti só vê TI, etc.)
  const catsVisiveis = (u.perfil === 'diretoria' || u.perfil === 'operador')
                     ? DB.categorias
                     : DB.categorias.filter(c => Perms.veCategoria(u, c.id));
  const showCatFilter = catsVisiveis.length > 1;

  // Subcategorias disponíveis (das categorias visíveis; se houver filtro de categoria, restringe a ela)
  const catIdsVisiveis = catsVisiveis.map(c => c.id);
  let subcatsDisponiveis = (DB.subcategorias || []).filter(s => catIdsVisiveis.includes(s.categoriaId));
  if (f.categoria) subcatsDisponiveis = subcatsDisponiveis.filter(s => String(s.categoriaId) === String(f.categoria));
  subcatsDisponiveis = subcatsDisponiveis.slice().sort((a, b) => a.nome.localeCompare(b.nome));

  // Locais e usuários para os filtros (apenas admins)
  const locaisDisponiveis = Lookup.visibleLocations(u);
  const usuariosDisponiveis = DB.usuarios;

  const titulo = isOperador ? 'Meus bens' : 'Patrimônios';

  return `
    <div class="page-title">${titulo} <span class="pill">${items.length}</span></div>

    <div class="filter-row">
      <input type="text" id="f-q" placeholder="Buscar..." value="${escapeHtml(f.q)}">
    </div>
    <div class="filter-row">
      ${showCatFilter ? `
      <select id="f-cat">
        <option value="">Todas categorias</option>
        ${catsVisiveis.map(c => `<option value="${c.id}" ${String(f.categoria)===String(c.id)?'selected':''}>${escapeHtml(c.icone)} ${escapeHtml(c.nome)}</option>`).join('')}
      </select>` : ''}
      <select id="f-status">
        <option value="">Todos status</option>
        <option value="ativo"                            ${f.status==='ativo'?'selected':''}>Ativo</option>
        <option value="aguardando_aceite"                ${f.status==='aguardando_aceite'?'selected':''}>Aguard. aceite</option>
        <option value="aguardando_aprovacao_cadastro"      ${f.status==='aguardando_aprovacao_cadastro'?'selected':''}>Aguard. aprovação cadastro</option>
        <option value="aguardando_aprovacao_movimentacao"  ${f.status==='aguardando_aprovacao_movimentacao'?'selected':''}>Aguard. aprovação movimentação</option>
        <option value="aguardando_aprovacao_baixa"         ${f.status==='aguardando_aprovacao_baixa'?'selected':''}>Aguard. aprovação baixa</option>
        <option value="aguardando_aprovacao_extravio"    ${f.status==='aguardando_aprovacao_extravio'?'selected':''}>Aguard. aprovação extravio</option>
        <option value="manutencao"                       ${f.status==='manutencao'?'selected':''}>Manutenção</option>
        <option value="emprestado"         ${f.status==='emprestado'?'selected':''}>Emprestado</option>
        <option value="baixado"            ${f.status==='baixado'?'selected':''}>Baixado</option>
        <option value="extraviado"         ${f.status==='extraviado'?'selected':''}>Extraviado</option>
      </select>
    </div>
    ${subcatsDisponiveis.length ? `
    <div class="filter-row">
      <select id="f-subcat">
        <option value="">Todas subcategorias</option>
        ${subcatsDisponiveis.map(s => `<option value="${s.id}" ${String(f.subcategoria)===String(s.id)?'selected':''}>${escapeHtml(s.nome)}</option>`).join('')}
      </select>
    </div>` : ''}
    ${isAdmin ? `
    <div class="filter-row">
      <select id="f-local">
        <option value="">Todas localizações</option>
        ${locaisDisponiveis.map(l => `<option value="${l.id}" ${String(f.local)===String(l.id)?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}
      </select>
      <select id="f-resp">
        <option value="">Todos responsáveis</option>
        ${usuariosDisponiveis.map(x => `<option value="${x.id}" ${String(f.responsavel)===String(x.id)?'selected':''}>${escapeHtml(x.nome)}</option>`).join('')}
      </select>
    </div>` : ''}

    ${items.length ? `
      <div class="item-list">
        ${items.map(p => renderItemCard(p)).join('')}
      </div>
    ` : `
      <div class="empty-state">
        <div class="emoji">📭</div>
        <p>${isOperador ? 'Você não tem bens sob sua custódia.' : 'Nenhum patrimônio encontrado.'}</p>
      </div>
    `}
  `;
}

function renderItemCard(p) {
  const cat = Lookup.cat(p.categoriaId);
  const sub = (DB.subcategorias || []).find(s => s.id === p.subcategoriaId);
  const loc = Lookup.loc(p.localizacaoAtualId);
  const resp = Lookup.user(p.responsavelAtualId);
  const catClass = cat ? (cat.id === 2 ? 'cat-ti' : 'cat-obra') : '';
  return `
    <div class="item ${catClass} ${p.status === 'aguardando_aceite' ? 'pending-accept' : ''}" data-id="${p.id}" data-action="open">
      <div class="item-icon">${cat ? cat.icone : '📦'}</div>
      <div class="item-info">
        <div class="title">${escapeHtml(p.descricao)}</div>
        <div class="subtitle">${sub ? escapeHtml(sub.nome) + ' · ' : ''}${loc ? escapeHtml(loc.nome) : '—'} · ${resp ? escapeHtml(resp.nome) : 'Sem responsável'}</div>
        <div style="margin-top:4px;">
          <span class="codigo">${escapeHtml(p.codigoBarras)}</span>
          <span class="badge ${p.status}" style="margin-left:6px;">${statusLabel(p.status)}</span>
        </div>
      </div>
    </div>
  `;
}

function statusLabel(s) {
  return ({
    ativo:'Ativo',
    aguardando_aceite:'Aguard. aceite',
    aguardando_aprovacao_cadastro:'Aguard. aprovação cadastro',
    aguardando_aprovacao_movimentacao:'Aguard. aprovação movimentação',
    aguardando_aprovacao_baixa:'Aguard. aprovação baixa',
    aguardando_aprovacao_extravio:'Aguard. aprovação extravio',
    manutencao:'Manutenção',
    emprestado:'Emprestado',
    baixado:'Baixado',
    extraviado:'Extraviado',
    excluido:'Excluído'
  })[s] || s;
}

function bindList() {
  const q = $('#f-q'); if (q) q.addEventListener('input', e => { State.filter.q = e.target.value; render(); $('#f-q').focus(); });
  const fc = $('#f-cat'); if (fc) fc.addEventListener('change', e => { State.filter.categoria = e.target.value; State.filter.subcategoria = ''; render(); });
  const fsc = $('#f-subcat'); if (fsc) fsc.addEventListener('change', e => { State.filter.subcategoria = e.target.value; render(); });
  const fs = $('#f-status'); if (fs) fs.addEventListener('change', e => { State.filter.status = e.target.value; render(); });
  const fl = $('#f-local'); if (fl) fl.addEventListener('change', e => { State.filter.local = e.target.value; render(); });
  const fr = $('#f-resp'); if (fr) fr.addEventListener('change', e => { State.filter.responsavel = e.target.value; render(); });
  $$('[data-action="open"]').forEach(el => el.addEventListener('click', () => openDetail(parseInt(el.dataset.id))));
}

/* ============== DETAIL MODAL ============== */

function openDetail(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  if (!p) return toast('Item não encontrado', 'error');
  const u = Lookup.user(DB.currentUser);
  if (!Lookup.canSee(u, p)) return toast('Sem permissão para visualizar este item', 'error');
  const cat = Lookup.cat(p.categoriaId);
  const sub = (DB.subcategorias || []).find(s => s.id === p.subcategoriaId);
  const loc = Lookup.loc(p.localizacaoAtualId);
  const resp = Lookup.user(p.responsavelAtualId);
  const movs = Lookup.movs(p.id);

  const isAdminCat = Perms.canManageCategoria(u, p.categoriaId);
  const podeManager = isAdminCat;
  const podeMover = Perms.canRequestMove(u, p) && p.status !== 'aguardando_aprovacao_movimentacao' && p.status !== 'aguardando_aceite';
  const podeDeletar = Perms.canDelete(u);
  const aguardandoMeuAceite = (p.status === 'aguardando_aceite' && p.responsavelAtualId === u.id);

  const html = `
    <div class="modal-backdrop" id="modal-detail">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close-btn" data-close>&times;</button>
        <button class="btn secondary" data-close style="width:auto;padding:6px 14px;font-size:13px;margin-bottom:12px;">← Voltar</button>
        <h2>${escapeHtml(p.descricao)}</h2>
        <div style="margin-bottom:12px;">
          <span class="codigo" style="font-family:monospace; color:var(--brand-orange); font-weight:700;">${escapeHtml(p.codigoBarras)}</span>
          <span class="badge ${p.status}" style="margin-left:8px;">${statusLabel(p.status)}</span>
          <span class="badge ${cat && cat.id===2?'cat-ti':'cat-obra'}" style="margin-left:4px;">${cat?cat.icone+' '+cat.nome:'—'}</span>
        </div>

        ${aguardandoMeuAceite ? `
          <div class="accept-card">
            <div class="ac-title">Item aguardando seu aceite</div>
            <div class="ac-meta">Confirme o recebimento para finalizar a movimentação.</div>
            <div style="margin-top:10px;"><button class="btn success" data-action="accept">✓ Confirmar recebimento</button></div>
          </div>
        ` : ''}

        ${(p.foto && /^data:image\/(png|jpe?g|webp);base64,/i.test(p.foto)) ? `<div style="margin:10px 0;text-align:center;"><img src="${p.foto}" alt="Foto do patrimônio" style="max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--border);cursor:pointer;" onclick="window.open(this.src,'_blank')"></div>` : ''}
        ${isAdminCat ? `
          <div style="text-align:center;margin:0 0 12px;">
            <input type="file" id="d-foto" accept="image/*" style="display:none;">
            <button class="btn secondary" data-action="add-foto" style="width:auto;padding:6px 14px;font-size:13px;">📷 ${p.foto ? 'Trocar foto' : 'Adicionar foto'}</button>
            <button class="btn secondary" data-action="editar" style="width:auto;padding:6px 14px;font-size:13px;margin-left:6px;">✏️ Editar dados</button>
          </div>
        ` : ''}
        <div class="card" style="padding:12px;">
          <div class="detail-row"><span class="label">Categoria</span><span class="value">${cat ? cat.icone+' '+cat.nome : '—'}</span></div>
          <div class="detail-row"><span class="label">Subcategoria</span><span class="value">${sub ? escapeHtml(sub.nome) : '—'}</span></div>
          <div class="detail-row"><span class="label">Nota fiscal</span><span class="value">${escapeHtml(p.notaFiscal || '—')}</span></div>
          <div class="detail-row"><span class="label">Aquisição</span><span class="value">${fmtDate(p.dataAquisicao)}</span></div>
          <div class="detail-row"><span class="label">Valor</span><span class="value">${fmtMoney(p.valorAquisicao)}</span></div>
          <div class="detail-row"><span class="label">Localização</span><span class="value">${loc ? escapeHtml(loc.nome) : '—'}</span></div>
          <div class="detail-row"><span class="label">Responsável</span><span class="value">${resp ? escapeHtml(resp.nome) : '—'}</span></div>
          ${p.observacoes ? `<div class="detail-row"><span class="label">Obs.</span><span class="value">${escapeHtml(p.observacoes)}</span></div>` : ''}
          <div class="detail-row"><span class="label">Cadastrado por</span><span class="value">${escapeHtml((Lookup.user(p.criadoPor) || {}).nome || '—')} em ${fmtDate(p.criadoEm)}</span></div>
        </div>

        ${(() => {
          if (p.status === 'aguardando_aprovacao_cadastro' && Perms.canApproveCadastro(u, p.categoriaId)) {
            return `
              <div class="accept-card" style="border-color:#3730a3; background:#eef2ff;">
                <div class="ac-title" style="color:#3730a3;">Cadastro aguardando sua aprovação</div>
                <div class="ac-meta" style="color:#3730a3;">Solicitado por ${escapeHtml((Lookup.user(p.criadoPor)||{}).nome || '—')}.</div>
                <div class="btn-row" style="margin-top:10px;">
                  <button class="btn success" data-action="approve-cad">✓ Aprovar cadastro</button>
                  <button class="btn danger"  data-action="reject-cad">✗ Rejeitar</button>
                </div>
              </div>`;
          }
          if ((p.status === 'aguardando_aprovacao_baixa' || p.status === 'aguardando_aprovacao_extravio') && Perms.canApproveBaixa(u)) {
            const tipo = p.status === 'aguardando_aprovacao_baixa' ? 'baixa' : 'extravio';
            return `
              <div class="accept-card" style="border-color:#92400e;">
                <div class="ac-title">${tipo === 'baixa' ? 'Baixa' : 'Extravio'} aguardando aprovação da Diretoria</div>
                <div class="ac-meta">Solicitado por ${escapeHtml((Lookup.user(p.solicitadoPor)||{}).nome || '—')}${p.solicitacaoMotivo ? ' · ' + escapeHtml(p.solicitacaoMotivo) : ''}.</div>
                <div class="btn-row" style="margin-top:10px;">
                  <button class="btn danger"    data-action="approve-baixa">✓ Aprovar ${tipo}</button>
                  <button class="btn secondary" data-action="reject-baixa">✗ Rejeitar</button>
                </div>
              </div>`;
          }
          if (p.status === 'aguardando_aprovacao_cadastro' && p.criadoPor === u.id) {
            return `<div class="lock-hint" style="margin-top:10px;"><span>⏳</span><span>Aguardando aprovação do administrador da categoria.</span></div>`;
          }
          if (p.status === 'aguardando_aprovacao_baixa' || p.status === 'aguardando_aprovacao_extravio') {
            const tipo = p.status === 'aguardando_aprovacao_baixa' ? 'baixa' : 'extravio';
            return `<div class="lock-hint" style="margin-top:10px;"><span>⏳</span><span>${tipo === 'baixa' ? 'Baixa' : 'Extravio'} aguardando aprovação da Diretoria.</span></div>`;
          }
          // Movimentação aguardando aprovação do admin da categoria
          if (p.status === 'aguardando_aprovacao_movimentacao') {
            if (Perms.canApproveCadastro(u, p.categoriaId)) {
              const dest = p.pendingMove || {};
              const lTxt = dest.localizacaoAtualId ? (Lookup.loc(dest.localizacaoAtualId)||{}).nome : '—';
              const rTxt = dest.responsavelAtualId ? (Lookup.user(dest.responsavelAtualId)||{}).nome : '—';
              return `
                <div class="accept-card" style="border-color:#9a3412; background:#ffedd5;">
                  <div class="ac-title" style="color:#9a3412;">Movimentação aguardando sua aprovação</div>
                  <div class="ac-meta" style="color:#9a3412;">Solicitada por ${escapeHtml((Lookup.user(p.solicitadoMovPor)||{}).nome || '—')}.<br>Local destino: <strong>${escapeHtml(lTxt)}</strong> · Responsável destino: <strong>${escapeHtml(rTxt)}</strong>${dest.motivo ? '<br>Motivo: '+escapeHtml(dest.motivo) : ''}</div>
                  <div class="btn-row" style="margin-top:10px;">
                    <button class="btn success" data-action="approve-move">✓ Aprovar movimentação</button>
                    <button class="btn danger"  data-action="reject-move">✗ Rejeitar</button>
                  </div>
                </div>`;
            }
            return `<div class="lock-hint" style="margin-top:10px;"><span>⏳</span><span>Movimentação aguardando aprovação do administrador da categoria.</span></div>`;
          }
          // Botões de ação
          if (podeMover || podeManager) {
            const moveBtn  = podeMover  ? `<button class="btn" data-action="move">↗ Movimentar</button>` : '';
            const manutBtn = podeManager ? (p.status !== 'manutencao' ? `<button class="btn warning" data-action="manut">🔧 Manutenção</button>` : `<button class="btn success" data-action="ret-manut">✓ Retornou</button>`) : '';
            const baixaRow = podeManager ? `
              <div class="btn-row" style="margin-bottom:8px;">
                <button class="btn outline-red" data-action="baixa">⬇ ${Perms.isDiretoria(u) ? 'Baixar' : 'Solicitar baixa'}</button>
                <button class="btn secondary"   data-action="extraviado">⚠ ${Perms.isDiretoria(u) ? 'Extraviado' : 'Solicitar extravio'}</button>
              </div>` : '';
            return `
              <div class="btn-row" style="margin-bottom:8px;">${moveBtn}${manutBtn}</div>
              ${baixaRow}`;
          }
          return `<div class="lock-hint" style="margin-top:10px;"><span>🔒</span><span>Apenas o administrador da categoria pode movimentar este item.</span></div>`;
        })()}
        ${podeDeletar ? `
          <button class="btn danger" data-action="delete" style="margin-top:8px;">🗑 Excluir patrimônio</button>
        ` : ''}

        <hr class="separator">
        <h2 style="margin-top:8px;">Histórico</h2>
        <div class="timeline">
          ${movs.map(m => renderTimelineEntry(m)).join('')}
        </div>
      </div>
    </div>
  `;

  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const node = wrap.firstElementChild;
  document.body.appendChild(node);
  /* clique fora NÃO fecha o modal (evita fechar/retroceder sem querer) — use ✕/Voltar */
  node.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => node.remove()));

  const $a = (sel) => node.querySelector(sel);
  if ($a('[data-action="accept"]')) $a('[data-action="accept"]').addEventListener('click', () => { acceptReceipt(p.id); node.remove(); openDetail(p.id); });
  if ($a('[data-action="add-foto"]')) {
    const inpFoto = $a('#d-foto');
    $a('[data-action="add-foto"]').addEventListener('click', () => inpFoto.click());
    inpFoto.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      toast('Processando foto...', 'success');
      try {
        const dataURL = await comprimirImagem(file);
        // o do DB de agora: durante a compressão uma recarga pode ter trocado o DB
        const atual = DB.patrimonios.find(x => x.id === p.id);
        if (!atual) return toast('Este item foi alterado — abra de novo', 'error');
        const aberto = document.body.contains(node);
        atual.foto = dataURL;
        atual.atualizadoEm = new Date().toISOString();
        save();
        toast('Foto salva', 'success');
        if (aberto) { node.remove(); openDetail(atual.id); }
      } catch (err) {
        toast('Falha ao processar a foto', 'error');
      }
    });
  }
  if ($a('[data-action="editar"]')) $a('[data-action="editar"]').addEventListener('click', () => { node.remove(); openEditPatrimonio(p.id); });
  if ($a('[data-action="move"]'))   $a('[data-action="move"]').addEventListener('click', () => { node.remove(); openMove(p.id); });
  if ($a('[data-action="manut"]'))  $a('[data-action="manut"]').addEventListener('click', () => { node.remove(); sendToMaintenance(p.id); });
  if ($a('[data-action="ret-manut"]')) $a('[data-action="ret-manut"]').addEventListener('click', () => { changeStatus(p.id, 'ativo', 'Retorno de manutenção', 'retorno_manutencao'); node.remove(); openDetail(p.id); });
  if ($a('[data-action="baixa"]'))  $a('[data-action="baixa"]').addEventListener('click', () => { requestBaixa(p.id, 'baixa'); node.remove(); });
  if ($a('[data-action="extraviado"]')) $a('[data-action="extraviado"]').addEventListener('click', () => { requestBaixa(p.id, 'extravio'); node.remove(); });
  if ($a('[data-action="approve-cad"]')) $a('[data-action="approve-cad"]').addEventListener('click', () => { approveCadastro(p.id); node.remove(); });
  if ($a('[data-action="reject-cad"]'))  $a('[data-action="reject-cad"]').addEventListener('click', () => { if(confirm('Rejeitar este cadastro? Ele sai do app, mas o registro fica guardado no Supabase.')){ rejectCadastro(p.id); node.remove(); }});
  if ($a('[data-action="approve-baixa"]')) $a('[data-action="approve-baixa"]').addEventListener('click', () => { approveBaixa(p.id); node.remove(); });
  if ($a('[data-action="reject-baixa"]'))  $a('[data-action="reject-baixa"]').addEventListener('click', () => { rejectBaixa(p.id); node.remove(); });
  if ($a('[data-action="approve-move"]')) $a('[data-action="approve-move"]').addEventListener('click', () => { approveMove(p.id); node.remove(); });
  if ($a('[data-action="reject-move"]'))  $a('[data-action="reject-move"]').addEventListener('click', () => { rejectMove(p.id); node.remove(); });
  if ($a('[data-action="delete"]')) $a('[data-action="delete"]').addEventListener('click', () => { if(confirm('Excluir este patrimônio? Ele sai do app, mas o registro e o histórico ficam guardados no Supabase.')){ deletePatrimonio(p.id); node.remove(); }});
}

/* ===== Edição de patrimônio já cadastrado (admin/diretoria da categoria) ===== */
function openEditPatrimonio(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  if (!p) return toast('Item não encontrado', 'error');
  const u = Lookup.user(DB.currentUser);
  if (!Perms.canManageCategoria(u, p.categoriaId)) return toast('Sem permissão para editar este item', 'error');

  const catsDisp = DB.categorias.filter(c => Perms.canManageCategoria(u, c.id));
  const subOpts = (catId) => (DB.subcategorias||[])
    .filter(s => s.categoriaId === catId)
    .map(s => `<option value="${s.id}" ${s.id===p.subcategoriaId?'selected':''}>${escapeHtml(s.nome)}</option>`).join('');
  // Responsáveis: ativos + o atual (mesmo que inativo), pra não trocar sem querer
  const usersOpts = DB.usuarios
    .filter(x => x.ativo !== false || x.id === p.responsavelAtualId)
    .map(x => `<option value="${x.id}" ${x.id===p.responsavelAtualId?'selected':''}>${escapeHtml(x.nome)}${x.ativo===false?' (inativo)':''}</option>`).join('');

  const html = `
    <div class="modal-backdrop" id="modal-edit-patr">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">
          <button class="btn secondary" data-close style="width:auto;padding:6px 14px;font-size:13px;">← Voltar</button>
          <h2 style="margin:0;font-size:18px;">Editar patrimônio</h2>
        </div>
        <form id="edit-patr-form" class="card">
          <div class="form-group"><label>Código / Nº do patrimônio *</label><input type="text" id="e-codigo" required value="${escapeHtml(p.codigoBarras||'')}"></div>
          <div class="form-group"><label>Categoria *</label>
            <select id="e-cat" required>${catsDisp.map(c=>`<option value="${c.id}" ${c.id===p.categoriaId?'selected':''}>${c.icone} ${escapeHtml(c.nome)}</option>`).join('')}</select>
          </div>
          <div class="form-group"><label>Subcategoria *</label>
            <select id="e-subcat" required><option value="">— Selecione —</option>${subOpts(p.categoriaId)}</select>
          </div>
          <div class="form-group"><label>Descrição *</label><input type="text" id="e-desc" required value="${escapeHtml(p.descricao||'')}"></div>
          <div class="form-group"><label>Localização</label>
            <select id="e-loc"><option value="">— (nenhuma) —</option>${DB.localizacoes.map(l=>`<option value="${l.id}" ${l.id===p.localizacaoAtualId?'selected':''}>${escapeHtml(l.nome)}</option>`).join('')}</select>
          </div>
          <div class="form-group"><label>Responsável</label>
            <select id="e-resp"><option value="">— (nenhum) —</option>${usersOpts}</select>
          </div>
          <div class="filter-row">
            <div class="form-group" style="flex:1"><label>Nota fiscal</label><input type="text" id="e-nf" value="${escapeHtml(p.notaFiscal||'')}"></div>
            <div class="form-group" style="flex:1"><label>Data aquisição</label><input type="date" id="e-data" value="${(p.dataAquisicao||'').slice(0,10)}"></div>
          </div>
          <div class="form-group"><label>Valor de aquisição (R$)</label><input type="number" id="e-valor" step="0.01" min="0" value="${p.valorAquisicao||0}"></div>
          <div class="form-group"><label>Observações</label><textarea id="e-obs" rows="2">${escapeHtml(p.observacoes||'')}</textarea></div>
          <button type="submit" class="btn">💾 Salvar alterações</button>
        </form>
      </div>
    </div>`;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const node = wrap.firstElementChild; document.body.appendChild(node);
  node.querySelector('[data-close]').addEventListener('click', () => { node.remove(); openDetail(p.id); });

  // Trocar categoria repopula as subcategorias
  const catSel = node.querySelector('#e-cat');
  const subSel = node.querySelector('#e-subcat');
  catSel.addEventListener('change', () => {
    const cid = parseInt(catSel.value);
    subSel.innerHTML = '<option value="">— Selecione —</option>' + (DB.subcategorias||[])
      .filter(s => s.categoriaId === cid)
      .map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');
  });

  node.querySelector('#edit-patr-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const p = DB.patrimonios.find(x => x.id === patrimonioId);   // o do DB de agora (uma recarga pode ter trocado o DB)
    if (!p) return toast('Este item foi alterado — abra de novo', 'error');
    const codigo = node.querySelector('#e-codigo').value.trim();
    if (!codigo) return toast('Informe o código / número do patrimônio', 'error');
    if (DB.patrimonios.some(x => x.id !== p.id && x.status !== 'excluido' && (x.codigoBarras||'').toLowerCase() === codigo.toLowerCase())) {
      return toast('Já existe outro patrimônio com este código: ' + codigo, 'error');
    }
    const catId = parseInt(catSel.value);
    const subId = parseInt(subSel.value) || null;
    if (!subId) return toast('Selecione a subcategoria', 'error');
    const desc = node.querySelector('#e-desc').value.trim();
    if (!desc) return toast('Informe a descrição', 'error');
    const locId = parseInt(node.querySelector('#e-loc').value) || null;
    const respId = node.querySelector('#e-resp').value || null;

    // Lista do que mudou (pro histórico)
    const mud = [];
    if ((p.codigoBarras||'') !== codigo) mud.push('código');
    if (p.categoriaId !== catId) mud.push('categoria');
    if (p.subcategoriaId !== subId) mud.push('subcategoria');
    if ((p.descricao||'') !== desc) mud.push('descrição');
    if (p.localizacaoAtualId !== locId) mud.push('localização');
    if (p.responsavelAtualId !== respId) mud.push('responsável');

    p.codigoBarras = codigo;
    p.categoriaId = catId;
    p.subcategoriaId = subId;
    p.descricao = desc;
    p.localizacaoAtualId = locId;
    p.responsavelAtualId = respId;
    p.notaFiscal = node.querySelector('#e-nf').value.trim();
    p.dataAquisicao = node.querySelector('#e-data').value || null;
    p.valorAquisicao = parseFloat(node.querySelector('#e-valor').value) || 0;
    p.observacoes = node.querySelector('#e-obs').value.trim();
    p.atualizadoEm = new Date().toISOString();

    DB.movimentacoes.push({
      id: nextId('movimentacoes'), patrimonioId: p.id,
      tipo: 'edicao', data: new Date().toISOString(), usuarioId: u.id,
      motivo: 'Dados editados' + (mud.length ? ': ' + mud.join(', ') : '')
    });

    save();
    node.remove(); toast('Alterações salvas', 'success'); openDetail(p.id);
  });
}

function renderTimelineEntry(m) {
  const u = Lookup.user(m.usuarioId);
  const isAccept = m.tipo === 'aceite_recebimento';
  const tipoLabel = ({
    cadastro:'Cadastro inicial',
    solicitacao_cadastro:'Solicitação de cadastro',
    aprovacao_cadastro:'✓ Cadastro aprovado',
    transferencia_local:'Transferência de local',
    transferencia_resp:'Transferência de responsável',
    transferencia_local_resp:'Transferência de local e responsável',
    solicitacao_movimentacao:'Solicitação de movimentação',
    rejeicao_movimentacao:'✗ Movimentação rejeitada',
    manutencao:'Enviado para manutenção',
    retorno_manutencao:'Retorno de manutenção',
    aceite_recebimento:'✓ Recebimento confirmado',
    solicitacao_baixa:'Solicitação de baixa',
    solicitacao_extravio:'Solicitação de extravio',
    rejeicao_baixa:'✗ Baixa rejeitada',
    rejeicao_extravio:'✗ Extravio rejeitado',
    baixa:'Baixa do patrimônio',
    extravio:'Item extraviado',
    inventario:'Inventário',
    edicao:'✏️ Dados editados'
  })[m.tipo] || m.tipo;
  let detalhes = '';
  if (m.destinoLocalId) { const l = Lookup.loc(m.destinoLocalId); if (l) detalhes += '→ ' + l.nome + ' '; }
  if (m.destinoRespId)  { const r = Lookup.user(m.destinoRespId); if (r) detalhes += '· Resp.: ' + r.nome; }
  return `
    <div class="timeline-item ${isAccept?'acceptance':''}">
      <div class="when">${fmtDateTime(m.data)}</div>
      <div class="what">${tipoLabel}</div>
      ${detalhes ? `<div class="meta">${escapeHtml(detalhes)}</div>` : ''}
      ${m.motivo ? `<div class="meta">${escapeHtml(m.motivo)}</div>` : ''}
      <div class="who">por ${escapeHtml(u ? u.nome : '—')}</div>
    </div>
  `;
}

/* ============== MOVE / STATUS ============== */

function openMove(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!Perms.canRequestMove(u, p)) return toast('Sem permissão para esta categoria', 'error');
  /* Quem não gerencia a categoria só pede: o responsável continua o mesmo e a
     troca fica em pending_move até quem gerencia aprovar (a RLS recusa a
     movimentação direta). Antes só valia para 'operador' — nível que ninguém
     mais tem desde a 0016 —, e o almoxarife gravava direto e o banco recusava. */
  const isOpProprio = !Perms.canManageCategoria(u, p.categoriaId);

  const html = `
    <div class="modal-backdrop" id="modal-move">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close-btn" data-close>&times;</button>
        <h2>Movimentar bem</h2>
        <div style="font-size:13px; color:var(--muted); margin-bottom:14px;">${escapeHtml(p.descricao)}</div>

        <div class="lock-hint">
          <span>ℹ️</span>
          <span>${isOpProprio ? 'Sua solicitação será analisada pelo administrador. Após aprovação, o destinatário precisará <strong>aceitar o recebimento</strong>.' : 'O destinatário precisará <strong>aceitar o recebimento</strong> para a movimentação ser efetivada.'}</span>
        </div>

        <form id="move-form">
          <div class="form-group">
            <label>Tipo</label>
            <select id="m-tipo">
              <option value="transferencia_local_resp">Transferir local e/ou responsável</option>
            </select>
          </div>
          <div class="form-group">
            <label>Novo local</label>
            <select id="m-local">
              <option value="">— Manter (${escapeHtml((Lookup.loc(p.localizacaoAtualId)||{}).nome || '—')}) —</option>
              ${DB.localizacoes.map(l => `<option value="${l.id}">${escapeHtml(l.nome)}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Novo responsável</label>
            <select id="m-resp">
              <option value="">— Manter (${escapeHtml((Lookup.user(p.responsavelAtualId)||{}).nome || '—')}) —</option>
              ${DB.usuarios.filter(c => c.ativo !== false || c.id === p.responsavelAtualId).map(c => `<option value="${c.id}">${escapeHtml(c.nome)}${c.setor ? ' (' + escapeHtml(c.setor) + ')' : ''}</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Motivo / Observação</label>
            <textarea id="m-motivo" rows="2" placeholder="Ex.: Realocação para nova obra"></textarea>
          </div>
          <button type="submit" class="btn">Registrar movimentação</button>
        </form>
      </div>
    </div>
  `;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const node = wrap.firstElementChild; document.body.appendChild(node);
  /* clique fora NÃO fecha o modal (evita fechar/retroceder sem querer) — use ✕/Voltar */
  node.querySelector('[data-close]').addEventListener('click', () => node.remove());

  node.querySelector('#move-form').addEventListener('submit', e => {
    e.preventDefault();
    const p = DB.patrimonios.find(x => x.id === patrimonioId);   // o do DB de agora (uma recarga pode ter trocado o DB)
    if (!p) return toast('Este item foi alterado — abra de novo', 'error');
    const novoLocal = parseInt(node.querySelector('#m-local').value) || null;
    const novoResp = node.querySelector('#m-resp').value || null;   // uuid (string)
    const motivo = node.querySelector('#m-motivo').value.trim();
    if (!novoLocal && !novoResp) return toast('Escolha local ou responsável', 'error');

    const tipo = novoLocal && novoResp ? 'transferencia_local_resp' : (novoLocal ? 'transferencia_local' : 'transferencia_resp');
    if (isOpProprio) {
      // Operador OBRA: pede aprovação do ADM OBRA antes de aplicar
      // statusAntes vai para o banco: quem aprova/rejeita está em outro aparelho
      p.pendingMove = { localizacaoAtualId: novoLocal, responsavelAtualId: novoResp, motivo: motivo || '', tipo, statusAntes: p.status };
      p.statusBeforePending = p.status;
      p.status = 'aguardando_aprovacao_movimentacao';
      p.solicitadoMovPor = u.id;
      p.atualizadoEm = new Date().toISOString();
      DB.movimentacoes.push({
        id: nextId('movimentacoes'),
        patrimonioId: p.id, tipo: 'solicitacao_movimentacao',
        data: new Date().toISOString(),
        usuarioId: u.id,
        motivo: 'Solicitação de movimentação' + (motivo ? ' — ' + motivo : ''),
        destinoLocalId: novoLocal, destinoRespId: novoResp
      });
      save();
      notificarWhatsApp('movimentacao_solicitada', {
        codigo: p.codigoBarras, descricao: p.descricao,
        respAtual: (Lookup.user(p.responsavelAtualId) || {}).nome,
        respNovo:  (Lookup.user(novoResp) || {}).nome,
        localizacaoNova: ((DB.localizacoes||[]).find(l => l.id === novoLocal) || {}).nome,
        motivo,
        solicitadoPor: u.nome
      }, WhatsDest.aprovadoresDaCategoria(p.categoriaId).concat([u.id]));
      node.remove();
      toast('Solicitação enviada — aguardando aprovação do administrador', 'success');
      render();
      return;
    }
    DB.movimentacoes.push({
      id: nextId('movimentacoes'),
      patrimonioId: p.id, tipo,
      data: new Date().toISOString(),
      usuarioId: u.id,
      motivo: motivo || 'Movimentação registrada',
      destinoLocalId: novoLocal, destinoRespId: novoResp
    });
    const respAntes = p.responsavelAtualId;
    if (novoLocal) p.localizacaoAtualId = novoLocal;
    if (novoResp)  p.responsavelAtualId = novoResp;
    p.status = 'aguardando_aceite';
    p.atualizadoEm = new Date().toISOString();
    save();
    // Movimentação direta (admin/diretoria) — avisa partes envolvidas + pede aceite ao destino
    notificarWhatsApp('movimentacao_aprovada', {
      codigo: p.codigoBarras, descricao: p.descricao,
      respNovo: (Lookup.user(novoResp) || {}).nome,
      localizacaoNova: ((DB.localizacoes||[]).find(l => l.id === novoLocal) || {}).nome,
      aprovadoPor: u.nome
    }, [respAntes, novoResp, u.id].filter(Boolean));
    if (novoResp) {
      notificarWhatsApp('recebimento_pendente', {
        codigo: p.codigoBarras, descricao: p.descricao,
        localizacao: ((DB.localizacoes||[]).find(l => l.id === novoLocal) || {}).nome,
        enviadoPor: u.nome
      }, [novoResp]);
    }
    node.remove();
    toast('Movimentação registrada — aguardando aceite do destinatário', 'success');
    render();
  });
}

function changeStatus(patrimonioId, novoStatus, motivo, tipoMov) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!Perms.canManageCategoria(u, p.categoriaId)) return toast('Sem permissão para esta categoria', 'error');
  p.status = novoStatus;
  p.atualizadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: tipoMov || novoStatus, data: new Date().toISOString(),
    usuarioId: u.id, motivo: motivo || ''
  });
  save();
  toast('Status atualizado', 'success');
  render();
}

function acceptReceipt(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (p.status !== 'aguardando_aceite' || p.responsavelAtualId !== u.id) {
    return toast('Apenas o destinatário pode aceitar', 'error');
  }
  // Se havia status pendente (ex: aguardando aceite p/ envio à manutenção), aplica
  if (p.pendingStatus) { p.status = p.pendingStatus; delete p.pendingStatus; }
  else { p.status = 'ativo'; }
  p.atualizadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: 'aceite_recebimento', data: new Date().toISOString(),
    usuarioId: u.id, motivo: 'Recebimento confirmado pelo destinatário'
  });
  save();
  notificarWhatsApp('recebimento_aceito', {
    codigo: p.codigoBarras, descricao: p.descricao,
    responsavel: u.nome
  }, WhatsDest.envolvidos(p).concat(WhatsDest.diretoria()));
  toast('Recebimento confirmado', 'success');
  render();
}

/* Envia patrimônio para manutenção via aceite. Pede destinatário e marca status='aguardando_aceite'+pendingStatus='manutencao' */
function sendToMaintenance(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p) return;
  // Constrói lista de candidatos a recebedor (todos os usuários ativos)
  const opts = DB.usuarios.filter(x => x.ativo !== false || x.id === p.responsavelAtualId).map(x => `<option value="${x.id}" ${x.id===p.responsavelAtualId?'selected':''}>${escapeHtml(x.nome)}${x.setor ? ' (' + escapeHtml(x.setor) + ')' : ''}</option>`).join('');
  const html = `
    <div class="modal-backdrop" id="modal-mnt">
      <div class="modal" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--border);">
          <button class="btn secondary" data-close style="width:auto;padding:6px 14px;font-size:13px;">← Voltar</button>
          <h2 style="margin:0;font-size:18px;">Enviar para manutenção</h2>
        </div>
        <div class="form-group">
          <label>Responsável da manutenção *</label>
          <select id="mnt-resp" required>${opts}</select>
          <div class="form-help">Esta pessoa precisará confirmar o recebimento para o status virar "Manutenção".</div>
        </div>
        <div class="form-group">
          <label>Motivo / observações</label>
          <textarea id="mnt-motivo" rows="2" placeholder="Ex.: Tela com defeito"></textarea>
        </div>
        <button class="btn warning" id="mnt-confirm">🔧 Enviar para manutenção</button>
      </div>
    </div>`;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const node = wrap.firstElementChild; document.body.appendChild(node);
  /* clique fora NÃO fecha o modal (evita fechar/retroceder sem querer) — use ✕/Voltar */
  node.querySelector('[data-close]').addEventListener('click', () => node.remove());
  node.querySelector('#mnt-confirm').addEventListener('click', () => {
    const p = DB.patrimonios.find(x => x.id === patrimonioId);   // o do DB de agora (uma recarga pode ter trocado o DB)
    if (!p) return toast('Este item foi alterado — abra de novo', 'error');
    const respId = node.querySelector('#mnt-resp').value || null;   // uuid (string)
    const motivo = node.querySelector('#mnt-motivo').value.trim();
    if (!respId) return toast('Selecione o responsável', 'error');
    p.responsavelAtualId = respId;
    p.status = 'aguardando_aceite';
    p.pendingStatus = 'manutencao';
    p.atualizadoEm = new Date().toISOString();
    DB.movimentacoes.push({
      id: nextId('movimentacoes'), patrimonioId: p.id,
      tipo: 'manutencao', data: new Date().toISOString(),
      usuarioId: u.id, motivo: 'Enviado para manutenção' + (motivo ? ' — ' + motivo : ''),
      destinoRespId: respId
    });
    save();
    node.remove();
    toast('Aguardando aceite do responsável da manutenção', 'success');
    openDetail(patrimonioId);
  });
}

/* ============== APROVAÇÕES DE CADASTRO ============== */
function approveCadastro(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p || p.status !== 'aguardando_aprovacao_cadastro') return;
  if (!Perms.canApproveCadastro(u, p.categoriaId)) return toast('Sem permissão para aprovar', 'error');
  // Software (cat 3): aprovação vai direto para ativo (não há aceite físico de licença)
  const isSoft = p.categoriaId === 3;
  p.status = isSoft ? 'ativo' : 'aguardando_aceite';
  p.aprovadoPor = u.id; p.aprovadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: 'aprovacao_cadastro', data: new Date().toISOString(),
    usuarioId: u.id, motivo: isSoft ? 'Licença aprovada e ativada' : 'Cadastro aprovado'
  });
  save();
  notificarWhatsApp('cadastro_aprovado', {
    codigo: p.codigoBarras, descricao: p.descricao,
    responsavel: (Lookup.user(p.responsavelAtualId) || {}).nome,
    aprovadoPor: u.nome,
    isSoftware: isSoft
  }, [p.criadoPor, p.responsavelAtualId].filter(Boolean));
  // Aviso ao responsável que precisa aceitar (hardware)
  if (!isSoft && p.responsavelAtualId && p.responsavelAtualId !== p.criadoPor) {
    notificarWhatsApp('recebimento_pendente', {
      codigo: p.codigoBarras, descricao: p.descricao,
      localizacao: ((DB.localizacoes||[]).find(l => l.id === p.localizacaoAtualId) || {}).nome,
      enviadoPor: u.nome
    }, [p.responsavelAtualId]);
  }
  toast(isSoft ? 'Licença aprovada e ativada' : 'Cadastro aprovado — aguardando aceite do responsável', 'success');
  render();
}
function rejectCadastro(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p || p.status !== 'aguardando_aprovacao_cadastro') return;
  if (!Perms.canApproveCadastro(u, p.categoriaId)) return toast('Sem permissão para rejeitar', 'error');
  notificarWhatsApp('cadastro_rejeitado', {
    codigo: p.codigoBarras, descricao: p.descricao,
    rejeitadoPor: u.nome
  }, [p.criadoPor].filter(Boolean));
  // Exclusão LÓGICA: o cadastro rejeitado some do app (status 'excluido' é
  // filtrado em canSee), mas o registro e o histórico ficam no Supabase.
  p.status = 'excluido';
  p.atualizadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: 'rejeicao_cadastro', data: new Date().toISOString(),
    usuarioId: u.id, motivo: p.solicitacaoMotivo ? ('Cadastro rejeitado — ' + p.solicitacaoMotivo) : 'Cadastro rejeitado pela administração'
  });
  save(); toast('Cadastro rejeitado (registro mantido no Supabase)', 'success'); render();
}

function approveMove(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p || p.status !== 'aguardando_aprovacao_movimentacao') return;
  if (!Perms.canApproveCadastro(u, p.categoriaId)) return toast('Sem permissão para aprovar', 'error');
  const m = p.pendingMove || {};
  const novoLocal = m.localizacaoAtualId || null;
  const novoResp  = m.responsavelAtualId || null;
  const respAnterior = p.responsavelAtualId;
  const solicitanteId = p.solicitadoMovPor;
  if (novoLocal) p.localizacaoAtualId = novoLocal;
  if (novoResp)  p.responsavelAtualId = novoResp;
  p.status = 'aguardando_aceite';
  p.aprovadoMovPor = u.id;
  p.atualizadoEm = new Date().toISOString();
  delete p.pendingMove;
  delete p.statusBeforePending;
  delete p.solicitadoMovPor;
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: m.tipo || 'transferencia_local_resp', data: new Date().toISOString(),
    usuarioId: u.id,
    motivo: 'Movimentação aprovada' + (m.motivo ? ' — ' + m.motivo : ''),
    destinoLocalId: novoLocal, destinoRespId: novoResp
  });
  save();
  notificarWhatsApp('movimentacao_aprovada', {
    codigo: p.codigoBarras, descricao: p.descricao,
    respNovo: (Lookup.user(novoResp) || {}).nome,
    localizacaoNova: ((DB.localizacoes||[]).find(l => l.id === novoLocal) || {}).nome,
    aprovadoPor: u.nome
  }, [solicitanteId, respAnterior, novoResp].filter(Boolean));
  // Aviso direto ao novo responsável: precisa aceitar
  if (novoResp) {
    notificarWhatsApp('recebimento_pendente', {
      codigo: p.codigoBarras, descricao: p.descricao,
      localizacao: ((DB.localizacoes||[]).find(l => l.id === novoLocal) || {}).nome,
      enviadoPor: u.nome
    }, [novoResp]);
  }
  toast('Movimentação aprovada — aguardando aceite do destinatário', 'success');
  render();
}

function rejectMove(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p || p.status !== 'aguardando_aprovacao_movimentacao') return;
  if (!Perms.canApproveCadastro(u, p.categoriaId)) return toast('Sem permissão para rejeitar', 'error');
  p.status = p.statusBeforePending || (p.pendingMove && p.pendingMove.statusAntes) || 'ativo';
  const motivoMov = (p.pendingMove && p.pendingMove.motivo) || '';
  delete p.pendingMove;
  delete p.statusBeforePending;
  const solId = p.solicitadoMovPor; delete p.solicitadoMovPor;
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: 'rejeicao_movimentacao', data: new Date().toISOString(),
    usuarioId: u.id, motivo: 'Movimentação rejeitada'
  });
  save();
  notificarWhatsApp('movimentacao_rejeitada', {
    codigo: p.codigoBarras, descricao: p.descricao,
    motivo: motivoMov,
    rejeitadoPor: u.nome
  }, [solId].filter(Boolean));
  toast('Movimentação rejeitada', 'success');
  render();
}

/* ============== APROVAÇÕES DE BAIXA / EXTRAVIO ============== */
function requestBaixa(patrimonioId, tipo) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p) return;
  if (!Perms.canRequestBaixa(u, p.categoriaId)) return toast('Sem permissão', 'error');
  const label = tipo === 'baixa' ? 'baixa' : 'extravio';
  if (Perms.isDiretoria(u)) {
    if (!confirm(`Confirmar ${label} deste patrimônio?`)) return;
    p.statusAnterior = p.status;
    p.status = tipo === 'baixa' ? 'baixado' : 'extraviado';
    p.atualizadoEm = new Date().toISOString();
    DB.movimentacoes.push({
      id: nextId('movimentacoes'), patrimonioId: p.id,
      tipo: tipo === 'baixa' ? 'baixa' : 'extravio',
      data: new Date().toISOString(), usuarioId: u.id,
      motivo: tipo === 'baixa' ? 'Baixa do patrimônio (Diretoria)' : 'Item extraviado (Diretoria)'
    });
    save();
    notificarWhatsApp(tipo === 'baixa' ? 'baixa_aprovada' : 'extravio_aprovado', {
      codigo: p.codigoBarras, descricao: p.descricao,
      aprovadoPor: u.nome
    }, WhatsDest.diretoriaMais(p.responsavelAtualId, p.criadoPor));
    toast(`${label.charAt(0).toUpperCase()+label.slice(1)} efetivada`, 'success'); render(); return;
  }
  const motivo = prompt(`Motivo da solicitação de ${label}:`, '');
  if (motivo === null) return;
  p.statusAnterior = p.status;
  p.status = tipo === 'baixa' ? 'aguardando_aprovacao_baixa' : 'aguardando_aprovacao_extravio';
  p.solicitadoPor = u.id; p.solicitadoEm = new Date().toISOString(); p.solicitacaoMotivo = motivo;
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: tipo === 'baixa' ? 'solicitacao_baixa' : 'solicitacao_extravio',
    data: new Date().toISOString(), usuarioId: u.id,
    motivo: motivo || `Solicitação de ${label}`
  });
  save();
  notificarWhatsApp(tipo === 'baixa' ? 'baixa_solicitada' : 'extravio_solicitado', {
    codigo: p.codigoBarras, descricao: p.descricao,
    responsavel: (Lookup.user(p.responsavelAtualId) || {}).nome,
    motivo,
    solicitadoPor: u.nome
  }, WhatsDest.diretoriaMais(u.id, p.responsavelAtualId));
  toast(`Solicitação de ${label} enviada à Diretoria`, 'success'); render();
}
function approveBaixa(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p) return;
  if (!Perms.canApproveBaixa(u)) return toast('Apenas a Diretoria pode aprovar', 'error');
  const isBaixa = p.status === 'aguardando_aprovacao_baixa';
  const isExtr  = p.status === 'aguardando_aprovacao_extravio';
  if (!isBaixa && !isExtr) return;
  const solicitanteId = p.solicitadoPor;
  p.status = isBaixa ? 'baixado' : 'extraviado';
  p.aprovadoPor = u.id; p.aprovadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: isBaixa ? 'baixa' : 'extravio',
    data: new Date().toISOString(), usuarioId: u.id,
    motivo: isBaixa ? 'Baixa aprovada pela Diretoria' : 'Extravio aprovado pela Diretoria'
  });
  save();
  notificarWhatsApp(isBaixa ? 'baixa_aprovada' : 'extravio_aprovado', {
    codigo: p.codigoBarras, descricao: p.descricao,
    aprovadoPor: u.nome
  }, [solicitanteId, p.responsavelAtualId, p.criadoPor].filter(Boolean));
  toast(`${isBaixa ? 'Baixa' : 'Extravio'} aprovado`, 'success'); render();
}
function rejectBaixa(patrimonioId) {
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  const u = Lookup.user(DB.currentUser);
  if (!p) return;
  if (!Perms.canApproveBaixa(u)) return toast('Apenas a Diretoria pode rejeitar', 'error');
  const isBaixa = p.status === 'aguardando_aprovacao_baixa';
  const isExtr  = p.status === 'aguardando_aprovacao_extravio';
  if (!isBaixa && !isExtr) return;
  const solicitanteId = p.solicitadoPor;
  p.status = p.statusAnterior || 'ativo';
  delete p.statusAnterior; delete p.solicitadoPor; delete p.solicitadoEm; delete p.solicitacaoMotivo;
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: isBaixa ? 'rejeicao_baixa' : 'rejeicao_extravio',
    data: new Date().toISOString(), usuarioId: u.id,
    motivo: isBaixa ? 'Baixa rejeitada pela Diretoria' : 'Extravio rejeitado pela Diretoria'
  });
  save();
  notificarWhatsApp(isBaixa ? 'baixa_rejeitada' : 'extravio_rejeitado', {
    codigo: p.codigoBarras, descricao: p.descricao,
    rejeitadoPor: u.nome
  }, [solicitanteId, p.responsavelAtualId].filter(Boolean));
  toast('Solicitação rejeitada', 'success'); render();
}

function deletePatrimonio(patrimonioId) {
  const u = Lookup.user(DB.currentUser);
  if (!Perms.canDelete(u)) return toast('Apenas a Diretoria pode excluir', 'error');
  const p = DB.patrimonios.find(x => x.id === patrimonioId);
  if (!p) return;
  // Exclusão LÓGICA: o item some do app (status 'excluido' é filtrado em canSee),
  // mas o registro e todo o histórico de movimentações continuam no Supabase.
  // Não removemos das listas em memória → o sync não dispara DELETE no banco.
  p.status = 'excluido';
  p.atualizadoEm = new Date().toISOString();
  DB.movimentacoes.push({
    id: nextId('movimentacoes'), patrimonioId: p.id,
    tipo: 'exclusao', data: new Date().toISOString(),
    usuarioId: u.id, motivo: 'Excluído do app pela Diretoria — registro preservado'
  });
  save();
  toast('Patrimônio excluído (registro mantido no Supabase)', 'success');
  render();
}

function bindCreate() {
  const u = Lookup.user(DB.currentUser);
  if (!Perms.canCreate(u)) return;

  const scanBtn = $('#c-scan');
  if (scanBtn) scanBtn.addEventListener('click', () => openScanner((code) => { $('#c-codigo').value = code; }));

  // Botões de foto: tirar (camera) ou galeria
  const btnTirar = $('#btn-tirar-foto');
  const btnEscolher = $('#btn-escolher-foto');
  const inpFoto = $('#c-foto');
  const inpGal  = $('#c-foto-galeria');
  if (btnTirar && inpFoto) btnTirar.addEventListener('click', () => inpFoto.click());
  if (btnEscolher && inpGal) btnEscolher.addEventListener('click', () => inpGal.click());
  // Preview e copia da seleção da galeria para o input principal
  const previewFoto = (file) => {
    const preview = $('#c-foto-preview');
    if (!file || !preview) return;
    if (!file.type.startsWith('image/')) { preview.innerHTML = '<div style="color:var(--danger);font-size:12px;">Apenas imagens.</div>'; return; }
    const url = URL.createObjectURL(file);
    preview.innerHTML = `<div style="position:relative;display:inline-block;">
        <img src="${url}" style="max-width:200px;max-height:200px;border-radius:8px;border:1px solid var(--border);display:block;">
        <button type="button" id="c-foto-remove" title="Remover foto" style="position:absolute;top:4px;right:4px;width:26px;height:26px;border:none;border-radius:50%;background:var(--danger);color:#fff;font-size:14px;line-height:1;cursor:pointer;">✕</button>
      </div>`;
    const rm = preview.querySelector('#c-foto-remove');
    if (rm) rm.addEventListener('click', () => {
      if (inpFoto) inpFoto.value = '';
      if (inpGal)  inpGal.value = '';
      preview.innerHTML = '';
    });
  };
  if (inpFoto) inpFoto.addEventListener('change', e => previewFoto(e.target.files[0]));
  if (inpGal)  inpGal.addEventListener('change',  e => {
    // Move o arquivo para inpFoto para o submit lê-lo dali
    if (inpGal.files[0]) {
      const dt = new DataTransfer();
      dt.items.add(inpGal.files[0]);
      inpFoto.files = dt.files;
      previewFoto(inpGal.files[0]);
    }
  });

  // Toggle campos software
  const catSel = $('#c-cat');
  function toggleSoftwareFields() {
    if (!catSel) return;
    const isSoft = parseInt(catSel.value) === 3;
    const fhw  = $('#form-hardware'),  fsw  = $('#form-software');
    const fhwx = $('#form-hw-extra');
    if (fhw)  fhw.style.display  = isSoft ? 'none'  : 'block';
    if (fhwx) fhwx.style.display = isSoft ? 'none'  : 'block';
    if (fsw)  fsw.style.display  = isSoft ? 'block' : 'none';
    if ($('#sw-chave'))  $('#sw-chave').required  = isSoft;
    if ($('#sw-resp'))   $('#sw-resp').required   = isSoft;
    if ($('#sw-equipamento')) $('#sw-equipamento').required = isSoft;
    if ($('#sw-subcat')) $('#sw-subcat').required = isSoft;
    if ($('#c-desc'))    $('#c-desc').required    = !isSoft;
    if ($('#c-loc'))     $('#c-loc').required     = !isSoft;
    if ($('#c-resp'))    $('#c-resp').required    = !isSoft;
    if ($('#c-subcat'))  $('#c-subcat').required  = !isSoft;
    if ($('#c-foto'))    $('#c-foto').required    = !isSoft;
    // Código de barras: só usado para hardware (software é auto-gerado)
    const codGroup = $('#c-codigo-group');
    const codInput = $('#c-codigo');
    if (codGroup) codGroup.style.display = isSoft ? 'none' : 'block';
    if (codInput) codInput.required = !isSoft;
    // Popular subcategorias hardware
    const subcatSel = $('#c-subcat');
    if (subcatSel && !isSoft) {
      const catId = parseInt(catSel.value);
      const subs = (DB.subcategorias||[]).filter(s => s.categoriaId === catId);
      subcatSel.innerHTML = '<option value="">— Selecione —</option>' + subs.map(s => `<option value="${s.id}">${escapeHtml(s.nome)}</option>`).join('');
    }
    // Popular subcategorias software (com pré-seleção da primeira)
    const swSubcatSel = $('#sw-subcat');
    if (swSubcatSel && isSoft) {
      const subs = (DB.subcategorias||[]).filter(s => s.categoriaId === 3);
      swSubcatSel.innerHTML = subs.map((s,i) => `<option value="${s.id}"${i===0?' selected':''}>${escapeHtml(s.nome)}</option>`).join('');
    }
    // Pré-preencher Data do registro com hoje
    const swDataReg = $('#sw-data-registro');
    if (swDataReg && isSoft && !swDataReg.value) {
      swDataReg.value = new Date().toISOString().slice(0,10);
    }
  }
  if (catSel) { catSel.addEventListener('change', toggleSoftwareFields); toggleSoftwareFields(); }


  $('#create-form').addEventListener('submit', async e => {
    e.preventDefault();
    const catId = parseInt($('#c-cat').value);
    const isOperador = Perms.isOperador(u);
    if (!isOperador && !Perms.canManageCategoria(u, catId)) return toast('Sem permissão para esta categoria', 'error');

    // ── Softwares TI (cat 3) ─────────────────────────────────
    if (catId === 3) {
      const chave = $('#sw-chave')  ? $('#sw-chave').value.trim()  : '';
      const resp  = $('#sw-resp')   ? $('#sw-resp').value.trim()   : '';
      const equip = $('#sw-equipamento') ? $('#sw-equipamento').value.trim() : '';
      const swSubcatId = $('#sw-subcat') ? (parseInt($('#sw-subcat').value)||null) : null;
      if (!swSubcatId) return toast('Selecione a subcategoria', 'error');
      if (!chave)      return toast('Informe o número da licença', 'error');
      if (!resp)       return toast('Informe o responsável', 'error');
      if (!equip)      return toast('Informe o equipamento', 'error');
      const subcatObj = (DB.subcategorias||[]).find(s => s.id === swSubcatId);
      const subcatNome = subcatObj ? subcatObj.nome : 'Licença';
      const descricao  = subcatNome + ' — ' + chave;
      // Contador de licença derivado dos códigos BM-SW-#### já existentes (P1-12):
      // o nextId de patrimônio virou Date.now(), então DB._nextId.patrimonios não avança mais.
      const swNums = DB.patrimonios
        .map(x => (x.codigoBarras||'').match(/^BM-SW-(\d+)$/i))
        .filter(Boolean).map(m => parseInt(m[1], 10));
      const autoCode = 'BM-SW-' + String((swNums.length ? Math.max(...swNums) : 0) + 1).padStart(4,'0');
      const sw = {
        id: nextId('patrimonios'), codigoBarras: autoCode,
        categoriaId: 3, subcategoriaId: swSubcatId,
        descricao: descricao, tipoSoftware: subcatNome,
        licencaChave: chave,
        licencaValidade: $('#sw-validade') ? $('#sw-validade').value || null : null,
        licencaResponsavel: resp,
        licencaEquipamento: equip,
        valorAquisicao: parseFloat($('#sw-valor') ? $('#sw-valor').value : '0') || 0,
        dataAquisicao: $('#sw-data') ? $('#sw-data').value || null : null,

      };

      });
      save();

        ? WhatsDest.aprovadoresDaCategoria(3).concat([u.id])

      notificarWhatsApp(isOperador ? 'patrimonio_solicitado' : 'patrimonio_cadastrado', {

      );

    // ── Hardware (cats 1 e 2) ─────────────────────────────────
    const codigo = $('#c-codigo').value.trim();
    if (!codigo) return toast('Informe o código de barras / número do patrimônio', 'error');
    if (DB.patrimonios.some(p => p.status !== 'excluido' && (p.codigoBarras||'').toLowerCase() === codigo.toLowerCase())) {
      return toast('Já existe um patrimônio cadastrado com este código: ' + codigo, 'error');
    }
    const subcatId = $('#c-subcat') ? (parseInt($('#c-subcat').value)||null) : null;
    if (!subcatId) return toast('Selecione a subcategoria', 'error');
    const fotoFile = $('#c-foto') && $('#c-foto').files[0];

    const novo = {

      criadoPor: u.id,
      criadoEm: new Date().toISOString()
    };
    DB.patrimonios.push(novo);
    DB.movimentacoes.push({
      id: nextId('movimentacoes'), patrimonioId: novo.id,
      tipo: isOperador ? 'solicitacao_cadastro' : 'cadastro',
      data: new Date().toISOString(),
      usuarioId: u.id,

      destinoLocalId: novo.localizacaoAtualId, destinoRespId: novo.responsavelAtualId
    });
    save();
    // Destinatários:
    //  - Aguardando aprovação: aprovadores da categoria (Diretoria + admin)
    //  - Cadastro direto (admin/diretoria): responsável atual (precisa aceitar)
    const destCad = isOperador
      ? WhatsDest.aprovadoresDaCategoria(novo.categoriaId).concat([u.id])
      : [novo.responsavelAtualId, u.id].filter(Boolean);
    notificarWhatsApp(isOperador ? 'patrimonio_solicitado' : 'patrimonio_cadastrado', {
      codigo: novo.codigoBarras,
      descricao: novo.descricao,
      categoria: ((DB.categorias||[]).find(c => c.id === novo.categoriaId) || {}).nome,

      isOperador
        ? 'Solicitação enviada — aguardando aprovação do administrador'
        : 'Cadastrado — aguardando aceite do responsável',

/* ============== SCANNER ============== */

let codeReader = null;
function openScanner(onCode, keepOpen=false) {
  const html = `
    <div class="modal-backdrop" id="modal-scan">
      <div class="modal" onclick="event.stopPropagation()">
        <button class="close-btn" data-close>&times;</button>
        <h2>Escanear código</h2>
        <div class="scanner-container">
          <video id="scanner-video" playsinline></video>
          <div class="scanner-overlay"></div>
          <div class="scanner-status" id="scanner-status">Aponte para o código de barras</div>
        </div>
        <div class="form-group" style="margin-top:14px;">
          <label>Ou digite o código manualmente</label>
          <input type="text" id="manual-code" placeholder="Ex.: BM-TI-0001">
        </div>
        <button class="btn" id="manual-go">Confirmar código</button>
      </div>
    </div>
  `;
  const wrap = document.createElement('div'); wrap.innerHTML = html;
  const node = wrap.firstElementChild; document.body.appendChild(node);
  const close = () => {
    if (codeReader) { try { codeReader.reset(); } catch {} codeReader = null; }
    node.remove();
  };
  node.addEventListener('click', e => { if (e.target === node) close(); });
  node.querySelector('[data-close]').addEventListener('click', close);

  let _ultimoCode = null, _ultimoCodeAt = 0;
  const handleCode = (code) => {
    if (!onCode) {
      // default: try to find and open
      const p = DB.patrimonios.find(p => p.codigoBarras === code);
      if (p) { close(); openDetail(p.id); }
      else { node.querySelector('#scanner-status').textContent = 'Código não cadastrado: ' + code; }
      return;
    }
    if (keepOpen) {
      // Inventário: mantém a câmera aberta pra ler vários seguidos; ignora releitura do mesmo código (P2-25)
      const agora = Date.now();
      if (code === _ultimoCode && (agora - _ultimoCodeAt) < 2500) return;
      _ultimoCode = code; _ultimoCodeAt = agora;
      onCode(code);
      const st = node.querySelector('#scanner-status');
      if (st) st.textContent = '✓ Lido: ' + code;
    } else {
      onCode(code);
      close();
    }
  };

  node.querySelector('#manual-go').addEventListener('click', () => {
    const c = node.querySelector('#manual-code').value.trim();
    if (!c) return;
    handleCode(c);
  });

  // Try to start camera
  try {
    if (typeof ZXing === 'undefined') throw new Error('ZXing não carregou');
    codeReader = new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromVideoDevice(null, 'scanner-video', (result, err) => {
      if (result) {
        node.querySelector('#scanner-status').textContent = '✓ Lido: ' + result.text;
        handleCode(result.text);
      }
    }).catch(e => {
      node.querySelector('#scanner-status').textContent = 'Sem acesso à câmera. Use o campo abaixo.';
    });
  } catch (e) {
    node.querySelector('#scanner-status').textContent = 'Câmera indisponível. Digite manualmente.';
  }
}

/* ============== IMPORTAÇÃO CSV ============== */
function parseCSV(text) {
  // Parser CSV simples com suporte a aspas e vírgulas dentro de campos.
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i], next = text[i+1];
    if (inQuotes) {
      if (c === '"' && next === '"') { field += '"'; i++; }
      else if (c === '"') inQuotes = false;
      else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',' || c === ';') { row.push(field); field = ''; }
      else if (c === '\r') { /* skip */ }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else field += c;
    }
  }
  if (field.length > 0 || row.length > 0) { row.push(field); rows.push(row); }
  return rows.filter(r => r.some(v => (v||'').trim() !== ''));
}

function csvEscape(v) {
  if (v == null) return '';
  const s = String(v);
  if (/[",;\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function downloadCsv(filename, rows) {
  const csv = rows.map(r => r.map(csvEscape).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

        node.querySelector('#csv-preview').innerHTML = total > 0
          ? `<div style="color:var(--success);">✓ ${total} linha(s) lida(s). Cabeçalho: <code>${escapeHtml(parsedRows[0].slice(0,5).join(', '))}…</code></div>`
          : `<div style="color:var(--danger);">Arquivo vazio ou sem dados.</div>`;
      } catch (err) {
        parsedRows = null;
        node.querySelector('#csv-preview').innerHTML = `<div style="color:var(--danger);">Erro ao ler: ${escapeHtml(err.message)}</div>`;
      }
    };
    reader.readAsText(file, 'utf-8');
  });

  // Importar
  node.querySelector('#csv-import').addEventListener('click', () => {
    if (!parsedRows || parsedRows.length < 2) return toast('Selecione um CSV com dados', 'error');
    const catId = parseInt(node.querySelector('#csv-cat').value);
    const tpl = CSV_TEMPLATES[catId]; if (!tpl) return;
    const headers = parsedRows[0].map(h => h.trim());
    const required = tpl.headers;
    const missing = required.filter(h => !headers.includes(h));
    if (missing.length) return toast(`Colunas faltando: ${missing.join(', ')}`, 'error');

    let criados = 0, atualizados = 0, erros = [];
    const idx = (h) => headers.indexOf(h);

    for (let i = 1; i < parsedRows.length; i++) {
      const row = parsedRows[i];
      const get = (h) => (row[idx(h)] || '').trim();
      try {
        if (catId === 3) {
          // SOFTWARE
          const subNome = get('subcategoria');
          let sub = (DB.subcategorias||[]).find(x => x.categoriaId === 3 && x.nome.toLowerCase() === subNome.toLowerCase());
          if (!sub) {
            sub = { id: nextId('subcategorias'), nome: subNome || 'Outros', categoriaId: 3 };
            DB.subcategorias.push(sub);
          }
          const chave = get('licencaChave');
          if (!chave) { erros.push(`L${i+1}: licencaChave vazio`); continue; }
          const codigo = 'BM-SW-' + String(DB._nextId.patrimonios).padStart(4,'0');
          const desc = sub.nome + ' — ' + chave;
          const novo = {
            id: nextId('patrimonios'), codigoBarras: codigo,
            categoriaId: 3, subcategoriaId: sub.id,
            descricao: desc, tipoSoftware: sub.nome,
            licencaChave: chave,
            licencaValidade: get('licencaValidade') || null,
            licencaResponsavel: get('licencaResponsavel'),
            licencaEquipamento: get('licencaEquipamento'),
            valorAquisicao: parseFloat(get('valorAquisicao')) || 0,
            dataAquisicao: get('dataAquisicao') || null,
            dataRegistro: get('dataRegistro') || null,
            observacoes: get('observacoes'),
            status: 'ativo', criadoPor: u.id, criadoEm: new Date().toISOString(),
            localizacaoAtualId: null, responsavelAtualId: u.id
          };
          DB.patrimonios.push(novo);
          DB.movimentacoes.push({ id: nextId('movimentacoes'), patrimonioId: novo.id,
            tipo: 'cadastro', data: new Date().toISOString(), usuarioId: u.id, motivo: 'Importação CSV' });
          criados++;
        } else {
          // HARDWARE (Obra ou TI - Equipamentos)
          const codigo = get('codigoBarras');
          if (!codigo) { erros.push(`L${i+1}: codigoBarras vazio`); continue; }
          const desc = get('descricao');
          if (!desc) { erros.push(`L${i+1}: descricao vazia`); continue; }
          const subNome = get('subcategoria');
          let sub = (DB.subcategorias||[]).find(x => x.categoriaId === catId && x.nome.toLowerCase() === subNome.toLowerCase());
          if (!sub && subNome) {
            sub = { id: nextId('subcategorias'), nome: subNome, categoriaId: catId };
            DB.subcategorias.push(sub);
          }
          const locNome = get('localizacao');
          let loc = (DB.localizacoes||[]).find(x => x.nome.toLowerCase() === locNome.toLowerCase());
          if (!loc && locNome) {
            loc = { id: nextId('localizacoes'), nome: locNome, tipo: 'unidade', parent: null };
            DB.localizacoes.push(loc);
          }
          const respEmail = get('responsavelEmail').toLowerCase();
          let resp = DB.usuarios.find(x => x.email.toLowerCase() === respEmail);
          if (!resp) resp = u; // default ao admin que importa

          const existing = DB.patrimonios.find(p => p.status !== 'excluido' && (p.codigoBarras||'').toLowerCase() === codigo.toLowerCase());
          const dados = {
            codigoBarras: codigo,
            descricao: desc,
            categoriaId: catId,
            subcategoriaId: sub ? sub.id : null,
            marca: get('marca'),
            modelo: get('modelo'),
            numeroSerie: get('numeroSerie'),
            notaFiscal: get('notaFiscal'),
            dataAquisicao: get('dataAquisicao') || null,
            valorAquisicao: parseFloat(get('valorAquisicao')) || 0,
            localizacaoAtualId: loc ? loc.id : null,
            responsavelAtualId: resp.id,
            observacoes: get('observacoes')
          };
          if (existing) {
            Object.assign(existing, dados);
            atualizados++;
            DB.movimentacoes.push({ id: nextId('movimentacoes'), patrimonioId: existing.id,
              tipo: 'edicao', data: new Date().toISOString(), usuarioId: u.id, motivo: 'Atualizado via importação CSV' });
          } else {
            const novo = { id: nextId('patrimonios'), ...dados,
              status: 'ativo', criadoPor: u.id, criadoEm: new Date().toISOString() };
            DB.patrimonios.push(novo);
            DB.movimentacoes.push({ id: nextId('movimentacoes'), patrimonioId: novo.id,
              tipo: 'cadastro', data: new Date().toISOString(), usuarioId: u.id, motivo: 'Importação CSV' });
            criados++;
          }
        }
      } catch (err) {
        erros.push(`L${i+1}: ${err.message}`);
      }
    }
    save();
    let msg = `${criados} criado(s), ${atualizados} atualizado(s)`;
    if (erros.length) msg += `, ${erros.length} erro(s)`;
    toast(msg, erros.length ? 'error' : 'success');
    if (erros.length) console.warn('Erros de importação:', erros);
    node.remove();
    render();
  });
}

// Comprime imagem (File) e retorna Promise<dataURL JPEG>
function comprimirImagem(file, maxLado = 1024, qualidade = 0.68) {
  return new Promise((resolve, reject) => {
    if (!file) return resolve(null);
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxLado || h > maxLado) {
          if (w > h) { h = Math.round(h * maxLado / w); w = maxLado; }
          else       { w = Math.round(w * maxLado / h); h = maxLado; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = () => reject(new Error('Falha ao ler imagem'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

/* ===== Aviso de nova versão (mesmo padrão do Flow e do portal) =====
   Página única fica aberta no celular por dias; sem isto a pessoa segue
   na versão velha. O publicar.js grava version.json com o APP_VERSION. */
(function () {
  let avisando = false, emVoo = false;
  // na tela de senha nova, recarregar perderia o link do e-mail
  const naTelaDeSenha = () => !!document.getElementById('nova-senha-form');
  function conferir() {
    // emVoo: duas conferências juntas criavam duas faixas e o botão ficava sem clique
    if (avisando || emVoo || document.hidden || naTelaDeSenha()) return;
    emVoo = true;
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(r => (r.ok ? r.json() : null))
      .then(v => {
        if (!v || !v.versao || v.versao === APP_VERSION || avisando || naTelaDeSenha()) return;
        avisando = true;
        const f = document.createElement('div');
        f.className = 'faixa-atualizar'; f.setAttribute('role', 'status');
        f.innerHTML = '<span>Nova versão do Patrimônio disponível</span><button type="button" id="btn-atualizar-versao">Atualizar agora</button>';
        document.body.appendChild(f);
        f.querySelector('button').addEventListener('click', () => location.reload());
      })
      .catch(() => {})    // sem internet: silêncio, tenta de novo depois
      .then(() => { emVoo = false; });
  }
  setInterval(conferir, 120000);
  document.addEventListener('visibilitychange', conferir);
  setTimeout(conferir, 8000);
})();

/* ===== Logout automático por inatividade (dispositivos compartilhados) ===== */
const IDLE_LOGOUT_MS = 12 * 60 * 60 * 1000; // 12h sem uso → desloga (mude aqui p/ ajustar)
let _idleTimer = null;
function resetIdleTimer() {
  if (_idleTimer) clearTimeout(_idleTimer);
  _idleTimer = setTimeout(async () => {
    if (DB && DB.currentUser) {
      try { await Auth.signOut(); } catch {}
      DB.currentUser = null;
      render();
      toast('Sessão encerrada por inatividade. Entre novamente.');
    }
  }, IDLE_LOGOUT_MS);
}
function setupIdleLogout() {
  ['click','keydown','touchstart','scroll'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive: true }));
  resetIdleTimer();
}

(async () => {
  const appEl = document.getElementById('app');
  if (appEl) appEl.innerHTML = '<div style="padding:60px 20px;text-align:center;color:#1B2A5E;font-family:sans-serif;"><div style="font-size:32px;margin-bottom:16px;">⏳</div><div style="font-weight:700;">Carregando...</div></div>';

  // Chegou pelo link de "esqueci minha senha"? Então a tela é a de nova senha.
  if (await tratarLinkRecuperacao()) {
    modoRecuperacao = true;
    DB = { ...BMStore.seed(), currentUser: null };
    render();
    return;
  }

  // Verifica sessão do Supabase Auth ANTES de tentar carregar dados.
  // Sem sessão, a RLS bloqueia leitura de app_state — exibe tela de login.
  const session = await Auth.getSession();

  if (!session) {
    // Sem login: carrega só o estado mínimo do cache local (ou seed)
    // para que a tela de login renderize. A carga real vem após signIn.
    try {
      const raw = localStorage.getItem(BMStore.KEY);
      DB = raw ? { ...JSON.parse(raw), currentUser: null } : { ...BMStore.seed(), currentUser: null };
    } catch { DB = { ...BMStore.seed(), currentUser: null }; }
    render();
  } else {
    // Sessão salva (app reaberto). Admins ainda passam pelo 2FA 1x/dia.
    // Sem isto, o 2FA só rodaria no login por formulário e a reabertura o pularia.
    const mfaOk = await ensureMfaForAdmins(session.user);
    if (!mfaOk) {
      await Auth.signOut();
      try {
        const raw = localStorage.getItem(BMStore.KEY);
        DB = raw ? { ...JSON.parse(raw), currentUser: null } : { ...BMStore.seed(), currentUser: null };
      } catch { DB = { ...BMStore.seed(), currentUser: null }; }
      render();
    } else {
      try { DB = await BMStore.load(); }
      catch (e) { console.error('Erro ao carregar dados:', e); DB = { ...BMStore.seed(), currentUser: null }; }
      const id = await syncCurrentUserFromAuth(session.user);
      if (id == null) {
        /* Sem acesso ao módulo NÃO desloga: a sessão é da suíte inteira, e
           sair daqui derrubaria o portal e os outros módulos. Só mostra o
           aviso (render → renderSemAcesso). Conta inativa ou sem cadastro,
           sim, encerra. */
        if (!SEM_ACESSO) await Auth.signOut();
        DB.currentUser = null;
      } else {
        DB.currentUser = id;
      }
      render();
    }
  }

  // Realtime: qualquer mudança nas 7 tabelas (ou em profiles) dispara reload.
  // O callback é chamado uma única vez por janela de 250ms — agrupa rajadas.
  /* A recarga espera: modal aberto (os formulários guardam o objeto do DB —
     trocar o DB por baixo fazia a edição/movimentação/foto gravar num objeto
     solto), gravação em andamento, e a aba Cadastrar (render() apagaria o
     que está sendo digitado). Assim que liberar, recarrega uma vez. */
  let rtPendente = false;
  const rtPodeRecarregar = () =>
    !document.querySelector('.modal-backdrop') && !SALVANDO && State.tab !== 'create';
  async function recarregarRT() {
    if (!rtPodeRecarregar()) {
      if (!rtPendente) {
        rtPendente = true;
        const esperar = () => {
          if (!rtPodeRecarregar()) return setTimeout(esperar, 1000);
          rtPendente = false; recarregarRT();
        };
        setTimeout(esperar, 1000);
      }
      return;
    }
    try {
      const myUserId = DB && DB.currentUser;
      const fresh = await BMStore.load();
      DB = { ...fresh, currentUser: myUserId };
      render();
    } catch (e) { console.warn('[Realtime] reload falhou:', e && e.message); }
  }
  BMStore.subscribe(recarregarRT);

  // Reage a sign-out em outras abas ou expiração de token
  Auth.onChange(async (event, sess) => {
    if (event === 'SIGNED_OUT' || !sess) {
      DB.currentUser = null;
      render();
    } else if (event === 'SIGNED_IN' && sess && (!DB.currentUser)) {
      try { DB = await BMStore.load(); } catch {}
      const id = await syncCurrentUserFromAuth(sess.user);
      DB.currentUser = id;
      render();
    }
  });

  // Ativa o logout por inatividade após o boot.
  setupIdleLogout();
})();
</script>
