<style>
/* =====================================================================
   B&M PERFIL — Inteligência Comportamental e Profissional · módulo da suíte BeMer (03/11/2026)
   ---------------------------------------------------------------------
   Ferramenta própria do RH para processo seletivo presencial. Banco:
   schema `perfil` (migração 0087; perguntas na 0088). Metodologia PRÓPRIA,
   inspirada em conceitos de avaliação comportamental — não é o Predictive
   Index, não mede QI e não substitui avaliação técnica nem experiência.
   O candidato faz a prova no aparelho do RH, em "modo candidato" (tela
   cheia, sair só com o PIN). Gabarito e mapa item→dimensão não chegam à
   tela: o banco sorteia (perfil.iniciar), guarda e corrige (perfil.concluir).
   Padrão dos módulos: login do portal, portão do 2FA, "Portal" como única
   saída, ← do celular fecha camadas, aviso de versão.
   ===================================================================== */
:root{
  --azul:#00296B; --azul-escuro:#001B4D; --laranja:#FE9400; --laranja-claro:#FFF1DC; --laranja-txt:#8A5000;
  --texto:#0F1B2D; --texto2:#4F5B6D; --borda:#E3E7ED; --borda-forte:#C9D1DD;
  --fundo:#F5F7FA; --campo:#F7F9FC; --erro:#9B1C14; --erro-fundo:#FDECEB; --ok:#1B5E34; --ok-fundo:#E7F5EC;
  --shadow:0 1px 3px rgba(0,20,60,.07),0 1px 2px rgba(0,20,60,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fundo);color:var(--texto);-webkit-font-smoothing:antialiased;font-size:14px}
.oculto{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
a{color:var(--azul)}

/* ---- cabeçalho padrão dos módulos ---- */
header.topo{background:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;
  padding-top:calc(9px + env(safe-area-inset-top));border-bottom:3px solid var(--laranja);
  box-shadow:0 2px 8px rgba(0,20,60,.08);position:sticky;top:0;z-index:40}
.marca{display:flex;align-items:center;gap:7px;text-decoration:none;min-height:36px}
.marca img{height:28px;width:auto;display:block}
.fio{width:1px;height:26px;background:var(--borda)}
.modulo{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--azul);font-size:15px;min-width:0}
.tile{width:28px;height:28px;border-radius:8px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.direita{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn-topo{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borda-forte);color:var(--azul);
  border-radius:9px;height:36px;padding:0 12px;cursor:pointer;text-decoration:none;font-weight:600}
.btn-topo.so-icone{border:0;padding:0;width:36px;justify-content:center}
.bm-portal{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:0 0 auto;box-sizing:border-box;
  margin:0;padding:4px 10px;border:1px solid #00296B;border-radius:6px;background:#fff;color:#00296B;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1.5;
  white-space:nowrap;text-decoration:none;cursor:pointer;transition:background .15s}
.bm-portal:hover{background:#f0f4fb;color:#00296B}
.bm-portal:focus-visible{outline:3px solid #FE9400;outline-offset:2px}
@media (max-width:768px){.bm-portal{min-height:40px;padding:8px 10px;font-size:13px}}
@media (max-width:520px){ .fio{display:none} header.topo{padding-left:12px;padding-right:12px} }
@media (max-width:360px){ .marca img{height:24px} .modulo .nome-mod{display:none} }

/* ---- abas ---- */
nav.abas{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:30}
nav.abas .trilho{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.abas .trilho::-webkit-scrollbar{display:none}
nav.abas button{border-bottom:3px solid transparent;padding:13px 12px 10px;color:var(--texto2);font-weight:600;white-space:nowrap;min-height:46px}
nav.abas button.ativa{color:var(--azul);border-bottom-color:var(--laranja)}

main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
.carregando{padding:60px 16px;text-align:center;color:var(--texto2)}
.rodape{text-align:center;color:var(--texto2);font-size:11px;padding:10px 0 24px}

/* ---- comuns ---- */
.cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.cab h1{font-size:19px;color:var(--azul);font-weight:700}
.card{background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.card h2{font-size:15px;color:var(--azul);margin-bottom:8px}
.btn{padding:9px 16px;border-radius:9px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;min-height:42px;border:1px solid transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--azul);color:#fff} .btn-primary:hover{background:var(--azul-escuro)}
.btn-laranja{background:var(--laranja);color:var(--azul)} .btn-laranja:hover{filter:brightness(.96)}
.btn-secondary{background:#fff;color:var(--azul);border-color:var(--azul)} .btn-secondary:hover{background:#EEF2F9}
.btn-danger{background:var(--erro-fundo);color:var(--erro)}
.btn-sm{padding:5px 11px;min-height:34px;font-size:13px}
.vazio{text-align:center;padding:40px 12px;color:var(--texto2)}
.dica{color:var(--texto2);font-size:12px;line-height:1.45}
.campo{margin-bottom:12px}
label.rot{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin-bottom:5px}
input,select,textarea{padding:9px 12px;border:1px solid var(--borda-forte);border-radius:9px;width:100%;background:#fff;min-height:42px}
textarea{min-height:110px;resize:vertical;line-height:1.45}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--azul);transform:scale(1.25)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,41,107,.12)}
.lado{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}
.marcar{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.filtros::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--borda-forte);background:#fff;color:var(--texto2);border-radius:20px;padding:6px 13px;font-weight:600;white-space:nowrap;min-height:36px}
.chip.ativo{background:var(--azul);border-color:var(--azul);color:#fff}
.chip .n{opacity:.75;font-weight:500;margin-left:3px}
.busca{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr;gap:8px;margin-bottom:12px}
.selo{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;border-radius:10px;padding:2px 8px;background:#EEF2F9;color:var(--azul);white-space:nowrap}
.selo.st-aguardando{background:var(--laranja-claro);color:var(--laranja-txt)}
.selo.st-em_andamento{background:#E3ECFA;color:var(--azul)}
.selo.st-concluida{background:var(--ok-fundo);color:var(--ok)}
.selo.st-cancelada{background:#EEF0F3;color:#5B6576}
.selo.cinza{background:#F1F3F6;color:var(--texto2);font-weight:500}
.lista{display:flex;flex-direction:column;gap:9px}
.av{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--borda);border-left:4px solid var(--borda-forte);
  border-radius:12px;padding:11px 12px;box-shadow:var(--shadow)}
.av.st-aguardando{border-left-color:var(--laranja)} .av.st-em_andamento{border-left-color:var(--azul)}
.av.st-concluida{border-left-color:#2E7D32} .av.st-cancelada{border-left-color:#9AA3AF}
.av .nm{font-weight:600}
.av .sub{color:var(--texto2);font-size:12px}
.av .meio{flex:1;min-width:0}
.blocos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.bloco{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:12px;box-shadow:var(--shadow)}
.bloco .v{font-size:24px;font-weight:700;color:var(--azul)}
.bloco .r{font-size:12px;color:var(--texto2)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:8px;font-size:11px;color:var(--texto2);text-transform:uppercase;letter-spacing:.3px;border-bottom:1px solid var(--borda);background:#F7F9FC}
td{padding:8px;border-bottom:1px solid var(--borda);font-size:13px;vertical-align:top}
td.n,th.n{text-align:right}
td.c,th.c{text-align:center}
.rolar{overflow-x:auto}
.det-linha{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid var(--borda);font-size:13px}
.det-linha:last-child{border-bottom:0}
.det-linha b{min-width:110px;color:var(--texto2);font-weight:600}
.acoes{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:35;box-shadow:0 6px 18px rgba(0,20,60,.25);min-height:52px;padding:0 20px;border-radius:26px;font-size:15px}
.q-item{border-bottom:1px solid var(--borda);padding:10px 0}
.q-item:last-child{border-bottom:0}
.q-item.inativa{opacity:.55}
.q-op{font-size:13px;padding:2px 0 2px 18px;position:relative}
.q-op.certa{color:var(--ok);font-weight:600}
.q-op.certa::before{content:'✓';position:absolute;left:2px}
.pre{white-space:pre-wrap;line-height:1.5}
.num-cat{width:76px;text-align:center}

/* ---- modal ---- */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,20,50,.5);z-index:100;align-items:center;justify-content:center;padding:20px}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:14px;width:100%;max-width:680px;max-height:92vh;max-height:92dvh;overflow:auto}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--borda);display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.modal-title{font-size:17px;font-weight:600;color:var(--azul)}
.modal-close{color:var(--texto2);font-size:26px;line-height:1;width:42px;height:42px;border-radius:8px}
.modal-body{padding:16px 18px}
.modal-footer{padding:12px 18px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--borda);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:#fff;z-index:2}
.modal-footer:empty{display:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));z-index:300;
  background:var(--azul);color:#fff;border-radius:10px;padding:10px 16px;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:var(--erro)}
.faixa-atualizar{position:fixed;left:0;right:0;top:0;z-index:55;background:var(--laranja);color:var(--azul);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:700}
.faixa-atualizar button{background:var(--azul);color:#fff;border-radius:9px;padding:8px 14px;min-height:40px;font-weight:600}
.cartao-aviso{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:24px;max-width:560px;margin:30px auto;box-shadow:var(--shadow)}
.cartao-aviso h1{font-size:20px;color:var(--azul);margin-bottom:6px}
.cartao-aviso p{color:var(--texto2);line-height:1.5}
.pin{font-size:42px;font-weight:700;letter-spacing:10px;color:var(--azul);text-align:center;margin:10px 0}

/* =====================================================================
   MODO CANDIDATO — tela cheia, letra grande, um item por vez
   ===================================================================== */
#cand{position:fixed;inset:0;z-index:90;background:var(--fundo);overflow:auto;display:flex;flex-direction:column}
.c-topo{background:var(--azul);color:#fff;padding:12px 18px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:12px}
.c-topo .t{font-weight:700;font-size:16px;letter-spacing:.3px}
.c-topo .t small{display:block;font-weight:500;font-size:11px;opacity:.8;letter-spacing:0}
.c-topo .rel{margin-left:auto;font-weight:700;font-size:18px;background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-variant-numeric:tabular-nums}
.c-topo .rel.pouco{background:var(--laranja);color:var(--azul)}
.c-sair{color:#fff;opacity:.55;width:40px;height:40px;border-radius:8px;font-size:20px}
.c-barra{height:6px;background:rgba(0,41,107,.12)}
.c-barra i{display:block;height:100%;background:var(--laranja);transition:width .3s}
.c-corpo{flex:1;width:100%;max-width:760px;margin:0 auto;padding:22px 18px 30px}
.c-etapa{font-size:12px;font-weight:700;color:var(--laranja-txt);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.c-h{font-size:22px;font-weight:700;color:var(--azul);line-height:1.3;margin-bottom:10px}
.c-p{font-size:16px;line-height:1.55;color:var(--texto);margin-bottom:12px}
.c-inst{background:#fff;border:1px solid var(--borda);border-left:4px solid var(--laranja);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.5;margin-bottom:16px}
.c-rodape{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.c-rodape .btn{min-height:54px;font-size:17px;padding:0 24px;border-radius:12px}
.c-rodape .btn-primary{flex:1;max-width:340px;margin-left:auto}
/* bloco: 👍 / 👎 */
.blc{display:flex;flex-direction:column;gap:10px}
.blc-l{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:10px 10px 10px 14px}
.blc-l .tx{flex:1;font-size:17px;line-height:1.4}
.blc-l.mais{border-color:#2E7D32;background:#F1FAF4}
.blc-l.menos{border-color:#C62828;background:#FDF2F2}
.blc-b{width:58px;height:54px;border-radius:10px;border:2px solid var(--borda-forte);background:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.blc-b.on.m{background:#2E7D32;border-color:#2E7D32;color:#fff}
.blc-b.on.n{background:#C62828;border-color:#C62828;color:#fff}
.blc-leg{display:flex;justify-content:flex-end;gap:10px;font-size:12px;font-weight:700;color:var(--texto2);padding-right:10px}
.blc-leg span{width:58px;text-align:center}
/* par: escala de 5 */
.par{background:#fff;border:1px solid var(--borda);border-radius:14px;padding:18px}
.par-txt{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:17px;line-height:1.4;font-weight:600;color:var(--azul);margin-bottom:16px}
.par-txt div:last-child{text-align:right}
.par-esc{display:flex;justify-content:space-between;gap:8px}
.par-esc button{flex:1;min-height:58px;border-radius:12px;border:2px solid var(--borda-forte);background:#fff;font-weight:700;font-size:13px;color:var(--texto2);line-height:1.2;padding:4px}
.par-esc button.on{background:var(--azul);border-color:var(--azul);color:#fff}
/* opções (cenário e cognitivo) */
.ops{display:flex;flex-direction:column;gap:10px}
.op{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:#fff;border:2px solid var(--borda);border-radius:12px;padding:13px 14px;font-size:17px;line-height:1.4;min-height:56px}
.op .l{width:30px;height:30px;border-radius:50%;background:#EEF2F9;color:var(--azul);font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:15px}
.op.on{border-color:var(--azul);background:#EEF2F9}
.op.on .l{background:var(--azul);color:#fff}
.c-enun{font-size:18px;line-height:1.55;white-space:pre-wrap;margin-bottom:14px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:14px 16px}
.c-tab{margin:-4px 0 14px;background:#fff;border-radius:10px;overflow:hidden;border:1px solid var(--borda)}
.c-tab td,.c-tab th{font-size:15px;text-align:center}
.c-fim{text-align:center;padding-top:40px}
.c-fim .ic{font-size:64px}
.c-ex{background:#fff;border:1px dashed var(--borda-forte);border-radius:12px;padding:12px 14px;margin:8px 0 14px;font-size:15px;line-height:1.5}

/* =====================================================================
   RELATÓRIO (tela e PDF)
   ===================================================================== */
.rel-doc{background:#fff;border:1px solid var(--borda);border-radius:12px;box-shadow:var(--shadow);padding:26px 28px;max-width:900px;margin:0 auto}
.rel-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;border-bottom:3px solid var(--laranja);padding-bottom:12px;margin-bottom:16px}
.rel-cab .m1{font-size:22px;font-weight:700;color:var(--azul);letter-spacing:.5px}
.rel-cab .m2{font-size:12px;color:var(--texto2)}
.rel-id{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 18px;font-size:13px;margin-bottom:16px}
.rel-id b{display:block;font-size:11px;color:var(--texto2);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.rel-sec{margin:18px 0 8px;font-size:15px;font-weight:700;color:var(--azul);border-bottom:1px solid var(--borda);padding-bottom:4px;break-after:avoid}
.rel-p{line-height:1.6;font-size:13.5px;margin-bottom:8px}
.dimg{display:grid;grid-template-columns:150px 1fr 70px;gap:4px 12px;align-items:center;margin:4px 0}
.dimg .nm{font-weight:600;font-size:13px}
.trilha{position:relative;height:30px;background:linear-gradient(90deg,#F4F6FA 0 35%,#ECEFF5 35% 65%,#F4F6FA 65% 100%);border-radius:6px}
.trilha::after{content:'';position:absolute;left:50%;top:0;bottom:0;width:1px;background:#B9C2D0}
.trilha .b{position:absolute;left:0;height:11px;border-radius:0 5px 5px 0}
.trilha .b.eu{top:4px;background:var(--azul)}
.trilha .b.amb{top:16px;background:var(--laranja)}
.dimg .vv{font-size:12px;color:var(--texto2);text-align:right;line-height:1.25}
.leg{display:flex;gap:16px;font-size:12px;color:var(--texto2);margin:6px 0 2px;flex-wrap:wrap}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.tend{border:1px solid var(--borda);border-radius:10px;padding:10px 12px;margin-bottom:8px;break-inside:avoid}
.tend .h{display:flex;justify-content:space-between;gap:8px;font-weight:700;color:var(--azul);margin-bottom:4px}
.nivel{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px}
.nivel.alta{background:#E3ECFA;color:var(--azul)} .nivel.moderada{background:#F1F3F6;color:var(--texto2)} .nivel.baixa{background:var(--laranja-claro);color:var(--laranja-txt)}
.colunas{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.colunas ul{padding-left:18px;font-size:13px;line-height:1.55}
.colunas h4{font-size:13px;color:var(--azul);margin-bottom:4px}
.aviso-met{font-size:11.5px;color:var(--texto2);line-height:1.5;background:#F7F9FC;border-radius:8px;padding:10px 12px;margin-top:16px}
.barra-pct{height:8px;background:#EEF0F3;border-radius:4px;overflow:hidden;min-width:60px}
.barra-pct i{display:block;height:100%;background:var(--azul)}
.cmp-cel{min-width:110px}

@media (max-width:768px){
  main{padding:12px 12px 96px}
  input,select,textarea{font-size:16px}
  .lado,.tres{grid-template-columns:1fr}
  .busca{grid-template-columns:1fr 1fr}
  .blocos{grid-template-columns:1fr 1fr}
  .modal-bg{padding:0;align-items:flex-end}
  .modal{max-width:100%;border-radius:16px 16px 0 0;max-height:94svh}
  .modal-body{padding:14px}
  .modal-footer .btn{flex:1}
  .rel-doc{padding:16px 14px}
  .rel-id{grid-template-columns:1fr 1fr}
  .dimg{grid-template-columns:96px 1fr 56px}
  .colunas{grid-template-columns:1fr}
  .par-txt{font-size:15px}
  .par-esc button{font-size:11px;min-height:54px}
}
@media (min-width:769px){ .fab{display:none!important} }
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;font-size:12px}
  header.topo,nav.abas,.rodape,.fab,.nao-imprimir,.toast,.faixa-atualizar{display:none!important}
  main{padding:0;max-width:none}
  .rel-doc{border:0;box-shadow:none;padding:0;max-width:none}
  .trilha .b,.nivel,.barra-pct i,.leg i{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .trilha{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>

var Volta = {
  pilha: [], sobra: 0, ignorar: 0,
  abrir: function(k, fechar){
    var c = { k:k, fechar:fechar };
    Volta.pilha.push(c);
    try {
      var st = { bm:Volta.pilha.length };
      if(Volta.sobra > 0){ Volta.sobra--; history.replaceState(st, '', location.href); }
      else history.pushState(st, '', location.href);
    } catch(e){ Volta.pilha.pop(); }
    return c;
  },
  fechou: function(c){
    var i = c ? Volta.pilha.indexOf(c) : -1;
    if(i < 0) return;
    Volta.pilha.splice(i, 1); Volta.sobra++;
    setTimeout(Volta.desfazer, 0);
  },
  desfazer: function(){
    var n = Volta.sobra; if(!n) return;
    Volta.sobra = 0; Volta.ignorar++;
    try { history.go(-n); } catch(e){ Volta.ignorar--; }
  }
};
var Guarda = {
  posta: false,
  armar: function(){
    if(Guarda.posta || Volta.pilha.length || Volta.sobra || Volta.ignorar) return;
    try {
      history.replaceState({ bm:0, raiz:1 }, '', location.href);
      history.pushState({ bm:0 }, '', location.href);
      Guarda.posta = true;
    } catch(e){}
  }
};

function resumoPerfil(dim){
  if(!dim) return '';
  var alt = DIMS.filter(function(d){ return dim[d] != null && dim[d] >= 65; }).sort(function(a, b){ return dim[b] - dim[a]; });
  var bai = DIMS.filter(function(d){ return dim[d] != null && dim[d] <= 35; }).sort(function(a, b){ return dim[a] - dim[b]; });
  var t = '';
  if(!alt.length && !bai.length) t = 'Perfil equilibrado: nenhuma das cinco dimensões se destaca com força. A pessoa tende a se adaptar a diferentes situações, sem um estilo muito marcado.';
  else {
    if(alt.length) t += 'Predominam ' + lista(alt.map(function(d){ return NOME_DIM[d].toLowerCase(); })) + '. ';
    if(bai.length) t += 'Com menor intensidade: ' + lista(bai.map(function(d){ return NOME_DIM[d].toLowerCase(); })) + '. ';
    var frases = [];
    alt.slice(0, 2).forEach(function(d){ frases.push(FORTE[d].alta.toLowerCase()); });
    bai.slice(0, 1).forEach(function(d){ frases.push(FORTE[d].baixa.toLowerCase()); });
    if(frases.length) t += 'No trabalho, o que tende a aparecer mais: ' + lista(frases) + '.';
  }
  return t;
}
function lista(a){ return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; }

/* =====================================================================
   MODO CANDIDATO
   ===================================================================== */
var C = null;   // {av, cad, resp, passos, i, pin, camada, tSalvo, cogFim, timer, tPasso}
var INST = {
  eu:'Pense em como você é de verdade, no seu jeito natural. Não existe resposta certa ou errada.',
  amb:'Agora pense no que o seu trabalho ou a função que você procura ESPERA de você — não em como você é. Não existe resposta certa ou errada.'
};

async function aplicar(id){
  var a = avDe(id); if(!a) return;
  var r = await P().rpc('iniciar', { p_id:id });
  if(r.error){ toast(msgErro(r.error), 'err'); return; }
  var pin = String(Math.floor(1000 + Math.random() * 9000));
  abrirModal('Entregar ao candidato', '<p style="line-height:1.5">A tela vai ficar só com a avaliação de <b>' + esc(nomeCand(a)) + '</b>. Para sair antes do fim (ou ao final, para ver o resultado), toque no ⋯ do canto e digite o PIN:</p>'
    + '<div class="pin">' + pin + '</div><p class="dica">Anote o PIN. O que o candidato responder fica salvo a cada passo; dá para retomar depois.</p>', [
    { rotulo:'Cancelar' },
    { rotulo:'Entregar ao candidato', cls:'btn-laranja', fn:function(){ fecharModal(); entrarCandidato(a, r.data, pin); return 'manter'; } }
  ]);
}
function montarPassos(cad){
  var p = [{ k:'boas' }];
  if((cad.eu || []).length){
    p.push({ k:'intro', e:'eu' }); (cad.eu || []).forEach(function(it){ p.push({ k:'item', e:'eu', it:it }); });
    p.push({ k:'intro', e:'amb' }); (cad.amb || []).forEach(function(it){ p.push({ k:'item', e:'amb', it:it }); });
  }
  if((cad.cog || []).length){ p.push({ k:'intro', e:'cog' }); (cad.cog || []).forEach(function(q){ p.push({ k:'item', e:'cog', it:q }); }); }
  p.push({ k:'fim' });
  return p;
}
function respondido(pa, resp){
  if(pa.k !== 'item') return false;
  var r = (resp[pa.e] || {})[pa.it.c]; if(!r) return false;
  if(pa.e === 'cog') return 'r' in r;
  if(pa.it.t === 'bloco') return r.mais != null && r.menos != null;
  if(pa.it.t === 'par') return r.v != null;
  return r.o != null;
}
function entrarCandidato(a, dados, pin){
  var resp = dados.respostas || {};
  resp.eu = resp.eu || {}; resp.amb = resp.amb || {}; resp.cog = resp.cog || {}; resp.tempos = resp.tempos || {};
  var passos = montarPassos(dados.caderno || {});
  /* retomada: vai para o primeiro item ainda sem resposta */
  var i = 0, algum = false;
  for(var k = 0; k < passos.length; k++){ if(respondido(passos[k], resp)) algum = true; }
  if(algum){
    for(i = 0; i < passos.length; i++){ if(passos[i].k === 'item' && !respondido(passos[i], resp)) break; }
    if(i >= passos.length) i = passos.length - 1;
    /* parte ainda não começada: mostra a explicação dela antes (e o relógio só corre depois) */
    else if(passos[i - 1] && passos[i - 1].k === 'intro' && passos[i - 1].e === passos[i].e && !(passos[i].e === 'cog' && resp.cogInicio)) i--;
  }
  C = { av:a, cad:dados.caderno, resp:resp, passos:passos, i:i, pin:pin, limCog:(dados.tempo_cog_min || 20) * 60,
        tSalvo:0, sujo:false, timer:null, tPasso:Date.now() };
  if(resp.cogInicio && (cogRestante() <= 0)){ C.i = passos.length - 1; }
  $('cand').classList.remove('oculto'); document.body.style.overflow = 'hidden';
  C.camada = Volta.abrir('cand', segurarVolta);
  try { if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(function(){}); } catch(e){}
  window.addEventListener('beforeunload', avisoSaida);
  passo();
}
function segurarVolta(){ if(!C) return; setTimeout(function(){ if(C) C.camada = Volta.abrir('cand', segurarVolta); }, 0); }
function avisoSaida(e){ if(C && C.passos[C.i].k !== 'fim'){ e.preventDefault(); e.returnValue = ''; } }
function sairCandidato(){
  if(!C) return;
  clearInterval(C.timer);
  var cam = C.camada; C = null;
  $('cand').classList.add('oculto'); $('cand').innerHTML = ''; document.body.style.overflow = '';
  window.removeEventListener('beforeunload', avisoSaida);
  try { if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function(){}); } catch(e){}
  if(cam) Volta.fechou(cam);
}
function pedirPin(depois){
  var v = prompt('Área do recrutador — digite o PIN:');
  if(v === null) return;
  if(String(v).trim() !== C.pin){ alert('PIN incorreto.'); return; }
  depois();
}
async function salvarParcial(forcar){
  if(!C || (!C.sujo && !forcar)) return;
  if(!forcar && Date.now() - C.tSalvo < 8000) return;
  C.sujo = false; C.tSalvo = Date.now();
  var r = await P().rpc('salvar', { p_id:C.av.id, p_respostas:C.resp }).then(function(x){ return x; }, function(e){ return { error:e }; });
  if(r.error){ C.sujo = true; console.warn('[salvar]', r.error); }
}
function contarTempo(){
  if(!C) return;
  var pa = C.passos[C.i], agora = Date.now(), dt = (agora - C.tPasso) / 1000; C.tPasso = agora;
  if(pa.k === 'item'){
    C.resp.tempos[pa.e] = Math.round(((C.resp.tempos[pa.e] || 0) + dt) * 10) / 10;
    if(pa.e === 'cog'){ var r = C.resp.cog[pa.it.c] = C.resp.cog[pa.it.c] || {}; r.t = Math.round(((r.t || 0) + dt) * 10) / 10; }
  }
}
function cogRestante(){ return C.resp.cogInicio ? C.limCog - (Date.now() - C.resp.cogInicio) / 1000 : C.limCog; }
function totalItens(){ return C.passos.filter(function(p){ return p.k === 'item'; }).length; }
function feitos(){ var n = 0; C.passos.forEach(function(p){ if(respondido(p, C.resp)) n++; }); return n; }

function ir(delta){ contarTempo(); C.i = Math.max(0, Math.min(C.passos.length - 1, C.i + delta)); C.sujo = true; salvarParcial(C.passos[C.i].k === 'intro'); passo(); }

function passo(){
  if(!C) return;
  var pa = C.passos[C.i], h = '';
  var etapaNome = { eu:'Parte 1 · Como eu sou', amb:'Parte 2 · O que o trabalho espera de mim', cog:'Parte 3 · Raciocínio' };

  if(pa.k === 'boas'){

    if(temCog){ partes.push('<b>' + (temComp ? 'Parte 3' : 'Parte 1') + '</b> — exercícios de raciocínio, com tempo marcado na tela (' + Math.round(C.limCog / 60) + ' minutos).'); }
    h = '<div class="c-h">Olá, ' + esc(nomeCand(C.av).split(' ')[0]) + '!</div>'
      + '<p class="c-p">Esta avaliação ajuda a Brandão &amp; Marmo a conhecer o seu jeito de trabalhar. Ela tem:</p>'

  } else if(pa.k === 'intro'){
    if(pa.e === 'eu') h = '<div class="c-etapa">' + etapaNome.eu + '</div><div class="c-h">Como eu sou</div>'
      + '<div class="c-inst">' + INST.eu + '</div>'
      + '<p class="c-p">Você vai ver três tipos de pergunta:</p>'

    else h = '<div class="c-etapa">' + (temComp ? etapaNome.cog : 'Parte 1 · Raciocínio') + '</div><div class="c-h">Raciocínio</div>'
      + '<div class="c-inst">São ' + C.cad.cog.length + ' questões de múltipla escolha, das mais fáceis para as mais difíceis. Você tem <b>' + Math.round(C.limCog / 60) + ' minutos</b>: o relógio aparece no alto da tela e começa quando você tocar em "Começar".</div>'
      + '<p class="c-p">Escolha uma resposta e toque em "Próxima". Se não souber, pode pular e voltar depois, enquanto houver tempo. Rascunho no papel é permitido se o recrutador entregar.</p>'

  } else if(pa.k === 'item'){

function ligarItem(pa){

  if(pa.k !== 'item') return;
  var bag = C.resp[pa.e], c = pa.it.c;

  raiz.querySelectorAll('[data-mais]').forEach(function(b){ b.addEventListener('click', function(){ var v = +b.getAttribute('data-mais'); marcar(function(r){ r.mais = v; if(r.menos === v) delete r.menos; }); }); });

function ligarRelogio(){

    if(!C) return;
    var s = Math.max(0, Math.ceil(cogRestante())), el = $('c-rel'); if(!el) return;

}

    + (D.vagas.length ? '<div class="lista">' + D.vagas.map(function(v){
        var cog = (v.config || {}).cognitivo || {}, tot = Object.keys(cog).reduce(function(s, k){ return s + (+cog[k] || 0); }, 0);
        return '<button type="button" class="av' + (v.ativa ? '' : ' st-cancelada') + '" onclick="editarVaga(\'' + v.id + '\')"><div class="meio"><div class="nm">' + esc(v.nome) + '</div>'
          + '<div class="sub">' + esc(AREAS[v.area]) + ' · ' + ((v.config || {}).comportamental !== false ? 'comportamental + ' : '') + tot + ' questões · ' + ((v.config || {}).tempo_cog_min || 0) + ' min</div></div>'
          + (v.ativa ? '' : '<span class="selo st-cancelada">Inativa</span>') + '</button>';
      }).join('') + '</div>' : '<div class="vazio">Nenhuma vaga.</div>');
}
function editarVaga(id){
  var v = id ? vagaDe(id) : { nome:'', area:'operacional', descricao:'', config:{ comportamental:true, cognitivo:{}, tempo_cog_min:20 }, ativa:true };
  var cfg = v.config || {}, cog = cfg.cognitivo || {};
  function grade(g){ return CATS.filter(function(k){ return k.g === g; }).map(function(k){
    return '<tr><td>' + esc(k.n) + '</td><td class="c"><input type="number" class="num-cat" min="0" max="30" data-cat="' + k.c + '" value="' + (+cog[k.c] || 0) + '"></td><td class="c dica">' + disponiveis(k.c) + '</td></tr>'; }).join(''); }
  var html = '<div class="lado"><div class="campo"><label class="rot" for="v-nome">Nome da vaga *</label><input id="v-nome" maxlength="120" value="' + esc(v.nome) + '"></div>'
    + '<div class="campo"><label class="rot" for="v-area">Área</label><select id="v-area">' + Object.keys(AREAS).map(function(k){ return '<option value="' + k + '"' + (v.area === k ? ' selected' : '') + '>' + AREAS[k] + '</option>'; }).join('') + '</select></div></div>'
    + '<div class="campo"><label class="rot" for="v-desc">Descrição (opcional)</label><input id="v-desc" maxlength="1000" value="' + esc(v.descricao || '') + '"></div>'
    + '<label class="marcar"><input type="checkbox" id="v-comp"' + (cfg.comportamental !== false ? ' checked' : '') + '> Aplicar o perfil comportamental (partes 1 e 2, ~15 min)</label>'
    + '<h2 style="font-size:14px;color:var(--azul);margin:12px 0 4px">Questões por categoria</h2>'
    + '<div class="rolar"><table><tr><th>Raciocínio</th><th class="c">Quantas</th><th class="c">No banco</th></tr>' + grade('r')
    + '<tr><th>Situações de trabalho</th><th></th><th></th></tr>' + grade('s') + '</table></div>'
    + '<div class="lado" style="margin-top:12px"><div class="campo"><label class="rot" for="v-tempo">Tempo da parte de raciocínio (minutos)</label><input type="number" id="v-tempo" min="5" max="90" value="' + (cfg.tempo_cog_min || 20) + '"></div>'
    + '<div class="campo"><label class="rot">&nbsp;</label><label class="marcar"><input type="checkbox" id="v-ativa"' + (v.ativa ? ' checked' : '') + '> Vaga ativa</label></div></div>'
    + '<p class="dica">As questões são sorteadas do banco, misturando os níveis fácil, médio e difícil, e aparecem da mais fácil para a mais difícil.</p>';
  abrirModal(id ? 'Editar vaga' : 'Nova vaga', html, [{ rotulo:'Cancelar' }, { rotulo:'Salvar', cls:'btn-primary', salvando:'Salvando…', fn:async function(){
    var nome = $('v-nome').value.trim(); if(nome.length < 2){ toast('Dê um nome à vaga.', 'err'); return false; }
    var c2 = {}; document.querySelectorAll('[data-cat]').forEach(function(i){ var n = Math.max(0, Math.min(30, parseInt(i.value, 10) || 0)); if(n) c2[i.getAttribute('data-cat')] = n; });
    var falta = Object.keys(c2).filter(function(k){ return c2[k] > disponiveis(k); });
    if(falta.length){ toast('Mais questões do que o banco tem em: ' + falta.map(nomeCat).join(', ') + '.', 'err'); return false; }
    var comp = $('v-comp').checked;
    if(!comp && !Object.keys(c2).length){ toast('A vaga precisa aplicar alguma coisa.', 'err'); return false; }
    var linha = { nome:nome, area:$('v-area').value, descricao:$('v-desc').value.trim() || null, ativa:$('v-ativa').checked,
      config:{ comportamental:comp, cognitivo:c2, tempo_cog_min:Math.max(5, Math.min(90, parseInt($('v-tempo').value, 10) || 20)) } };
    var r = id ? await P().from('vagas').update(linha).eq('id', id) : await P().from('vagas').insert(linha);
    if(r.error) throw r.error;
    toast('Vaga salva.'); await carregar(); desenhar();
  } }]);
}

/* ---------- PERGUNTAS ---------- */
async function telaPerguntas(){
  if(!D.questoes){ $('main').innerHTML = '<div class="carregando">Carregando…</div>'; try { await carregarBanco(); } catch(e){ $('main').innerHTML = '<div class="vazio">' + esc(msgErro(e)) + '</div>'; return; } }
  $('main').innerHTML = '<div class="cab"><h1>Banco de perguntas</h1><button type="button" class="btn btn-primary" onclick="editarQuestao()">+ Nova pergunta</button></div>'
    + '<div class="busca"><input type="search" id="q-busca" placeholder="Buscar no texto ou código" value="' + esc(FQ.busca) + '">'
    + '<select id="q-cat"><option value="">Todas as categorias</option><option value="comp"' + (FQ.cat === 'comp' ? ' selected' : '') + '>Comportamental (itens)</option>' + CATS.map(function(k){ return '<option value="' + k.c + '"' + (FQ.cat === k.c ? ' selected' : '') + '>' + esc(k.n) + '</option>'; }).join('') + '</select>'
    + '<select id="q-niv"><option value="">Todos os níveis</option><option value="1"' + (FQ.nivel === '1' ? ' selected' : '') + '>Fácil</option><option value="2"' + (FQ.nivel === '2' ? ' selected' : '') + '>Médio</option><option value="3"' + (FQ.nivel === '3' ? ' selected' : '') + '>Difícil</option></select>'
    + '<select id="q-at"><option value="todas">Ativas e inativas</option><option value="ativas"' + (FQ.ativas === 'ativas' ? ' selected' : '') + '>Só ativas</option><option value="inativas"' + (FQ.ativas === 'inativas' ? ' selected' : '') + '>Só inativas</option></select></div>'
    + '<p class="dica" style="margin-bottom:8px">Pergunta já usada não se apaga: desative. A avaliação guarda o gabarito do dia em que foi aplicada.</p>'
    + '<div class="card" id="q-lista"></div>';
  desenharQuestoes();
  $('q-busca').addEventListener('input', function(){ FQ.busca = this.value; desenharQuestoes(); });
  $('q-cat').addEventListener('change', function(){ FQ.cat = this.value; desenharQuestoes(); });
  $('q-niv').addEventListener('change', function(){ FQ.nivel = this.value; desenharQuestoes(); });
  $('q-at').addEventListener('change', function(){ FQ.ativas = this.value; desenharQuestoes(); });
}
function desenharQuestoes(){
  var b = sem(FQ.busca), alvo = $('q-lista');
  if(FQ.cat === 'comp'){
    var its = (D.itens || []).filter(function(i){ return (FQ.ativas === 'todas' || (FQ.ativas === 'ativas') === i.ativo) && (!b || sem(i.codigo + ' ' + JSON.stringify(i.conteudo)).indexOf(b) >= 0); });
    alvo.innerHTML = its.length ? its.map(function(i){
      var k = i.conteudo || {}, corpo = '';
      if(i.tipo === 'bloco') corpo = (k.frases || []).map(function(f){ return '<div class="q-op">' + esc(f.t) + ' <span class="selo cinza">' + NOME_DIM[f.d] + '</span></div>'; }).join('');
      else if(i.tipo === 'par') corpo = '<div class="q-op">A: ' + esc(k.a) + '</div><div class="q-op">B: ' + esc(k.b) + '</div><div class="dica">' + NOME_DIM[k.d] + ' alta = polo ' + String(k.alto).toUpperCase() + '</div>';
      else corpo = '<div class="pre">' + esc(k.enunciado) + '</div>' + (k.opcoes || []).map(function(o){ return '<div class="q-op">' + esc(o.t) + ' <span class="selo cinza">' + NOME_DIM[o.d] + '</span></div>'; }).join('');
      return '<div class="q-item' + (i.ativo ? '' : ' inativa') + '"><div style="display:flex;justify-content:space-between;gap:8px"><b>' + esc(i.codigo) + ' · ' + { bloco:'Grupo de 4 frases', par:'Frases opostas', cenario:'Situação' }[i.tipo] + '</b>'
        + '<button type="button" class="btn btn-sm btn-secondary" data-item-at="' + i.id + '">' + (i.ativo ? 'Desativar' : 'Ativar') + '</button></div>' + corpo + '</div>';
    }).join('') : '<div class="vazio">Nada encontrado.</div>';
    alvo.querySelectorAll('[data-item-at]').forEach(function(bt){ bt.addEventListener('click', async function(){
      var it = D.itens.find(function(x){ return x.id === bt.getAttribute('data-item-at'); });
      var r = await P().from('itens_comp').update({ ativo:!it.ativo }).eq('id', it.id); if(r.error) return toast(msgErro(r.error), 'err');
      it.ativo = !it.ativo; desenharQuestoes();
    }); });
    return;
  }
  var qs = (D.questoes || []).filter(function(q){
    if(FQ.cat && q.categoria !== FQ.cat) return false;
    if(FQ.nivel && String(q.nivel) !== FQ.nivel) return false;
    if(FQ.ativas !== 'todas' && (FQ.ativas === 'ativas') !== q.ativa) return false;
    if(b && sem(q.codigo + ' ' + q.enunciado).indexOf(b) < 0) return false;
    return true;
  });
  alvo.innerHTML = '<div class="dica" style="margin-bottom:6px">' + qs.length + ' pergunta(s)</div>' + (qs.length ? qs.map(function(q){
    return '<div class="q-item' + (q.ativa ? '' : ' inativa') + '"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>' + esc(q.codigo) + '</b> <span class="selo">' + esc(nomeCat(q.categoria)) + '</span> <span class="selo cinza">' + ['', 'fácil', 'médio', 'difícil'][q.nivel] + '</span>' + (q.origem === 'rh' ? ' <span class="selo cinza">criada pelo RH</span>' : '') + '</div>'
      + '<button type="button" class="btn btn-sm btn-secondary" onclick="editarQuestao(\'' + q.id + '\')">Editar</button></div>'
      + '<div class="pre" style="margin:6px 0">' + esc(q.enunciado) + '</div>'
      + (q.opcoes || []).map(function(o, k){ return '<div class="q-op' + (k === q.correta ? ' certa' : '') + '">' + letra(k) + ') ' + esc(o) + (q.pontos ? ' <span class="dica">(' + q.pontos[k] + ' pt)</span>' : '') + '</div>'; }).join('')
      + (q.explicacao ? '<div class="dica" style="margin-top:4px">💡 ' + esc(q.explicacao) + '</div>' : '') + '</div>';
  }).join('') : '<div class="vazio">Nada encontrado.</div>');
}
function editarQuestao(id){
  var q = id ? D.questoes.find(function(x){ return x.id === id; }) : { categoria:'numerico', nivel:1, enunciado:'', opcoes:['', '', '', ''], correta:0, pontos:null, explicacao:'', ativa:true };
  var sit = function(cat){ var k = CATS.find(function(x){ return x.c === cat; }); return k && k.g === 's'; };
  var html = '<div class="lado"><div class="campo"><label class="rot" for="e-cat">Categoria</label><select id="e-cat"' + (id ? ' disabled' : '') + '>' + CATS.map(function(k){ return '<option value="' + k.c + '"' + (q.categoria === k.c ? ' selected' : '') + '>' + esc(k.n) + '</option>'; }).join('') + '</select></div>'
    + '<div class="campo"><label class="rot" for="e-niv">Nível</label><select id="e-niv"' + (id ? ' disabled' : '') + '><option value="1">Fácil</option><option value="2">Médio</option><option value="3">Difícil</option></select></div></div>'
    + '<div class="campo"><label class="rot" for="e-enun">Enunciado *</label><textarea id="e-enun" maxlength="3000">' + esc(q.enunciado) + '</textarea></div>'
    + '<div id="e-ops"></div>'
    + '<div class="campo"><label class="rot" for="e-exp">Explicação do gabarito (só o RH vê)</label><input id="e-exp" maxlength="1000" value="' + esc(q.explicacao || '') + '"></div>'
    + '<label class="marcar"><input type="checkbox" id="e-ativa"' + (q.ativa ? ' checked' : '') + '> Ativa (entra no sorteio)</label>'
    + (id && q.tabela ? '<p class="dica">Esta pergunta tem uma tabela de apoio, mantida como está.</p>' : '');
  abrirModal(id ? 'Editar ' + q.codigo : 'Nova pergunta', html, [{ rotulo:'Cancelar' }, { rotulo:'Salvar', cls:'btn-primary', salvando:'Salvando…', fn:async function(){
    var cat = $('e-cat').value, ops = [], pts = [];
    document.querySelectorAll('[data-op-t]').forEach(function(i){ ops.push(i.value.trim()); });
    document.querySelectorAll('[data-op-p]').forEach(function(i){ pts.push(Math.max(0, Math.min(3, parseInt(i.value, 10) || 0))); });
    var cor = +((document.querySelector('[name=e-cor]:checked') || {}).value || 0);
    var enun = $('e-enun').value.trim();
    if(enun.length < 5){ toast('Escreva o enunciado.', 'err'); return false; }
    if(ops.some(function(o){ return !o; })){ toast('Preencha todas as alternativas (ou tire as vazias).', 'err'); return false; }
    if(new Set(ops.map(sem)).size !== ops.length){ toast('Há alternativas repetidas.', 'err'); return false; }
    var linha = { enunciado:enun, opcoes:ops, explicacao:$('e-exp').value.trim() || null, ativa:$('e-ativa').checked };
    if(sit(cat)){
      if(pts.filter(function(p){ return p === 3; }).length !== 1){ toast('Situação: exatamente uma alternativa vale 3 pontos (a melhor conduta).', 'err'); return false; }
      linha.pontos = pts; linha.correta = pts.indexOf(3);
    } else { linha.pontos = null; linha.correta = cor; }
    var r;
    if(id) r = await P().from('questoes').update(linha).eq('id', id);
    else { linha.categoria = cat; linha.nivel = +$('e-niv').value; linha.origem = 'rh'; linha.codigo = 'XXX-1-00'; r = await P().from('questoes').insert(linha); }
    if(r.error) throw r.error;
    toast('Pergunta salva.'); await carregarBanco(); desenharQuestoes();
  } }]);
  $('e-niv').value = String(q.nivel);
  var opsAtuais = q.opcoes.slice(), ptsAtuais = q.pontos ? q.pontos.slice() : q.opcoes.map(function(){ return 0; });
  function desenharOps(){
    var s = sit($('e-cat').value);
    $('e-ops').innerHTML = '<label class="rot">' + (s ? 'Alternativas e pontos (3 = melhor conduta, 0 = pior)' : 'Alternativas (marque a certa)') + '</label>'
      + opsAtuais.map(function(o, k){
        return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><b style="width:18px">' + letra(k) + '</b>'
          + (s ? '' : '<input type="radio" name="e-cor" value="' + k + '"' + (k === q.correta ? ' checked' : '') + ' style="width:auto;min-height:0">')
          + '<input data-op-t="' + k + '" value="' + esc(o) + '" maxlength="400">'
          + (s ? '<input data-op-p="' + k + '" type="number" min="0" max="3" value="' + (ptsAtuais[k] || 0) + '" style="width:64px">' : '')
          + (opsAtuais.length > 2 ? '<button type="button" class="btn btn-sm btn-secondary" data-op-x="' + k + '" title="Tirar">×</button>' : '') + '</div>';
      }).join('')
      + (opsAtuais.length < 5 ? '<button type="button" class="btn btn-sm btn-secondary" id="e-mais">+ Alternativa</button>' : '');
    $('e-ops').querySelectorAll('[data-op-t]').forEach(function(i){ i.addEventListener('input', function(){ opsAtuais[+i.getAttribute('data-op-t')] = i.value; }); });
    $('e-ops').querySelectorAll('[data-op-p]').forEach(function(i){ i.addEventListener('input', function(){ ptsAtuais[+i.getAttribute('data-op-p')] = +i.value; }); });
    $('e-ops').querySelectorAll('[data-op-x]').forEach(function(b){ b.addEventListener('click', function(){ var k = +b.getAttribute('data-op-x'); opsAtuais.splice(k, 1); ptsAtuais.splice(k, 1); if(q.correta >= opsAtuais.length) q.correta = 0; desenharOps(); }); });
    if($('e-mais')) $('e-mais').addEventListener('click', function(){ opsAtuais.push(''); ptsAtuais.push(0); desenharOps(); });
  }
  $('e-cat').addEventListener('change', desenharOps); desenharOps();
}

/* =====================================================================
   ENTRADA — quem autentica é o portal
   ===================================================================== */
function semAcesso(titulo, texto){
  $('abas').classList.add('oculto'); $('fab').classList.add('oculto');
  $('main').innerHTML = '<div class="cartao-aviso"><h1>' + esc(titulo) + '</h1><p>' + texto + '</p><p style="margin-top:14px"><a href="../">Voltar ao portal</a></p></div>';
}
async function iniciar(){
  try {
    var s = await sb.auth.getSession();
    var sessao = s.data && s.data.session;
    if(!sessao){ location.replace('../'); return; }
    var r = await sb.schema('core').from('pessoas').select('id,nome,perfil,tipo,ativo').eq('id', sessao.user.id).maybeSingle();
    if(r.error) throw r.error;
    if(!r.data || !r.data.ativo || r.data.tipo !== 'colaborador'){ location.replace('../'); return; }
    var semSenha = false;
    try { semSenha = !!(JSON.parse(localStorage.getItem('bemer_definir_senha') || '{}') || {})[sessao.user.id]; } catch(e){}
    if(!semSenha){ var x = await sb.schema('core').rpc('senha_pendente').then(function(v){ return v; }, function(){ return { error:1 }; }); semSenha = !x.error && x.data === true; }
    if(semSenha){ location.replace('../'); return; }
    var p2 = await sb.schema('core').rpc('dois_fatores_pendente').then(function(v){ return v; }, function(){ return { error:1 }; });
    if(!p2.error && p2.data === true){ location.replace('../'); return; }

    EU = { id:sessao.user.id, nome:r.data.nome || '' };
    var a = await P().rpc('minhas_acoes');
    if(a.error){
      if(/schema|not found|PGRST106|Invalid schema/i.test(a.error.message || '')) {
        semAcesso('B&M Perfil ainda não ligado', 'O banco ainda não expõe o módulo (Settings › API › Exposed schemas → <b>perfil</b>).'); return;
      }
      throw a.error;
    }
    PODE = { ver:!!a.data.ver, aplicar:!!a.data.aplicar, configurar:!!a.data.configurar, excluir:!!a.data.excluir };
    if(!PODE.ver){
      semAcesso('Sem acesso ao B&M Perfil', 'O B&M Perfil é liberado por perfil (Cadastros › Permissões). Se você precisa dele, peça à diretoria.');
      return;
    }
    await carregar();
    document.querySelectorAll('.so-config').forEach(function(b){ b.classList.toggle('oculto', !PODE.configurar); });
    $('abas').classList.remove('oculto');
    var alvo = (location.hash || '').replace('#', '');
    irAba(['painel', 'avaliacoes', 'comparar', 'vagas', 'perguntas'].indexOf(alvo) >= 0 ? alvo : 'painel');
  } catch(e){
    $('main').innerHTML = '<div class="cartao-aviso"><h1>Não foi possível carregar</h1><p>' + esc(msgErro(e)) + '</p><p style="margin-top:14px"><a href="../">Voltar ao portal</a></p></div>';
  }
}

document.addEventListener('visibilitychange', function(){
  if(document.hidden || !PODE.ver || C || ABA === 'rel' || $('modal').classList.contains('show') || Date.now() - D.carregadoEm < 60000) return;
  carregar().then(desenhar, function(){});
});

/* ---------- aviso de nova versão (nunca no meio de uma avaliação) ---------- */
(function(){
  var avisando = false, emVoo = false;
  function conferir(){
    if(avisando || emVoo || document.hidden || C) return;
    emVoo = true;
    fetch('version.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if(!v || !v.versao || v.versao === APP_VERSION || avisando) return;
        avisando = true;
        var f = document.createElement('div');
        f.className = 'faixa-atualizar'; f.setAttribute('role', 'status');
        f.innerHTML = '<span>Nova versão do B&amp;M Perfil disponível</span><button type="button">Atualizar agora</button>';
        document.body.appendChild(f);
        f.querySelector('button').addEventListener('click', function(){
          if(C){ toast('Termine a avaliação em andamento antes de atualizar.', 'err'); return; }
          location.reload();
        });
      })
      .catch(function(){})
      .then(function(){ emVoo = false; });
  }
  setInterval(conferir, 120000);
  document.addEventListener('visibilitychange', conferir);
  setTimeout(conferir, 8000);
})();

iniciar();
</script>
