<style>
/* Cadastros da construtora (24/09/2026; simplificado em 26/09/2026): pessoas,
   perfis, permissões e os dados da construtora moram AQUI — os módulos só
   consomem. Mesma identidade do portal: laranja nunca em texto sobre branco. */
:root{
  --azul:#00296B; --azul-escuro:#001B4D; --laranja:#FE9400; --laranja-claro:#FFF1DC;
  --texto:#0F1B2D; --texto2:#4F5B6D; --borda:#E3E7ED; --borda-forte:#C9D1DD;
  --fundo:#F5F7FA; --branco:#fff; --campo:#F7F9FC;
  --erro-fundo:#FDECEB; --erro:#9B1C14; --ok-fundo:#E7F5EC; --ok:#1B5E34;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fundo);color:var(--texto);
     -webkit-font-smoothing:antialiased;font-size:14px}
.oculto{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}

/* ---- cabeçalho padrão dos módulos ---- */
header.topo{background:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;
  padding-top:calc(9px + env(safe-area-inset-top));border-bottom:3px solid var(--laranja);
  box-shadow:0 2px 8px rgba(0,20,60,.08);position:sticky;top:0;z-index:40}
.marca{display:flex;align-items:center;gap:7px;text-decoration:none;min-height:36px}
.marca img{height:28px;width:auto;display:block}
.fio{width:1px;height:26px;background:var(--borda)}
.modulo{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--azul);font-size:15px;min-width:0}
.tile{width:28px;height:28px;border-radius:8px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.direita{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn-topo{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borda-forte);color:var(--azul);
  border-radius:9px;height:36px;padding:0 12px;cursor:pointer;text-decoration:none;font-weight:600}
.btn-topo.so-icone{border:0;padding:0;width:36px;justify-content:center}
/* ---- botão "← Portal" — PADRÃO DA SUÍTE (07/10/2026) ----
   Copiado do Docs (.btn.btn-secondary.btn-sm do #btnPortal): canto superior
   direito, fundo branco, texto e borda azul 294, raio 6, 12px/500, fonte do
   Docs. Sobre topo AZUL é o mesmo botão branco, só a borda fica branca.
   É a ÚNICA saída para o portal. Mesmo bloco em Flow, Custos, Cadastros,
   Patrimônio e Folha — mudou aqui, muda nos cinco. */
.bm-portal{display:inline-flex;align-items:center;justify-content:center;gap:6px;flex:0 0 auto;box-sizing:border-box;
  margin:0;padding:4px 10px;border:1px solid #00296B;border-radius:6px;background:#fff;color:#00296B;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:12px;font-weight:500;line-height:1.5;
  white-space:nowrap;text-decoration:none;cursor:pointer;transition:background .15s}
.bm-portal:hover{background:#f0f4fb;color:#00296B}
.bm-portal:focus-visible{outline:3px solid #FE9400;outline-offset:2px}
.bm-portal.sobre-azul{border-color:#fff}
@media (max-width:768px){.bm-portal{min-height:40px;padding:8px 10px;font-size:13px}}
@media (max-width:520px){ .fio,.btn-topo .txt{display:none} .btn-topo{padding:0 9px} header.topo{padding-left:12px;padding-right:12px} }
@media (max-width:360px){ .marca img{height:24px} }

/* ---- abas ---- */
nav.abas{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:30}
nav.abas .trilho{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.abas .trilho::-webkit-scrollbar{display:none}
nav.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;cursor:pointer;
  color:var(--texto2);font-weight:600;white-space:nowrap;min-height:46px}
nav.abas button.ativa{color:var(--azul);border-bottom-color:var(--laranja)}
nav.abas .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--fundo);color:var(--texto2);font-size:11px;margin-left:4px}

main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;color:var(--azul);font-weight:700}
.sub{color:var(--texto2);font-size:13px;margin-top:2px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.barra .busca{flex:1 1 220px;min-width:0}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--campo);border:1px solid var(--borda-forte);border-radius:9px;padding:9px 11px;min-height:40px}
select{padding-right:28px}
.barra select{width:auto;flex:0 0 auto}
@media (max-width:760px){ input,select,textarea{font-size:16px!important} }  /* sem zoom no iPhone */
.botao{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:0 16px;min-height:40px;font-weight:600;cursor:pointer;white-space:nowrap}
.botao.sec{background:#fff;color:var(--azul);border:1px solid var(--borda-forte)}
.botao.perigo{background:#fff;color:var(--erro);border:1px solid #E7B4AF}
.botao:disabled{opacity:.55;cursor:default}

/* ---- lista ---- */
.lista{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.linha{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--borda);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.linha:first-child{border-top:0}
.linha:hover{background:#F9FAFC}
.linha.inativa .nome{color:var(--texto2)}
.av{width:36px;height:36px;border-radius:50%;background:#E8EEF8;color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.corpo{flex:1 1 auto;min-width:0}
.nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det{color:var(--texto2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:45%}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;background:#EEF2F9;color:var(--azul);white-space:nowrap}
.chip.laranja{background:var(--laranja-claro);color:#6B3F00}
.chip.cinza{background:#EEF0F3;color:var(--texto2)}
@media (max-width:600px){ .chips{display:none} .linha .chips-mob{display:flex} }
.chips-mob{display:none;gap:5px;flex-wrap:wrap;margin-top:4px}
.vazio{padding:28px 16px;text-align:center;color:var(--texto2)}
.dica{background:#fff;border:1px dashed var(--borda-forte);border-radius:10px;padding:10px 12px;color:var(--texto2);font-size:12.5px;margin-bottom:12px}


/* ---- permissões ---- */
.tabela-rolagem{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:auto;max-height:calc(100vh - 230px);min-height:260px}
/* 28/09/2026: tabela grande — rola nos dois sentidos; Perfil (1ª coluna) e o cabeçalho ficam parados */
table.perm{border-collapse:separate;border-spacing:0}
table.perm thead th{position:sticky;top:0;z-index:2;box-shadow:0 1px 0 var(--borda)}
table.perm thead tr:nth-child(2) th{top:var(--h1,34px)}
table.perm thead th.perfil{z-index:3}
table.perm{border-collapse:collapse;width:100%;min-width:640px}
table.perm th,table.perm td{padding:10px 12px;border-top:1px solid var(--borda);text-align:center;vertical-align:middle}
table.perm thead th{border-top:0;font-size:12px;color:var(--texto2);font-weight:600;background:#FAFBFD}
table.perm th.perfil,table.perm td.perfil{text-align:left;position:sticky;left:0;background:#fff;min-width:170px;box-shadow:1px 0 0 var(--borda)}
table.perm thead th.perfil{background:#FAFBFD}
table.perm td.perfil b{display:block;font-weight:600}
table.perm td.perfil small{color:var(--texto2);font-size:11.5px}
table.perm tr.travado td{background:#FAFBFD}
table.perm td.base{background:#EEF2F8}   /* 0037: vem da base (tipo no Docs) */
table.perm input[type=checkbox]{width:20px;height:20px;accent-color:var(--azul);cursor:pointer}
table.perm select{min-width:170px;width:auto}
table.perm .trava{font-size:11px;color:var(--texto2)}
table.perm th.grupo{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--azul);background:#EEF2F9}
table.perm th.grupo.fazer{background:var(--laranja-claro);color:#6B3F00}
table.perm th.acao{min-width:92px;max-width:130px;white-space:normal;line-height:1.3;font-size:11.5px}
table.perm td.docs select{min-width:170px}
table.perm td.txt{text-align:left;font-size:13px;color:var(--texto)}
table.perm.acoes-tab{min-width:0}
.legenda{margin-top:12px;background:#fff;border:1px solid var(--borda);border-radius:12px;padding:4px 14px}
.legenda div{padding:9px 0;border-top:1px solid var(--borda);font-size:12.5px;color:var(--texto2);line-height:1.45}
.legenda div:first-child{border-top:0}
.legenda b{color:var(--azul);font-weight:600}
.botao.mini{min-height:34px;padding:0 12px;font-size:13px}
.resumo{border:1px solid var(--borda);border-radius:10px;background:#FAFBFD}
.resumo div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;padding:8px 12px;border-top:1px solid var(--borda);font-size:13px;line-height:1.45}
.resumo div:first-child{border-top:0}
.resumo b{color:var(--azul);font-weight:600}
@media (max-width:600px){ .resumo div{grid-template-columns:minmax(0,1fr);gap:2px} }
@media (max-width:600px){
  table.perm th.perfil,table.perm td.perfil{min-width:118px;max-width:130px}
  table.perm select{min-width:0;max-width:150px}
  table.perm{min-width:0}
}

/* ---- formulário ---- */
.cartao{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grade .inteiro{grid-column:1/-1}
@media (max-width:600px){ .grade{grid-template-columns:minmax(0,1fr)} }
label.rot{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin-bottom:4px}
.leitura{padding:9px 0;min-height:40px}
.sec-obras{margin-top:10px;padding-top:14px;border-top:1px solid var(--borda)}
.sec-obras b{display:block;color:var(--azul);font-size:14px}
.sec-obras span{display:block;color:var(--texto2);font-size:12.5px;margin-top:2px}
.marcar{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.marcar input{width:18px;height:18px;accent-color:var(--azul)}
.recado{border-radius:9px;padding:10px 12px;font-size:13px;margin-top:12px}
.recado.erro{background:var(--erro-fundo);color:var(--erro)}
.recado.ok{background:var(--ok-fundo);color:var(--ok)}
.caixa-marcar{border:1px solid var(--borda-forte);border-radius:9px;background:var(--campo);max-height:220px;overflow:auto;padding:4px 10px}
.caixa-marcar .marcar{min-height:34px;font-size:13px}
.seg{display:flex;border:1px solid var(--borda-forte);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;padding:9px 10px;cursor:pointer;min-height:40px;font-weight:600;color:var(--texto2)}
.seg button.ativo{background:var(--azul);color:#fff}
.seg-obras{max-width:360px;margin-bottom:8px}

/* ---- modal ---- */
.fundo-modal{position:fixed;inset:0;background:rgba(0,15,40,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:17px;color:var(--azul);margin-bottom:14px;padding-right:44px}
.fechar{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--texto2);cursor:pointer;border-radius:9px}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:600px){
  .fundo-modal{padding:0;align-items:flex-end}
  .modal{border-radius:14px 14px 0 0;max-height:94svh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .acoes .botao{flex:1}
}

.aviso-flut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:99;
  background:var(--azul);color:#fff;border-radius:10px;padding:10px 16px;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.aviso-flut.erro{background:var(--erro)}
.faixa-atualizar{position:fixed;left:0;right:0;top:0;z-index:55;background:var(--laranja);color:var(--azul);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:700}
.faixa-atualizar button{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;min-height:40px;font-weight:600}
.carregando{padding:60px 16px;text-align:center;color:var(--texto2)}
.rodape{text-align:center;color:var(--texto2);font-size:11px;padding:10px 0 24px}
</style>

function cnpjValido(c){
  c = soDigitos(c);
  if(!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  function dv(n){ var p = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s = 0;
    for(var i=0;i<n;i++) s += +c[i] * p[i]; return s % 11 < 2 ? 0 : 11 - s % 11; }
  return dv(12) === +c[12] && dv(13) === +c[13];
}

  var m = (e && (e.message || e.error_description)) || String(e || 'erro desconhecido');
  if(/duplicate key.*cnpj|empresas_cnpj_key/i.test(m)) return 'Já existe uma empresa com esse CNPJ.';

  if(/row-level security|permission denied/i.test(m)) return 'Seu perfil não pode fazer essa alteração.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão. Confira a internet e tente de novo.';

}

/* ---------------------------------------------------------------------
   VOLTA (05/10/2026) — o ← do celular fecha primeiro o que está por cima
   (mesmo mecanismo do Flow): cada camada que abre empilha um passo no
   histórico e o ← fecha a do topo; só sai para o portal sem nada aberto.
   Fechou pela tela (X, Cancelar, Esc): o passo é desfeito — ou
   reaproveitado se outra camada abrir no mesmo instante. Sem "voltas
   fantasmas" nem ← duas vezes para fechar uma coisa só.
   --------------------------------------------------------------------- */
var Volta = {
  pilha: [], sobra: 0, ignorar: 0,
  abrir: function(k, fechar){                 // devolve a camada: guarde-a
    var c = { k:k, fechar:fechar };
    Volta.pilha.push(c);
    try {
      var st = { bm:Volta.pilha.length };
      if(Volta.sobra > 0){ Volta.sobra--; history.replaceState(st, '', location.href); }
      else history.pushState(st, '', location.href);
    } catch(e){ Volta.pilha.pop(); }
    return c;
  },
  fechou: function(c){                        // fechou pela tela
    var i = c ? Volta.pilha.indexOf(c) : -1;
    if(i < 0) return;                         // foi o ← que fechou
    Volta.pilha.splice(i, 1); Volta.sobra++;
    setTimeout(Volta.desfazer, 0);
  },
  desfazer: function(){
    var n = Volta.sobra; if(!n) return;
    Volta.sobra = 0; Volta.ignorar++;
    try { history.go(-n); } catch(e){ Volta.ignorar--; }
  }
};
/* 06/10/2026 (pedido do Saurin): o ← na tela inicial NÃO sai para o portal —
   o único caminho é o botão "Portal". Na 1ª interação (o Chrome ignora passo
   criado sem gesto) a entrada atual vira a "raiz" e ganha um passo por cima;
   o ← que chega na raiz fica aqui, avisa e rearma no próximo toque. */
var Guarda = {
  posta: false,
  armar: function(){
    if(Guarda.posta || Volta.pilha.length || Volta.sobra || Volta.ignorar) return;
    try {
      history.replaceState({ bm:0, raiz:1 }, '', location.href);
      history.pushState({ bm:0 }, '', location.href);
      Guarda.posta = true;
    } catch(e){}
  }
};
document.addEventListener('pointerdown', Guarda.armar, true);
document.addEventListener('keydown', Guarda.armar, true);
document.addEventListener('touchstart', Guarda.armar, { capture:true, passive:true });
window.addEventListener('popstate', function(e){
  var d = (e.state && typeof e.state.bm === 'number') ? e.state.bm : 0;
  if(e.state && e.state.raiz && !Volta.ignorar){
    Guarda.posta = false;
    if(!Volta.pilha.length){ aviso('Para voltar ao portal, toque em Portal.'); return; }
  }
  if(Volta.ignorar){ Volta.ignorar--; return; }
  while(Volta.pilha.length > d){ var c = Volta.pilha.pop(); try { c.fechar(); } catch(x){} }
  if(d > Volta.pilha.length){ Volta.ignorar++; try { history.go(Volta.pilha.length - d); } catch(x){ Volta.ignorar--; } }
});
try { if(history.state && history.state.bm) history.replaceState(null, '', location.href); } catch(e){}

function irInicio(){
  var n = Volta.pilha.length;
  while(Volta.pilha.length){ var c = Volta.pilha.pop(); try { c.fechar(); } catch(x){} }
  if(n){ Volta.sobra += n; setTimeout(Volta.desfazer, 0); }
  try { if(EU && !$('abas').classList.contains('oculto')){ ABA = abas()[0][0]; desenhar(); } } catch(x){}
  window.scrollTo(0, 0);
}

function recarregar(){
  var minha = ++RECARGA;   // uma recarga antiga que termina depois não sobrescreve a nova
  var nada = Promise.resolve({ data: [] });
  var pedidos = [
    core('perfis').select('*').order('nome'),
    core('obras').select('id,nome,cno,ativa').order('nome'),
    core('empresas').select('id,cnpj,razao_social,nome_fantasia,ativa').order('razao_social'),
    core('construtora').select('*').maybeSingle(),
    PODE.verPessoas || PODE.verPermissoes
      ? core('pessoas').select('id,nome,email,tipo,perfil,empresa_id,ativo,whatsapp,avisa_whatsapp').order('nome') : nada,
    PODE.verPessoas ? core('pessoa_obras').select('pessoa_id,obra_id') : nada,
    core('perfil_modulos').select('perfil,modulo'),
    core('acoes').select('modulo,codigo,nome,descricao,consulta,ordem').order('ordem'),
    core('perfil_acoes').select('perfil,modulo,acao'),
    /* 06/10/2026 (0051): quem tem a marca "Administrador do sistema" — só o
       administrador vê e mexe. Sem a 0051 a coluna não existe: a caixa some. */
    PODE.admin ? core('pessoas').select('id').eq('administrador', true) : Promise.resolve({ data: null })
  ];
  return Promise.all(pedidos).then(function(rs){
    if(minha !== RECARGA) return;
    rs.forEach(function(r, i){ if(r.error && i !== 3 && i < 7) throw r.error; });   // 7+ = 0030 pode faltar
    D.perfis = rs[0].data || []; D.obras = rs[1].data || []; D.empresas = rs[2].data || [];
    D.construtora = rs[3].error ? null : (rs[3].data || null);
    D.construtoraFalta = !!rs[3].error;   // 0024 ainda não rodada
    D.pessoas = rs[4].data || []; D.pessoaObras = rs[5].data || [];
    D.perfilModulos = rs[6].data || []; D.acoes = rs[7].data || []; D.perfilAcoes = rs[8].data || [];
    D.falta0030 = !!(rs[7].error || rs[8].error);
    D.admins = (rs[9] && !rs[9].error && Array.isArray(rs[9].data)) ? rs[9].data.map(function(x){ return x.id; }) : null;
    /* 28/09/2026: as obras do Custos também se marcam aqui (0035) — o Custos
       não tem mais tela de usuários. Sem o Custos no banco, a seção não aparece. */
    D.fin = null; D.docsObras = null; D.obrasTodas = null;
    var fim = Promise.all([
      temFin() && PODE.verPessoas
        ? sb.schema('financeiro').rpc('obras_para_cadastro').then(function(r){ if(!r.error && r.data) D.fin = r.data; }, function(){})
        : null,
      /* 28/09/2026 (0036): as obras que a pessoa interna vê no DOCS também se marcam aqui */
      PODE.verPessoas
        ? sb.schema('core').rpc('obras_docs_para_cadastro').then(function(r){ if(!r.error && r.data) D.docsObras = r.data; }, function(){})
        : null,
      /* 07/10/2026 (0053): quem está em "Todas as obras" no Docs/Custos. Sem a 0053, null. */
      PODE.verPessoas
        ? sb.schema('core').rpc('obras_todas_para_cadastro').then(function(r){ if(!r.error && Array.isArray(r.data)) D.obrasTodas = r.data; }, function(){})
        : null]);
    return fim.then(function(){ if(minha === RECARGA) desenhar(); });
  }).catch(function(e){
    $('conteudo').innerHTML = '<div class="recado erro">Não foi possível carregar: ' + esc(msgErro(e)) + '</div>';
  });
}

  document.querySelectorAll('#conteudo .tabela-rolagem').forEach(function(d, i){

/* identifica o controle com foco pelos data-* (sobrevive ao redesenho). O
   controle é desabilitado antes de gravar e o navegador tira o foco dele —
   por isso quem grava guarda o seletor em FOCO_PENDENTE antes. */
var FOCO_PENDENTE = null;
function seletorDoFoco(){
  var a = document.activeElement;
  if(!a || !$('conteudo').contains(a)) return null;
  var chaves = ['data-mod-perfil','data-mod','data-tipo-docs','data-docs-perfil','data-pa-perfil','data-pa-acao','data-ver-inativos','data-filtro','data-acao','data-id'];
  var partes = chaves.filter(function(k){ return a.hasAttribute(k); })
                     .map(function(k){ return '[' + k + '="' + String(a.getAttribute(k)).replace(/["\\]/g, '\\$&').replace(/[\n\r\f]/g, function(c){ return '\\' + c.charCodeAt(0).toString(16) + ' '; }) + '"]'; });
  return partes.length ? a.tagName.toLowerCase() + partes.join('') : null;
}
function cabecalho(titulo, sub, botao){
  return '<div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between">'
       +   '<div><h1>' + titulo + '</h1><div class="sub">' + sub + '</div></div>' + (botao || '') + '</div>';
}
function selSit(chave, valor, opcoes){
  return '<select data-filtro="' + chave + '" aria-label="Situação">' + opcoes.map(function(o){
    return '<option value="' + o[0] + '"' + (valor === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
}

    + '</div><div class="lista" id="lista-pessoas">' + listaPessoas() + '</div>';
}
/* 29/09/2026: filtro por obra — cada módulo tem a sua lista; vale o NOME da obra
   e entra quem está marcado nela no Flow, no Docs ou no Custos */
function nomeObra(n){ return String(n || '').trim().toUpperCase(); }
function obrasFiltro(){
  var s = {};
  (D.obras || []).forEach(function(o){ if(o.ativa) s[nomeObra(o.nome)] = 1; });
  ((D.docsObras && D.docsObras.obras) || []).forEach(function(o){ if(o.ativa) s[nomeObra(o.nome)] = 1; });
  ((D.fin && D.fin.obras) || []).forEach(function(o){ s[nomeObra(o.nome)] = 1; });
  return Object.keys(s).filter(Boolean).sort(function(a, b){ return a.localeCompare(b, 'pt-BR'); });
}
function pessoaNaObra(p, nome){
  if(obrasDaPessoa(p.id).some(function(id){ var o = (D.obras || []).find(function(x){ return x.id === id; }); return o && nomeObra(o.nome) === nome; })) return true;
  if(D.docsObras){ var md = (D.docsObras.marcadas || []).find(function(x){ return x.pessoa_id === p.id; });
    if(md && (md.obra_ids || []).some(function(id){ var o = (D.docsObras.obras || []).find(function(x){ return Number(x.id) === Number(id); }); return o && nomeObra(o.nome) === nome; })) return true; }
  if(D.fin && (D.fin.marcadas || []).some(function(x){ if(x.pessoa_id !== p.id) return false; var o = (D.fin.obras || []).find(function(y){ return y.id === x.obra_id; }); return o && nomeObra(o.nome) === nome; })) return true;
  return false;
}
function listaPessoas(){
  var b = sem(F.pessoas.busca);
  var l = D.pessoas.filter(function(p){
    if(F.pessoas.sit === 'ativos' && !p.ativo) return false;
    if(F.pessoas.sit === 'inativos' && p.ativo) return false;
    if(F.pessoas.tipo && p.tipo !== F.pessoas.tipo) return false;
    if(F.pessoas.perfil && p.perfil !== F.pessoas.perfil) return false;
    if(F.pessoas.obra && !pessoaNaObra(p, F.pessoas.obra)) return false;
    return !b || sem([p.nome, p.email, perfilNome(p.perfil)].join(' ')).indexOf(b) >= 0;
  });
  if(!l.length) return '<div class="vazio">Ninguém encontrado.</div>';
  return l.map(function(p){
    var nOb = obrasDaPessoa(p.id).length;
    var ch = '<span class="chip">' + esc(perfilNome(p.perfil)) + '</span>'
           + (p.tipo === 'externo' ? '<span class="chip laranja">' + esc(empresaNome(p.empresa_id)) + '</span>'
                                   : '<span class="chip cinza">' + (nOb ? nOb + (nOb === 1 ? ' obra' : ' obras') : 'Todas as obras') + '</span>')
           + (p.ativo ? '' : '<span class="chip cinza">Inativo</span>')
           + (ehMarcado(p.id) ? '<span class="chip laranja" title="Administrador do sistema">Administrador</span>' : '');
    return '<button type="button" class="linha' + (p.ativo ? '' : ' inativa') + '" data-acao="pessoa" data-id="' + esc(p.id) + '">'
         +   '<span class="av">' + esc(inicial(p.nome)) + '</span>'
         +   '<span class="corpo"><div class="nome">' + esc(p.nome || '(sem nome)') + (p.id === EU.id ? ' · você' : '') + '</div>'
         +     '<div class="det">' + esc(p.email) + '</div>'
         +     '<div class="chips-mob">' + ch + '</div></span>'
         +   '<span class="chips">' + ch + '</span></button>';
  }).join('');
}

/* 06/10/2026 (0051): a marca "Administrador do sistema" (core.pessoas.administrador).
   Só o administrador (perfil TI ou quem já tem a marca) vê e mexe; D.admins
   só vem para ele. Ninguém põe ou tira a própria (o banco também barra). */
function ehMarcado(id){ return !!(PODE.admin && D.admins && D.admins.indexOf(id) >= 0); }

/* Que perfis eu posso dar (espelha a regra do banco — 0030 e a edge) */
/* perfil que vê a folha interna = tipo no Docs com folha (core.perfil_ve_folha): dar ou tirar é da diretoria/DP */
var TIPOS_FOLHA = ['diretoria', 'dp', 'visualizador_dp', 'visualizador_total'];
function veFolha(codigo){
  if(temFolha()) return temModulo(codigo, 'folha') && (codigo === 'diretoria' || temAcao(codigo, 'folha', 'ver') || (temAcao(codigo, 'folha', 'editar') && podeReceberFolha(codigo)));
  var p = perfilDe(codigo); return !!(p && TIPOS_FOLHA.indexOf(p.tipo_docs) >= 0);
}
/* no alcance da matriz? (sem a 0028: não restringe aqui; o banco confere) */
function noAlcance(perfil){ return PODE.admin || !PODE.gere || PODE.gere.indexOf(perfil) >= 0; }
function perfisQuePossoDar(tipo, atual){
  return D.perfis.filter(function(p){
    if(p.codigo === atual) return true;
    if(!noAlcance(p.codigo)) return false;
    if(!p.ativo) return false;
    if(tipo === 'externo') return p.codigo === 'fornecedor';
    if(p.eh_externo) return false;
    if((p.codigo === 'diretoria' || p.codigo === 'ti') && !PODE.admin) return false;
    if(veFolha(p.codigo) && !PODE.folha) return false;
    return true;
  });
}
function caixaMarcar(id, itens, marcados, editavel){
  if(!itens.length) return '<div class="leitura sub">Nenhuma cadastrada.</div>';
  return '<input type="search" placeholder="Filtrar" data-filtra="' + id + '" style="margin-bottom:6px"' + (itens.length < 8 ? ' class="oculto"' : '') + '>'
    + '<div class="caixa-marcar" id="' + id + '">' + itens.map(function(it){
      return '<label class="marcar" data-texto="' + esc(sem(it.nome)) + '"><input type="checkbox" value="' + esc(it.id) + '"'
           + (marcados.indexOf(it.id) >= 0 ? ' checked' : '') + (editavel ? '' : ' disabled') + '> ' + esc(it.nome) + '</label>';
    }).join('') + '</div>';
}
function marcadosEm(id){
  var c = $(id); if(!c) return null;
  return Array.prototype.map.call(c.querySelectorAll('input:checked'), function(i){ return i.value; });
}

function abrirPessoa(id){

  var marc = obrasDaPessoa(p.id);

  var tipoDocsP = (D.perfis.find(function(x){ return x.codigo === p.perfil; }) || {}).tipo_docs || null;
  var DOCS_TODAS = ['diretoria','ti','sesmt','coord_sesmt','dp','visualizador','visualizador_dp','visualizador_total'];
  var pfP = perfilDe(p.perfil) || {};
  var docsTodas = pfP.docs_por_acoes ? (p.perfil === 'diretoria' || temAcao(p.perfil, 'docs', 'todas_obras')) : DOCS_TODAS.indexOf(tipoDocsP) >= 0;
  var marcFin = D.fin ? (D.fin.marcadas || []).filter(function(x){ return x.pessoa_id === p.id; }).map(function(x){ return x.obra_id; }) : [];
  var finTodas = p.perfil === 'diretoria' || temAcao(p.perfil, 'financeiro', 'todas_obras');
  /* 07/10/2026: "Todas as obras" ou "Só estas" também no Docs e no Custos (0053) */
  var eraTodasDocs = D.docsObras ? obrasTodas(p.id, 'docs', (D.docsObras.obras || []).map(function(o){ return Number(o.id); }), marcDocs) : false;
  var eraTodasFin  = D.fin ? obrasTodas(p.id, 'financeiro', (D.fin.obras || []).map(function(o){ return o.id; }), marcFin) : false;
  var modoDocs = eraTodasDocs ? 'todas' : 'estas', modoFin = eraTodasFin ? 'todas' : 'estas';
  var dis = consulta ? ' disabled' : '';
  modal('Pessoa',

        + (fora && !consulta ? '<div class="sub">Perfil fora do seu alcance: nome, perfil e situação só por quem gerencia esse perfil.</div>' : ''), true)
    + campo('E-mail (login)', '<div class="leitura">' + esc(p.email) + '</div>', true)
    + campo('Perfil', '<select id="p-perfil"' + (travaPerfil ? ' disabled' : '') + '>' + perfisQuePossoDar(p.tipo, p.perfil).map(function(x){
        return '<option value="' + esc(x.codigo) + '"' + (x.codigo === p.perfil ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('') + '</select>'
        + (sou ? '<div class="sub">Ninguém muda o próprio perfil.</div>' : consulta ? '' : protegido ? '<div class="sub">Perfil da diretoria/TI: só o administrador do sistema altera.</div>'
           : folhaTrava ? '<div class="sub">Perfil com acesso à folha: só a diretoria ou o DP altera.</div>' : ''))
    + campo('WhatsApp', '<input type="tel" id="p-whats" placeholder="11 91234-5678" value="' + esc(p.whatsapp) + '"' + dis + '>')
    + campo('', '<label class="marcar"><input type="checkbox" id="p-avisa"' + (p.avisa_whatsapp ? ' checked' : '') + dis + '> Receber avisos pelo WhatsApp</label>')
    + campo('Situação', '<div class="seg" id="p-ativo" data-v="' + (p.ativo ? '1' : '0') + '">'
        + '<button type="button" data-v="1" class="' + (p.ativo ? 'ativo' : '') + '"' + (travaSit ? ' disabled' : '') + '>Ativo</button>'
        + '<button type="button" data-v="0" class="' + (p.ativo ? '' : 'ativo') + '"' + (travaSit ? ' disabled' : '') + '>Inativo</button></div>'
        + (!PODE.admin && !sou && !consulta ? '<div class="sub">Ativar ou desativar: só o administrador do sistema.</div>' : ''), true)
    /* 0051: a caixa só existe para o administrador; na própria ficha, travada */
    + (PODE.admin && D.admins && p.tipo === 'colaborador' ? campo('Administrador do sistema',

        + '<div class="sub">Mexe em perfis e permissões, nas configurações do portal (2FA, IA, Acervo e Storage), cria, ativa e desativa acessos internos e apaga registros.'
        + (p.perfil === 'ti' ? ' A TI já é administradora pelo perfil.' : p.perfil === 'diretoria' ? ' Sem a marca, a diretoria vê tudo e aprova, mas não administra nem apaga.' : '')
        + (sou ? ' Ninguém põe ou tira a própria marca.' : '') + '</div>', true) : '')
    + '<div class="inteiro sec-obras"><b>Obras que a pessoa vê</b><span>Cada módulo tem a sua lista de obras.'
        + (temModulo(p.perfil, 'patrimonio') || p.perfil === 'diretoria' ? ' O Patrimônio não separa por obra: vê os bens pelas áreas (Obra, TI) do perfil, em Permissões.' : '') + '</span></div>'
    + campo('Flow', blocoObras('p-obras', marc.length ? 'estas' : 'todas', obras, marc, PODE.obrasPessoa, 'Pendências das obras.'), true)
    + (D.docsObras && tipoDocsP && p.tipo === 'colaborador' ? campo('Docs', docsTodas
        ? '<div class="leitura">O perfil ' + esc(perfilNome(p.perfil)) + ' já vê todas as obras do Docs.</div>'
        : blocoObras('p-obras-docs', modoDocs, (D.docsObras.obras || []).filter(function(o){ return o.ativa || marcDocs.indexOf(Number(o.id)) >= 0; }).map(function(o){ return { id: Number(o.id), nome: o.nome + (o.ativa ? '' : ' (encerrada)') }; }),
            marcDocs, !!D.docsObras.pode, 'Documentação e portaria. Em "Só estas", nenhuma marcada = nenhuma obra.'), true) : '')
    + (D.fin ? campo('Custos', finTodas
        ? '<div class="leitura">O perfil ' + esc(perfilNome(p.perfil)) + ' já vê todas as obras do Custos.</div>'
        : blocoObras('p-obras-fin', modoFin, D.fin.obras || [], marcFin, !!D.fin.pode, 'Orçamento, compras e medições. Em "Só estas", nenhuma marcada = nenhuma obra.'), true) : '')
    + (PODE.verPermissoes && D.acoes.length ? campo('O que vê e faz (pelo perfil ' + perfilNome(p.perfil) + ')', resumoPerfil(p.perfil), true) : '')
    + '</div>',
    consulta && !PODE.obrasPessoa && !(D.fin && D.fin.pode) && !(D.docsObras && D.docsObras.pode) ? null : function(){
      /* tudo lido AGORA (antes o modal podia trocar durante a gravação) */
      var dados = {};
      if(!consulta){
        var tela = {
          nome: fora ? p.nome : $('p-nome').value.trim(),

        };
        if(!travaPerfil) tela.perfil = $('p-perfil').value;
        if(tela.nome.length < 3) throw new Error('Informe o nome completo.');
        if(tela.avisa_whatsapp && tela.whatsapp.length < 10) throw new Error('Para receber avisos, informe o WhatsApp com DDD.');
        /* só o que mudou: a página aberta há horas não desfaz o que outra pessoa gravou */
        Object.keys(tela).forEach(function(k){ if(tela[k] !== (p[k] == null ? '' : p[k])) dados[k] = tela[k]; });
      }
      /* 0051: a marca de administrador (o banco confere: só administrador, nunca em si mesmo) */
      var cxAdm = $('p-admin');
      if(cxAdm && !cxAdm.disabled && cxAdm.checked !== ehMarcado(p.id)){
        if(!confirm(cxAdm.checked
            ? 'Marcar ' + (p.nome || p.email) + ' como ADMINISTRADOR DO SISTEMA?\n\nPassa a mexer em perfis, permissões, configurações do portal, acessos e a poder apagar registros.'
            : 'Tirar de ' + (p.nome || p.email) + ' a marca de administrador do sistema?')) throw new Error('Nada mudou.');
        dados.administrador = cxAdm.checked;
      }
      var novas = null;
      if(PODE.obrasPessoa){
        novas = $('p-obras-modo').getAttribute('data-v') === 'todas' ? [] : (marcadosEm('p-obras') || []);
        if($('p-obras-modo').getAttribute('data-v') === 'estas' && !novas.length)
          throw new Error('Marque ao menos uma obra, ou escolha "Todas as obras".');
      }
      var mudouObras = novas && (novas.length !== marc.length || novas.some(function(x){ return marc.indexOf(x) < 0; }));
      /* Docs e Custos: o que cada um entende continua igual (lista; vazia =
         nenhuma). "Todas" = marca da 0053 + lista completa (obra nova entra
         sozinha). Sem a 0053, "Todas" grava todas as obras de hoje. */
      var planoDocs = (D.docsObras && D.docsObras.pode && $('p-obras-docs-modo'))
        ? planoObras('docs', p.id, $('p-obras-docs-modo').getAttribute('data-v') === 'todas', eraTodasDocs, marcDocs,
            (marcadosEm('p-obras-docs') || []).map(Number), (D.docsObras.obras || []).map(function(o){ return Number(o.id); }),
            function(lista){ return sb.schema('core').rpc('definir_obras_docs', { p_pessoa: p.id, p_obras: lista }).then(ok); })
        : null;
      var planoFin = (D.fin && D.fin.pode && $('p-obras-fin-modo'))
        ? planoObras('financeiro', p.id, $('p-obras-fin-modo').getAttribute('data-v') === 'todas', eraTodasFin, marcFin,
            marcadosEm('p-obras-fin') || [], (D.fin.obras || []).map(function(o){ return o.id; }),
            function(lista){ return sb.schema('financeiro').rpc('definir_obras_da_pessoa', { p_pessoa: p.id, p_obras: lista }).then(ok); })
        : null;
      var mudouDocs = !!planoDocs, mudouFin = !!planoFin;
      var passo = Object.keys(dados).length ? core('pessoas').update(dados).eq('id', p.id).then(ok) : Promise.resolve();
      return passo.then(function(){ return mudouObras ? definirObras(p.id, marc, novas) : null; })
        .then(function(){ return planoDocs ? planoDocs() : null; })
        .then(function(){ return planoFin ? planoFin() : null; })
        .then(function(){ return 'ativo' in dados ? loginDocs(p.id, dados.ativo) : null; })
        .then(function(aviso){ if(aviso) return aviso; if(!Object.keys(dados).length && !mudouObras && !mudouFin && !mudouDocs) return 'Nada mudou.'; });
    });
  segmento('p-ativo');
  ['p-obras', 'p-obras-docs', 'p-obras-fin'].forEach(function(pre){
    segmento(pre + '-modo', function(v){ $(pre + '-lista').classList.toggle('oculto', v !== 'estas'); });
  });

/* ---------------------------------------------------------------------
   Obras por módulo — o MESMO padrão em Flow, Docs e Custos (07/10/2026):
   "Todas as obras" ou "Só estas" (e aí marca as obras).
   · Flow:   core.pessoa_obras, lista vazia = todas (como sempre).
   · Docs e Custos: lista; vazia = nenhuma (como sempre). "Todas" é a marca
     core.pessoa_obras_todas (0053) + a lista completa; obra nova entra
     sozinha (gatilho). Sem a 0053 no banco, "Todas" = todas as de hoje.
   --------------------------------------------------------------------- */
function blocoObras(pre, modo, itens, marcados, editavel, dica){
  return '<div class="seg seg-obras" id="' + pre + '-modo" data-v="' + modo + '">'
    + '<button type="button" data-v="todas" class="' + (modo === 'todas' ? 'ativo' : '') + '"' + (editavel ? '' : ' disabled') + '>Todas as obras</button>'
    + '<button type="button" data-v="estas" class="' + (modo === 'estas' ? 'ativo' : '') + '"' + (editavel ? '' : ' disabled') + '>Só estas</button></div>'
    + '<div id="' + pre + '-lista"' + (modo === 'estas' ? '' : ' class="oculto"') + '>' + caixaMarcar(pre, itens, marcados, editavel) + '</div>'
    + '<div class="sub">' + dica + (editavel ? '' : ' Seu perfil não altera.') + '</div>';
}
/* a pessoa está em "Todas" neste módulo? Com a 0053: a marca. Sem ela: todas
   as obras que existem estão marcadas. */
function obrasTodas(pessoa, modulo, todasIds, marcados){
  if(D.obrasTodas) return D.obrasTodas.some(function(x){ return x.pessoa_id === pessoa && x.modulo === modulo; });
  return todasIds.length > 0 && todasIds.every(function(id){ return marcados.indexOf(id) >= 0; });
}
/* devolve a gravação a fazer (função) ou null se nada mudou */
function planoObras(modulo, pessoa, querTodas, eraTodas, antes, marcados, todasIds, gravarLista){
  var flag = function(liga){
    return sb.schema('core').rpc('definir_obras_todas', { p_pessoa: pessoa, p_modulo: modulo, p_todas: liga }).then(ok);
  };
  if(querTodas){
    if(eraTodas) return null;
    return D.obrasTodas ? function(){ return flag(true); } : function(){ return gravarLista(todasIds); };
  }
  var mudouLista = marcados.length !== antes.length || marcados.some(function(x){ return antes.indexOf(x) < 0; });
  if(!eraTodas && !mudouLista) return null;
  return function(){ return (eraTodas && D.obrasTodas ? flag(false) : Promise.resolve()).then(function(){ return gravarLista(marcados); }); };
}

      var email = $('n-email').value.trim().toLowerCase(), nome = $('n-nome').value.trim();
      if(nome.length < 3) throw new Error('Informe o nome completo.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Informe um e-mail válido.');
      if(email.slice(-DOMINIO_EMAIL.length) !== DOMINIO_EMAIL) throw new Error('Colaborador usa e-mail ' + DOMINIO_EMAIL + '.');
      if(!$('n-perfil').value) throw new Error('Escolha o perfil.');
      var corpo = { email:email, nome:nome, tipo:'colaborador', perfil:$('n-perfil').value,
                    redirect: new URL('../', location.href).href };
      var whats = soDigitos($('n-whats').value);
      return criarAcesso(corpo).then(function(dados){
        /* o telefone não passa pela edge (ela cuida só do acesso). Se falhar,
           o acesso JÁ foi criado: não é erro de repetir (daria "já tem acesso") */
        var tel = whats && dados.id
          ? core('pessoas').update({ whatsapp: whats }).eq('id', dados.id).then(ok).then(function(){ return ''; },
              function(){ return ' O WhatsApp não foi salvo — edite a pessoa para incluir.'; })
          : Promise.resolve('');
        return tel.then(function(extra){
          if(dados.aviso) return { ficar: dados.aviso + extra };
          if(extra) return { erro: 'Acesso criado.' + extra };
          return 'Acesso criado. O e-mail para criar a senha foi enviado.';
        });
      });
    }, 'Criar acesso');
}

/* 28/09/2026: ativar/desativar aqui mudava só o cadastro. O login continuava
   como o Docs deixou: quem foi inativado pelo Docs tem o login BLOQUEADO no
   Auth e, reativado aqui, seguia sem conseguir entrar. Quem bloqueia e
   desbloqueia é a edge do Docs `inativar-usuario` (a mesma do botão do Docs),
   então a gente chama ela. Se ela recusar, o cadastro já foi gravado: só avisa. */
function loginDocs(id, ativar){
  return sb.functions.invoke('inativar-usuario', { body: { userId: id, ativar: ativar, motivo: 'Pelo portal (Cadastros)' } })
    .then(function(r){
      if(!r.error && r.data && r.data.ok) return null;
      var p = r.error && r.error.context && typeof r.error.context.json === 'function'
        ? r.error.context.json().catch(function(){ return {}; }) : Promise.resolve(r.data || {});
      return p.then(function(c){
        return { ficar: 'Cadastro salvo, mas o login não foi ' + (ativar ? 'desbloqueado' : 'bloqueado') + ' ('
          + ((c && c.error) || (r.error && r.error.message) || 'sem resposta') + '). Faça pelo Docs: Usuários → '
          + (ativar ? 'Reativar' : 'Inativar') + '.' };
      });
    }, function(){ return { ficar: 'Cadastro salvo, mas não consegui falar com o Docs para ' + (ativar ? 'desbloquear' : 'bloquear') + ' o login. Faça pelo Docs.' }; });
}

function criarAcesso(corpo){
  return sb.functions.invoke(FUNCAO_CRIAR_PESSOA, { body: corpo }).then(function(r){
    /* quando a função recusa (400/403/409) a mensagem de verdade está no corpo */
    if(r.error && r.error.context && typeof r.error.context.json === 'function'){
      return r.error.context.json().catch(function(){ return {}; }).then(function(c){
        throw new Error(c.erro || r.error.message || 'Falha ao criar o acesso.');
      });
    }
    var d = r.data || {};
    if(r.error || d.erro){
      var m = d.erro || (r.error && r.error.message) || 'Falha ao criar o acesso.';
      if(/Failed to send a request|Failed to fetch|FunctionsFetchError/i.test(m))
        m = 'Não consegui falar com a função que cria o acesso ("' + FUNCAO_CRIAR_PESSOA + '"). Confira a internet; se persistir, avise a TI.';
      throw new Error(m);
    }
    return d;
  });
}

/* troca as obras que a pessoa vê numa transação só (0027). Sem a função,
   PÕE antes de TIRAR: se falhar no meio, a pessoa fica com obra a mais —
   nunca com nenhuma (que quer dizer "vê todas"). */
function definirObras(pessoa, antes, depois){
  return sb.schema('core').rpc('definir_obras_da_pessoa', { p_pessoa: pessoa, p_obras: depois }).then(function(r){
    if(!r || !r.error) return;
    if(!/definir_obras_da_pessoa|Could not find the function|does not exist/i.test(r.error.message || '')) throw r.error;
    var tira = antes.filter(function(x){ return depois.indexOf(x) < 0; });
    var poe  = depois.filter(function(x){ return antes.indexOf(x) < 0; });
    var p = Promise.resolve();
    if(poe.length)  p = p.then(function(){ return core('pessoa_obras').upsert(poe.map(function(x){ return { pessoa_id: pessoa, obra_id: x }; }), { onConflict: 'pessoa_id,obra_id', ignoreDuplicates: true }).then(ok); });
    if(tira.length) p = p.then(function(){ return core('pessoa_obras').delete().eq('pessoa_id', pessoa).in('obra_id', tira).then(ok); });
    return p;
  });
}

function tipoDocsNome(t){ var x = TIPOS_DOCS.find(function(y){ return y[0] === t; }); return x ? x[1] : 'Sem Docs'; }

function rotPessoas(n){ return n + (n === 1 ? ' pessoa' : ' pessoas'); }
function ordemPerfis(a, b){

function opcoesTipoDocs(atual){

var VER_INATIVOS = false;
function telaPerfis(){

        }).join('')
      + (docsPelaTabela()
        ? '<td>' + (dir ? '<span class="trava">tudo</span>' : '<input type="checkbox" data-docs-perfil="' + esc(p.codigo) + '"' + (p.tipo_docs ? ' checked' : '')
            + (!ed || ti ? ' disabled' : '') + ' aria-label="Docs para ' + esc(p.nome) + '">') + '</td>'
        : '<td class="docs">' + (ed && !dir && !ti
          ? '<select data-tipo-docs="' + esc(p.codigo) + '" aria-label="Tipo no Docs de ' + esc(p.nome) + '">' + opcoesTipoDocs(p.tipo_docs) + '</select>'

      + '<td><button type="button" class="botao sec mini" data-acao="perfil" data-id="' + esc(p.codigo) + '">' + (ed ? 'Editar' : 'Ver') + '</button></td>'
      + '</tr>';
  }).join('');
  return cabecalho('Perfis', 'O cargo de cada pessoa: em que módulos ela entra' + (docsPelaTabela() ? '' : ' e qual é o tipo dela no Docs') + '. O que ela pode fazer dentro de cada módulo fica em <b>Permissões</b>.',
           ed ? '<button class="botao" data-acao="novo-perfil">+ Novo perfil</button>' : '')
    + '<div class="dica" style="margin-top:14px">Travado de propósito: a Diretoria vê tudo e aprova; a TI sempre entra nos Cadastros e só o administrador do sistema (a TI ou quem tem a marca "Administrador do sistema" na ficha da pessoa) mexe em perfis e permissões. ' + (docsPelaTabela() ? 'Folha interna no Docs: só a diretoria ou o DP marcam.' : 'Tipo no Docs com acesso à folha interna: só a diretoria ou o DP.') + ' Fornecedor se cadastra no Docs e não entra no portal.'
    + (ed ? '' : ' Seu perfil só consulta.') + '</div>'
    + (inativos ? '<label class="marcar" style="margin:-4px 0 6px"><input type="checkbox" data-ver-inativos' + (VER_INATIVOS ? ' checked' : '') + '> Mostrar perfis inativos (' + inativos + ')</label>' : '')
    + '<div class="tabela-rolagem"><table class="perm"><thead><tr><th class="perfil">Perfil</th>'
    + modulosAtivos().map(function(mo){ return '<th title="' + esc(mo.dica) + '">' + esc(mo.nome) + '</th>'; }).join('')

}
function abrirPerfil(codigo){
  var p = codigo ? perfilDe(codigo) : null;
  if(codigo && !p) return;
  var novo = !p, sistema = p && (p.codigo === 'diretoria' || p.codigo === 'ti');
  var total = p ? qtdPessoas(p.codigo, true) : 0;
  var so = !PODE.admin;   // só consulta: vê o resumo, não grava
  modal(novo ? 'Novo perfil' : 'Perfil',
    '<div class="grade">'
    + campo('Nome do perfil (o cargo)', '<input type="text" id="f-nome" maxlength="60" placeholder="ex.: Engenheiro de obra" value="' + esc(p ? p.nome : '') + '">', true)
    + campo('Descrição (opcional)', '<input type="text" id="f-desc" maxlength="140" value="' + esc(p ? p.descricao : '') + '">', true)
    + (docsPelaTabela() ? '' : campo('Tipo no Docs', '<select id="f-tipo"' + (sistema ? ' disabled' : '') + '>' + opcoesTipoDocs(p ? p.tipo_docs : null) + '</select>'
        + '<div class="sub" id="f-tipo-dica" style="margin-top:6px"></div>', true))
    + (novo ? campo('Módulos', modulosAtivos().filter(function(mo){ return mo.m !== 'folha'; }).map(function(mo){
          return '<label class="marcar"><input type="checkbox" data-novo-mod="' + mo.m + '"' + (mo.m === 'flow' ? ' checked' : '') + '> ' + esc(mo.nome) + '</label>'; }).join('')
          + (docsPelaTabela() ? '<label class="marcar"><input type="checkbox" id="f-novo-docs"> Docs</label>' : ''), true)
        : campo('Situação', '<div class="seg" id="f-ativo" data-v="' + (p.ativo ? '1' : '0') + '">'
            + '<button type="button" data-v="1" class="' + (p.ativo ? 'ativo' : '') + '"' + (sistema ? ' disabled' : '') + '>Ativo</button>'
            + '<button type="button" data-v="0" class="' + (p.ativo ? '' : 'ativo') + '"' + (sistema ? ' disabled' : '') + '>Inativo</button></div>'
            + '<div class="sub">' + rotPessoas(total) + ' com este perfil. Inativo não aparece para novos cadastros.</div>', true))
    + (novo ? '' : campo('O que este perfil vê e faz hoje', resumoPerfil(p.codigo)
        + '<div class="sub" style="margin-top:6px">Para mudar: módulos na aba Perfis (ou "Ver o módulo" em Permissões); o resto na aba Permissões.</div>', true))
    + (!so && !novo && !sistema && total === 0 ? '<div class="inteiro"><button type="button" class="botao perigo" id="f-excluir">Excluir perfil</button></div>' : '')
    + '</div>',
    so ? null : function(){
      var nome = $('f-nome').value.trim(), desc = $('f-desc').value.trim();
      /* 0040: pela tabela, o tipo no Docs sai das caixas; aqui só entra/não entra */
      var tipo = $('f-tipo') ? ($('f-tipo').value || null) : novo ? ($('f-novo-docs') && $('f-novo-docs').checked ? 'engenheiro' : null) : (p.tipo_docs || null);
      if(nome.length < 2) throw new Error('Informe o nome do perfil.');
      if(novo){
        var mods = Array.prototype.filter.call(document.querySelectorAll('[data-novo-mod]'), function(i){ return i.checked; })
                        .map(function(i){ return i.getAttribute('data-novo-mod'); });
        return sb.schema('core').rpc('salvar_perfil', { p_codigo: null, p_nome: nome, p_descricao: desc, p_tipo_docs: tipo, p_ativo: true }).then(ok)
          .then(function(r){
            var cod = r.data;
            return mods.reduce(function(pr, m){
              return pr.then(function(){ return sb.schema('core').rpc('definir_modulo', { p_perfil: cod, p_modulo: m, p_ligado: true }).then(ok); });
            }, Promise.resolve());
          })
          .then(function(){ return 'Perfil criado. Marque o que ele pode fazer em Permissões.'; });
      }
      var ativo = $('f-ativo').getAttribute('data-v') === '1';
      if(tipo !== (p.tipo_docs || null) && total && !confirm('Mudar o tipo no Docs muda o que as ' + rotPessoas(total) + ' deste perfil fazem no Docs. Continuar?'))
        throw new Error('Nada mudou.');
      return sb.schema('core').rpc('salvar_perfil', { p_codigo: p.codigo, p_nome: nome, p_descricao: desc, p_tipo_docs: tipo, p_ativo: ativo }).then(ok)
        .then(function(){ return 'Perfil salvo.'; });
    });
  segmento('f-ativo');
  if(so) document.querySelectorAll('#modal input, #modal select, #modal .seg button').forEach(function(x){ x.disabled = true; });
  function dica(){ var t = TIPOS_DOCS.find(function(x){ return x[0] === $('f-tipo').value; });
    $('f-tipo-dica').textContent = t ? 'No Docs: ' + t[2] : 'Não entra no Docs.'; }
  if($('f-tipo')){ $('f-tipo').addEventListener('change', dica); dica(); }
  var ex = $('f-excluir');
  if(ex) ex.addEventListener('click', function(){
    if(!confirm('Excluir o perfil "' + p.nome + '"?')) return;
    ex.disabled = true;
    sb.schema('core').rpc('excluir_perfil', { p_codigo: p.codigo }).then(ok)
      .then(function(){ fecharModal(); aviso('Perfil excluído.'); return recarregar(); })
      .catch(function(e){ ex.disabled = false; aviso(msgErro(e), true); });
  });
}

/* O que o perfil vê e faz, em frases (lido da mesma tabela que o banco usa) */
function resumoPerfil(c){
  var p = perfilDe(c); if(!p) return '';
  var dir = c === 'diretoria';
  function pode(m, a){ return temModulo(c, m) && (travado(c, m) || temAcao(c, m, a)); }
  function nomes(m, consulta){
    return D.acoes.filter(function(a){ return a.modulo === m && !!a.consulta === consulta && pode(m, a.codigo); })
                  .map(function(a){ return a.nome.toLowerCase(); });
  }
  var l = [];
  if(dir){ l.push(['Tudo', 'Diretoria: vê tudo e aprova em todos os módulos. Apagar registros, perfis e permissões, configurações do portal e acessos internos são do administrador do sistema (a TI ou quem tem a marca).']); }
  else {
    if(temModulo(c, 'flow')){
      var fv = 'Vê as pendências em que é quem criou, o responsável ou um envolvido'
             + (pode('flow', 'ver_obras') ? ', e todas as das obras que enxerga' : '') + '.';
      var ff = nomes('flow', false);
      l.push(['Flow', fv + (pode('flow', 'ver_painel') ? ' Vê o Painel.' : '') + (ff.length ? ' Pode: ' + ff.join(', ') + '.' : ' Só responde as pendências dele.')]);
    } else l.push(['Flow', 'Não entra.']);
    if(temModulo(c, 'patrimonio')){
      var areas = ['obra', 'ti'].filter(function(d){ return pode('patrimonio', 'ver_' + d) || pode('patrimonio', 'gerenciar_' + d) || pode('patrimonio', 'aprovar_' + d); })
                                .map(function(d){ return d === 'obra' ? 'Obra' : 'TI'; });
      var pv = areas.length ? 'Vê todos os bens de ' + areas.join(' e ') + ', além dos que estão com ele.' : 'Vê só os bens que estão com ele (custódia) e pede cadastro e movimentação.';
      var pf = nomes('patrimonio', false);
      l.push(['Patrimônio', pv + (pode('patrimonio', 'relatorios') ? ' Vê relatórios.' : '') + (pf.length ? ' Pode: ' + pf.join(', ') + '.' : '')]);
    } else l.push(['Patrimônio', 'Não entra.']);
    if(temFin()){
      if(temModulo(c, 'financeiro')){
        var nv = nomes('financeiro', true), nf = nomes('financeiro', false);
        l.push(['Custos', (pode('financeiro', 'todas_obras') ? 'Todas as obras.' : 'Só as obras marcadas para a pessoa.')
          + (nv.length ? ' Vê: ' + nv.filter(function(x){ return x !== 'ver todas as obras'; }).join(', ') + '.' : '') + (nf.length ? ' Pode: ' + nf.join(', ') + '.' : '')]);
      } else l.push(['Custos', 'Não entra.']);
    }
    if(temModulo(c, 'configuracoes')){
      var cv = nomes('configuracoes', true), cf = nomes('configuracoes', false);
      l.push(['Cadastros', (cv.length || cf.length ? [].concat(cv, cf).join(', ').replace(/^./, function(x){ return x.toUpperCase(); }) + '.' : 'Vê só os dados da construtora.')
              + (c === 'ti' ? ' (A TI tem tudo aqui.)' : '')]);
    } else l.push(['Cadastros', 'Não entra.']);
    if(temFolha()){
      var fe = pode('folha', 'editar') && podeReceberFolha(c);
      if(temModulo(c, 'folha') && (fe || pode('folha', 'ver'))){
        var fx = [pode('folha', 'exportar') ? 'exportar e imprimir' : '', pode('folha', 'acessos') ? 'ver o registro de acessos' : '',
                  fe && pode('folha', 'importar') ? 'importar planilha' : ''].filter(Boolean);
        l.push(['Folha', (fe ? 'Vê, cadastra e altera a folha interna.' : 'Vê a folha interna (só leitura).') + (fx.length ? ' Também: ' + fx.join(', ') + '.' : '')]);
      } else l.push(['Folha', 'Não entra.']);
    }
  }
  var td = TIPOS_DOCS.find(function(x){ return x[0] === p.tipo_docs; });
  var extrasDocs = td ? D.acoes.filter(function(a){ return a.modulo === 'docs' && temAcao(c, 'docs', a.codigo) && !daBaseDocs(c, a.codigo); }).map(function(a){ return a.nome.toLowerCase(); }) : [];
  if(p.docs_por_acoes){
    var nd = dir ? ['tudo' + (temFolha() ? '' : ', inclusive a folha interna')] : D.acoes.filter(function(a){ return a.modulo === 'docs' && temAcao(c, 'docs', a.codigo) && !(temFolha() && /^folha_/.test(a.codigo)); }).map(function(a){ return a.nome.toLowerCase(); });
    l.push(['Docs', !p.tipo_docs ? 'Não entra.' : (nd.length ? 'Pode: ' + nd.join(', ') + '.' : 'Só as obras marcadas para a pessoa, só leitura.')]);
  } else l.push(['Docs', td ? td[1] + ': ' + td[2] + (extrasDocs.length ? ' Também: ' + extrasDocs.join(', ') + '.' : '') : 'Não entra.']);
  l.push(['Obras', 'Quais obras cada pessoa enxerga se define no cadastro dela (aba Pessoas): todas ou só algumas.']);
  return '<div class="resumo">' + l.map(function(x){ return '<div><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></div>'; }).join('') + '</div>';
}

/* ---------------------------------------------------------------------
   PERMISSÕES — perfil × ação, uma tabela por módulo (core.perfil_acoes).
   O banco obedece. Grava por core.definir_permissao (diretoria/TI).
   --------------------------------------------------------------------- */
var PERM_MOD = 'geral';
var MOD_PERM = [['geral', 'Visão geral'], ['flow', 'Flow'], ['patrimonio', 'Patrimônio'], ['financeiro', 'Custos'], ['configuracoes', 'Cadastros'], ['docs', 'Docs'], ['folha', 'Folha']];
/* 28/09/2026: o Financeiro só aparece onde o banco já o tem (0033 rodada) —
   em produção ele ainda não existe, e ligar o card daria "Módulo inválido". */
function temFin(){ return (D.acoes || []).some(function(a){ return a.modulo === 'financeiro'; }); }
/* 06/10/2026 (0052): a Folha é módulo próprio — só aparece onde o banco já tem as ações dela */
function temFolha(){ return (D.acoes || []).some(function(a){ return a.modulo === 'folha'; }); }
/* editar/importar a folha: só perfil da diretoria ou do DP RECEBE (espelha core.folha_pode_receber) */
function podeReceberFolha(c){ var p = perfilDe(c); return c === 'diretoria' || !!(p && (p.tipo_docs === 'diretoria' || p.tipo_docs === 'dp')); }
function modulosAtivos(){ return MODULOS.filter(function(mo){ return (mo.m !== 'financeiro' || temFin()) && (mo.m !== 'folha' || temFolha()); }); }
function modPerm(){ return MOD_PERM.filter(function(x){ return (x[0] !== 'financeiro' || temFin()) && (x[0] !== 'folha' || temFolha()); }); }
var NOTA_MOD = {
  flow: 'Quem tem o Flow sempre vê e responde as pendências em que é quem criou, o responsável ou um envolvido. O que se marca aqui soma a isso.',
  patrimonio: 'Quem tem o Patrimônio e nada marcado vê só os bens que estão com ele e pede cadastro e movimentação. "Dar baixa" e "Excluir" valem só nas áreas em que o perfil cadastra e movimenta. Na Diretoria, "Excluir" e apagar só com a marca "Administrador do sistema".',
  configuracoes: 'Quem tem os Cadastros e nada marcado vê só os dados da construtora. A TI e quem tem a marca "Administrador do sistema" têm tudo aqui. Na Diretoria sem a marca, "Cadastrar e editar pessoas" não vale (só consulta).',
  docs: 'Marque o que cada perfil vê e faz no Docs; vale na hora (a pessoa sai e entra de novo) — na tela e no banco. Sem "Ver todas as obras", a pessoa vê só as obras marcadas para ela (aba Pessoas). A folha interna agora fica na aba Folha. O que o fornecedor vê se cuida no Docs.',
  folha: 'Folha interna (tem salário): só a diretoria ou o DP ligam o módulo e marcam as caixas; "Cadastrar e alterar" e "Importar planilha" só para perfis da diretoria ou do DP (o banco também barra). Vale na hora, na tela e no banco, sempre com o código do dia (2FA). Cada abertura e exportação fica no registro de acessos.',
  financeiro: 'Sem "Ver todas as obras", a pessoa vê só as obras marcadas para ela em Custos — nenhuma marcada, nenhuma obra. Decidir contratação e SAE e aprovar compra acima da alçada são só da diretoria; excluir, só da diretoria com a marca "Administrador do sistema".'
};
/* 28/09/2026 (0037): no Docs o "tipo" do perfil é a BASE. O que ela dá aparece
   marcado e travado; o resto se marca e SOMA. Espelha core.docs_base_da(). */
var DOCS_BASE = {
  diretoria:   ['todas_obras','indicadores','enviar_doc','aprovar_doc','administrar','portaria','obra_docs','cobrar_email','cobrar_whats','fopag'],
  ti:          ['todas_obras','indicadores','enviar_doc','aprovar_doc','administrar','portaria','obra_docs','cobrar_email','cobrar_whats','fopag'],
  sesmt:       ['todas_obras','indicadores','enviar_doc','aprovar_doc','administrar','portaria','obra_docs','cobrar_email','cobrar_whats'],
  coord_sesmt: ['todas_obras','indicadores','enviar_doc','aprovar_doc','administrar','portaria','obra_docs','cobrar_email','cobrar_whats'],
  dp:          ['todas_obras','enviar_doc','administrar','portaria','obra_docs','cobrar_email','cobrar_whats','fopag'],
  tst:         ['enviar_doc','portaria','obra_docs','cobrar_email'],
  coordenador: ['enviar_doc','portaria','cobrar_email'],
  vigia:       ['portaria'],

function daBaseDocs(perfil, acao){
  var p = D.perfis.find(function(x){ return x.codigo === perfil; });
  if(p && p.docs_por_acoes) return false;   // 0038: pela tabela, nada travado
  return !!(p && p.tipo_docs && (DOCS_BASE[p.tipo_docs] || []).indexOf(acao) >= 0);
}
function docsPelaTabela(){ return (D.perfis || []).some(function(p){ return 'docs_por_acoes' in p; }); }
function temDocsAcoes(){ return (D.acoes || []).some(function(a){ return a.modulo === 'docs'; }); }
function travado(perfil, mod){ return perfil === 'diretoria' || (perfil === 'ti' && mod === 'configuracoes'); }
function temAcao(perfil, mod, acao){ return D.perfilAcoes.some(function(x){ return x.perfil === perfil && x.modulo === mod && x.acao === acao; }); }
function telaPermissoes(){
  var seg = '<div class="seg" style="margin-top:14px;max-width:700px">' + modPerm().map(function(x){
    return '<button type="button" data-acao="perm-vista" data-id="' + x[0] + '" class="' + (PERM_MOD === x[0] ? 'ativo' : '') + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
  var topo = cabecalho('Permissões', 'O que cada perfil pode fazer dentro de cada módulo. Vale na hora, para todas as pessoas do perfil.' + (PODE.admin ? '' : ' Seu perfil só consulta.')) + seg;
  if(D.falta0030) return topo + '<div class="recado erro">Falta rodar a migração 0030 no banco.</div>';
  if(PERM_MOD === 'docs' && !temDocsAcoes()) return topo + telaDocs();
  if(PERM_MOD === 'geral') return topo + telaGeral();
  var mod = PERM_MOD, ed = PODE.admin;
  var acoes = D.acoes.filter(function(a){ return a.modulo === mod && !(mod === 'docs' && temFolha() && /^folha_/.test(a.codigo)); })
                     .sort(function(a, b){ return (b.consulta ? 1 : 0) - (a.consulta ? 1 : 0) || a.ordem - b.ordem; });
  var nC = acoes.filter(function(a){ return a.consulta; }).length, nF = acoes.length - nC;
  var ativos = internosAtivos().sort(ordemPerfis);
  /* 28/09/2026: "Ver o módulo" é a primeira coluna — o mesmo que a caixa do módulo em Perfis */
  function entra(p){ return mod === 'docs' ? !!p.tipo_docs : temModulo(p.codigo, mod); }
  var comVer = docsPelaTabela();
  var com = comVer ? ativos : ativos.filter(function(p){ return temModulo(p.codigo, mod); });
  var sem_ = comVer ? [] : ativos.filter(function(p){ return !temModulo(p.codigo, mod); });
  var corpo = com.length ? '<div class="tabela-rolagem"><table class="perm acoes-tab"><thead>'
    + '<tr><th class="perfil" rowspan="2">Perfil</th>' + (comVer ? '<th class="acao" rowspan="2" title="Entra no módulo (vê o card no portal)">Ver o módulo</th>' : '')
    + (nC ? '<th class="grupo" colspan="' + nC + '">Só consulta</th>' : '') + (nF ? '<th class="grupo fazer" colspan="' + nF + '">Fazer</th>' : '') + '</tr>'
    + '<tr>' + acoes.map(function(a){ return '<th class="acao" title="' + esc(a.descricao) + '">' + esc(a.nome) + '</th>'; }).join('') + '</tr></thead><tbody>'
    + com.map(function(p){
        var tr = travado(p.codigo, mod);
        var dentro = entra(p) || tr;
        var travaVer = tr || !ed || (p.codigo === 'ti' && (mod === 'configuracoes' || mod === 'docs')) || (mod === 'folha' && !PODE.folha);
        return '<tr' + (tr ? ' class="travado"' : '') + '><td class="perfil"><b>' + esc(p.nome) + '</b><small>' + rotPessoas(qtdPessoas(p.codigo)) + (tr ? ' · tudo' : '') + '</small></td>'
          + (comVer ? '<td><input type="checkbox" ' + (mod === 'docs' ? 'data-docs-perfil="' + esc(p.codigo) + '"' : 'data-mod-perfil="' + esc(p.codigo) + '" data-mod="' + mod + '"')
              + (dentro ? ' checked' : '') + (travaVer ? ' disabled' : '') + ' aria-label="Ver o módulo — ' + esc(p.nome) + '"></td>' : '')
          + acoes.map(function(a){
              var base = mod === 'docs' && daBaseDocs(p.codigo, a.codigo);
              var folha = (mod === 'folha' || (mod === 'docs' && /^folha_/.test(a.codigo))) && !PODE.folha;
              var naoRecebe = mod === 'folha' && (a.codigo === 'editar' || a.codigo === 'importar') && !podeReceberFolha(p.codigo) && !temAcao(p.codigo, mod, a.codigo);
              var fora = comVer && !dentro;
              return '<td' + (base ? ' class="base" title="Vem da base (tipo no Docs). Para tirar, troque a base do perfil."' : '') + '><input type="checkbox" data-pa-perfil="' + esc(p.codigo) + '" data-pa-acao="' + esc(a.codigo) + '"'
                   + (tr || base || temAcao(p.codigo, mod, a.codigo) ? ' checked' : '') + (tr || base || !ed || folha || fora || naoRecebe ? ' disabled' : '')
                   + (folha && ed && !tr ? ' title="Folha interna: só a diretoria ou o DP marcam"' : naoRecebe && ed && !tr ? ' title="Só perfis da diretoria ou do DP recebem"' : fora && ed && !tr ? ' title="Marque Ver o módulo antes"' : '')
                   + ' aria-label="' + esc(a.nome) + ' — ' + esc(p.nome) + '"></td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>'
    : '<div class="lista"><div class="vazio">Nenhum perfil entra neste módulo. Ligue o módulo na aba Perfis.</div></div>';
  return topo
    + '<div class="dica" style="margin-top:14px">' + esc(NOTA_MOD[mod]) + '</div>'
    + corpo
    + (mod === 'docs' && !docsPelaTabela() ? '<h3 style="margin:22px 0 4px;font-size:15px;color:var(--azul)">As bases (tipo no Docs)</h3>' + telaDocs() : '')
    + (sem_.length ? '<div class="sub" style="margin-top:8px">Sem este módulo: ' + sem_.map(function(p){ return esc(p.nome); }).join(', ') + ' — ligue na aba Perfis.</div>' : '')
    + '<div class="legenda">' + acoes.map(function(a){
        return '<div><b>' + esc(a.nome) + '</b>' + (a.consulta ? ' <span class="chip cinza">só consulta</span>' : '') + '<br>' + esc(a.descricao) + '</div>'; }).join('') + '</div>';
}
/* Visão geral: cada perfil, em frases, em todos os módulos — um lugar só para consultar */
function telaGeral(){
  var l = internosAtivos().sort(ordemPerfis);
  return '<div class="dica" style="margin-top:14px">O que cada perfil vê e faz em todos os módulos, em frases. Para mudar: nas abas de cada módulo aqui ao lado (a primeira coluna, "Ver o módulo", é a entrada no módulo).</div>'
    + l.map(function(p){

          + resumoPerfil(p.codigo) + '</div>';
      }).join('');
}
/* Docs: as regras são do Docs; aqui só se vê o tipo de cada perfil */
function telaDocs(){
  var ativos = internosAtivos();
  function usam(t){ return ativos.filter(function(p){ return (p.tipo_docs || '') === t; }).map(function(p){ return esc(p.nome); }).join(', ') || '<span class="trava">—</span>'; }
  return '<div class="dica" style="margin-top:14px">No Docs vale o <b>tipo no Docs</b> de cada perfil — as regras de dentro do Docs não mudam por aqui. Para mudar o que um perfil faz no Docs, troque o tipo dele na aba Perfis.</div>'
    + '<div class="tabela-rolagem"><table class="perm docs-tab"><thead><tr><th class="perfil">Tipo no Docs</th><th>O que faz no Docs</th><th>Perfis que usam</th></tr></thead><tbody>'
    + TIPOS_DOCS.map(function(t){
        return '<tr><td class="perfil"><b>' + esc(t[1]) + '</b>' + (TIPOS_FOLHA.indexOf(t[0]) >= 0 ? '<small>vê a folha interna</small>' : '') + '</td>'
             + '<td class="txt">' + esc(t[2]) + '</td><td class="txt">' + usam(t[0]) + '</td></tr>'; }).join('')
    + '<tr><td class="perfil"><b>Sem Docs</b></td><td class="txt">Não entra no Docs.</td><td class="txt">' + usam('') + '</td></tr>'
    + '</tbody></table></div>';
}

$('conteudo').addEventListener('change', function(e){
  var t = e.target;
  if(t.hasAttribute('data-ver-inativos')){ VER_INATIVOS = t.checked; return desenhar(); }
  if(t.hasAttribute('data-pa-acao')){
    var pf = t.getAttribute('data-pa-perfil');
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return grava('definir_permissao', { p_perfil: pf, p_modulo: PERM_MOD, p_acao: t.getAttribute('data-pa-acao'), p_ligado: t.checked },
                 'Permissão de ' + perfilNome(pf) + ' atualizada.');
  }
  if(t.hasAttribute('data-mod')){
    var pm = t.getAttribute('data-mod-perfil');
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return grava('definir_modulo', { p_perfil: pm, p_modulo: t.getAttribute('data-mod'), p_ligado: t.checked },
                 'Módulos de ' + perfilNome(pm) + ' atualizados.');
  }
  if(t.hasAttribute('data-docs-perfil')){
    var pd = perfilDe(t.getAttribute('data-docs-perfil')); if(!pd) return;
    var nd = qtdPessoas(pd.codigo, true);
    if(!t.checked && nd && !confirm('Tirar o Docs deste perfil tira do Docs as ' + rotPessoas(nd) + ' dele. Continuar?')){ t.checked = true; return; }
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    /* 0040: entrar no Docs é só ligar; o que ele faz lá são as caixas de Permissões › Docs */
    return grava('salvar_perfil', { p_codigo: pd.codigo, p_nome: pd.nome, p_descricao: pd.descricao || '', p_tipo_docs: t.checked ? 'engenheiro' : null, p_ativo: pd.ativo },
                 t.checked ? pd.nome + ' agora entra no Docs. Marque o que ele faz em Permissões › Docs.' : pd.nome + ' não entra mais no Docs.');
  }
  if(t.hasAttribute('data-tipo-docs')){
    var p = perfilDe(t.getAttribute('data-tipo-docs')); if(!p) return;
    var n = qtdPessoas(p.codigo, true);
    if(n && !confirm('Mudar o tipo no Docs muda o que as ' + rotPessoas(n) + ' deste perfil fazem no Docs. Continuar?')){ t.value = p.tipo_docs || ''; return; }
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return grava('salvar_perfil', { p_codigo: p.codigo, p_nome: p.nome, p_descricao: p.descricao || '', p_tipo_docs: t.value || null, p_ativo: p.ativo },
                 'Tipo no Docs de ' + p.nome + ' atualizado.');
  }
});
function grava(fn, args, msg){
  return sb.schema('core').rpc(fn, args).then(ok)
    .then(function(){ aviso(msg); return recarregar(); })
    .catch(function(err){
      var m = msgErro(err);
      if(/Could not find the function|does not exist/i.test(m)) m = 'Falta rodar a migração 0030 no banco.';
      aviso(m, true); recarregar();
    });
}

function telaConstrutora(){
  if(D.construtoraFalta) return cabecalho('Construtora', 'Dados cadastrais da construtora.')
    + '<div class="recado erro">A tabela da construtora ainda não existe neste banco (migração 0024).</div>';
  var c = D.construtora || {}, ed = PODE.construtora;
  function cp(rot, k, tipo, inteiro, extra){
    var v = c[k] || '';
    if(k === 'cnpj') v = fmtCnpj(v);
    if(k === 'cep' && v.length === 8) v = v.slice(0, 5) + '-' + v.slice(5);
    return campo(rot, ed ? '<input type="' + (tipo || 'text') + '" id="c-' + k + '" value="' + esc(v) + '"' + (extra || '') + '>'
                         : '<div class="leitura">' + esc(v || '—') + '</div>', inteiro);
  }
  return cabecalho('Construtora', 'Dados cadastrais da empresa que usa o BeMer.' + (ed ? '' : ' Seu perfil só consulta.'))
    + '<div class="cartao" style="margin-top:14px"><div class="grade">'

    + cp('CNPJ', 'cnpj', 'text', false, ' inputmode="numeric" placeholder="00.000.000/0000-00"')
    + cp('Inscrição estadual', 'inscricao_estadual') + cp('Inscrição municipal', 'inscricao_municipal')
    + cp('Endereço', 'endereco', 'text', true) + cp('Cidade', 'cidade')
    + '<div class="grade" style="padding:0;grid-template-columns:90px minmax(0,1fr)">' + cp('UF', 'uf', 'text', false, ' maxlength="2"') + cp('CEP', 'cep', 'text', false, ' inputmode="numeric"') + '</div>'
    + cp('Telefone', 'telefone', 'tel') + cp('E-mail', 'email', 'email') + cp('Site', 'site', 'text', true)
    + '</div>' + (ed ? '<div class="acoes"><button class="botao" data-acao="salvar-construtora">Salvar</button></div>' : '')
    + '<div id="c-recado"></div></div>';
}
function salvarConstrutora(btn){
  var k = ['razao_social','nome_fantasia','cnpj','inscricao_estadual','inscricao_municipal','endereco','cidade','uf','cep','telefone','email','site'];
  var d = { id: true };
  k.forEach(function(x){ d[x] = $('c-' + x).value.trim(); });
  d.cnpj = soDigitos(d.cnpj); d.cep = soDigitos(d.cep); d.uf = d.uf.toUpperCase();
  var r = $('c-recado');
  function erro(m){ r.innerHTML = '<div class="recado erro">' + esc(m) + '</div>'; }
  if(d.cnpj && !cnpjValido(d.cnpj)) return erro('CNPJ inválido (confira os 14 dígitos).');
  if(d.cep && d.cep.length !== 8) return erro('CEP tem 8 dígitos.');
  if(d.uf && !/^[A-Z]{2}$/.test(d.uf)) return erro('UF são 2 letras (ex.: SP).');
  btn.disabled = true;
  core('construtora').upsert(d, { onConflict: 'id' }).then(ok)
    .then(function(){ aviso('Dados da construtora salvos.'); return recarregar(); })
    .catch(function(e){ erro(msgErro(e)); btn.disabled = false; });
}

/* ---------------------------------------------------------------------
   Modal genérico: salvar() devolve promessa (ou lança erro de validação)
   --------------------------------------------------------------------- */
function campo(rot, html, inteiro){
  return '<div' + (inteiro ? ' class="inteiro"' : '') + '>' + (rot ? '<label class="rot">' + esc(rot) + '</label>' : '') + html + '</div>';
}
function modal(titulo, corpo, salvar, rotulo){
  fecharModal();
  var f = document.createElement('div');
  f.className = 'fundo-modal'; f.id = 'modal';
  f.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">'
    + '<button class="fechar" type="button" aria-label="Fechar">&times;</button><h2>' + esc(titulo) + '</h2>' + corpo
    + '<div id="m-recado"></div><div class="acoes">'
    + (salvar ? '<button class="botao sec" type="button" data-m="cancelar">Cancelar</button><button class="botao" type="button" data-m="salvar">' + esc(rotulo || 'Salvar') + '</button>'
              : '<button class="botao sec" type="button" data-m="cancelar">Fechar</button>')
    + '</div></div>';
  document.body.appendChild(f);
  document.body.style.overflow = 'hidden';
  var fechar = function(){ if(!f.hasAttribute('data-salvando')) fecharModal(); };   // gravando: espera
  /* o ← do celular fecha o modal; gravando, ele fica e o passo volta */
  var peloVoltar = function(){ f._camada = null; if(f.hasAttribute('data-salvando')) f._camada = Volta.abrir('modal', peloVoltar); else fecharModal(); };
  f._camada = Volta.abrir('modal', peloVoltar);
  f.querySelector('.fechar').addEventListener('click', fechar);
  f.querySelector('[data-m="cancelar"]').addEventListener('click', fechar);
  /* filtro das caixas de marcar */
  f.querySelectorAll('[data-filtra]').forEach(function(i){
    i.addEventListener('input', function(){
      var b = sem(i.value);
      $(i.getAttribute('data-filtra')).querySelectorAll('.marcar').forEach(function(l){
        l.style.display = !b || l.getAttribute('data-texto').indexOf(b) >= 0 ? '' : 'none'; });
    });
  });
  var bs = f.querySelector('[data-m="salvar"]');
  if(bs) bs.addEventListener('click', function(){
    var rec = f.querySelector('#m-recado'); rec.innerHTML = '';
    var p;
    try { p = Promise.resolve(salvar(bs)); } catch(e){ rec.innerHTML = '<div class="recado erro">' + esc(e.message) + '</div>'; return; }
    bs.disabled = true; bs.textContent = 'Salvando…'; f.setAttribute('data-salvando', '1');
    p.then(function(res){
       f.removeAttribute('data-salvando');
       if(res && res.ficar){
         /* deu certo, mas há um recado que a pessoa precisa ler (ex.: o e-mail
            de senha não saiu): o modal fica aberto, sem "repetir" (daria 409) */
         rec.innerHTML = '<div class="recado erro">' + esc(res.ficar) + '</div>';
         bs.remove();
         var c = f.querySelector('[data-m="cancelar"]'); if(c) c.textContent = 'Fechar';
         return recarregar();
       }
       if($('modal') === f) fecharModal();
       if(res && res.erro) aviso(res.erro, true); else aviso(typeof res === 'string' ? res : 'Salvo.');
       return recarregar();
     })
     .catch(function(e){
       f.removeAttribute('data-salvando');
       if($('modal') === f){ rec.innerHTML = '<div class="recado erro">' + esc(msgErro(e)) + '</div>'; bs.disabled = false; bs.textContent = rotulo || 'Salvar'; }
       else aviso(msgErro(e), true);
       recarregar();   // parte pode ter gravado (ex.: dados sim, vínculos não)
     });
  });
  var pri = f.querySelector('input:not([disabled]):not([type=checkbox]):not([type=search]),select:not([disabled])');
  if(pri && window.innerWidth > 600) pri.focus();
}
function fecharModal(){
  var m = $('modal'); if(!m) return;
  m.remove(); document.body.style.overflow = '';
  var c = m._camada; m._camada = null; Volta.fechou(c);
}
document.addEventListener('keydown', function(e){ var m = $('modal'); if(e.key === 'Escape' && m && !m.hasAttribute('data-salvando')) fecharModal(); });
function segmento(id, aoMudar){
  var s = $(id); if(!s) return;
  s.addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]'); if(!b || b.disabled) return;
    s.setAttribute('data-v', b.getAttribute('data-v'));
    s.querySelectorAll('button').forEach(function(x){ x.classList.toggle('ativo', x === b); });
    if(aoMudar) aoMudar(b.getAttribute('data-v'));
  });
}

/* ---------- aviso de nova versão (mesmo padrão do portal e dos módulos) ---------- */
(function(){
  var avisando = false, emVoo = false;
  function conferir(){
    if(avisando || emVoo || document.hidden) return;
    emVoo = true;
    fetch('version.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if(!v || !v.versao || v.versao === APP_VERSION || avisando) return;
        avisando = true;
        var f = document.createElement('div');
        f.className = 'faixa-atualizar'; f.setAttribute('role', 'status');
        f.innerHTML = '<span>Nova versão dos Cadastros disponível</span><button type="button">Atualizar agora</button>';
        document.body.appendChild(f);
        f.querySelector('button').addEventListener('click', function(){ location.reload(); });
      })
      .catch(function(){})
      .then(function(){ emVoo = false; });
  }
  setInterval(conferir, 120000);
  document.addEventListener('visibilitychange', conferir);
  setTimeout(conferir, 8000);
})();
</script>
</body>
