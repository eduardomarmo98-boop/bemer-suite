<style>
/* Cadastros da construtora (24/09/2026). Decisão do Saurin: pessoas, obras,
   empresas, setores e os dados da construtora moram AQUI — os módulos só
   consomem. Mesma identidade do portal: laranja nunca em texto sobre branco. */
:root{
  --azul:#00296B; --azul-escuro:#001B4D; --laranja:#FE9400; --laranja-claro:#FFF1DC;
  --texto:#0F1B2D; --texto2:#4F5B6D; --borda:#E3E7ED; --borda-forte:#C9D1DD;
  --fundo:#F5F7FA; --branco:#fff; --campo:#F7F9FC;
  --erro-fundo:#FDECEB; --erro:#9B1C14; --ok-fundo:#E7F5EC; --ok:#1B5E34;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:Poppins,system-ui,sans-serif;background:var(--fundo);color:var(--texto);
     -webkit-font-smoothing:antialiased;font-size:14px}
.oculto{display:none!important}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}

/* ---- cabeçalho padrão dos módulos ---- */
header.topo{background:#fff;display:flex;align-items:center;gap:10px;padding:9px 16px;
  padding-top:calc(9px + env(safe-area-inset-top));border-bottom:3px solid var(--laranja);
  box-shadow:0 2px 8px rgba(0,20,60,.08);position:sticky;top:0;z-index:40}
.marca{display:flex;align-items:center;gap:7px;text-decoration:none;min-height:36px}
.marca img{height:26px;width:auto;display:block}
.palavra{font-size:18px;font-weight:700;letter-spacing:-.4px;line-height:1}
.palavra .be{color:var(--azul)} .palavra .mer{color:var(--laranja)}
.fio{width:1px;height:26px;background:var(--borda)}
.modulo{display:flex;align-items:center;gap:7px;font-weight:600;color:var(--azul);font-size:15px;min-width:0}
.tile{width:28px;height:28px;border-radius:8px;background:var(--azul);color:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.direita{margin-left:auto;display:flex;gap:6px;align-items:center}
.btn-topo{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--borda-forte);color:var(--azul);
  border-radius:9px;height:36px;padding:0 12px;cursor:pointer;text-decoration:none;font-weight:600}
.btn-topo.so-icone{border:0;padding:0;width:36px;justify-content:center}
@media (max-width:520px){ .fio,.btn-topo .txt{display:none} .btn-topo{padding:0 9px} header.topo{padding-left:12px;padding-right:12px} }
@media (max-width:360px){ .palavra{display:none} }

/* ---- abas ---- */
nav.abas{background:#fff;border-bottom:1px solid var(--borda);position:sticky;top:calc(57px + env(safe-area-inset-top));z-index:30}
nav.abas .trilho{max-width:1100px;margin:0 auto;display:flex;gap:4px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.abas .trilho::-webkit-scrollbar{display:none}
nav.abas button{background:none;border:0;border-bottom:3px solid transparent;padding:13px 12px 10px;cursor:pointer;
  color:var(--texto2);font-weight:600;white-space:nowrap;min-height:46px}
nav.abas button.ativa{color:var(--azul);border-bottom-color:var(--laranja)}
nav.abas .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--fundo);color:var(--texto2);font-size:11px;margin-left:4px}

main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:20px;color:var(--azul);font-weight:700}
.sub{color:var(--texto2);font-size:13px;margin-top:2px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 12px}
.barra .busca{flex:1 1 220px;min-width:0}
input[type=text],input[type=email],input[type=search],input[type=number],input[type=tel],select,textarea{
  width:100%;background:var(--campo);border:1px solid var(--borda-forte);border-radius:9px;padding:9px 11px;min-height:40px}
select{padding-right:28px}
.barra select{width:auto;flex:0 0 auto}
@media (max-width:760px){ input,select,textarea{font-size:16px!important} }  /* sem zoom no iPhone */
.botao{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:0 16px;min-height:40px;font-weight:600;cursor:pointer;white-space:nowrap}
.botao.sec{background:#fff;color:var(--azul);border:1px solid var(--borda-forte)}
.botao.perigo{background:#fff;color:var(--erro);border:1px solid #E7B4AF}
.botao:disabled{opacity:.55;cursor:default}

/* ---- lista ---- */
.lista{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow:hidden}
.linha{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--borda);cursor:pointer;background:#fff;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.linha:first-child{border-top:0}
.linha:hover{background:#F9FAFC}
.linha.inativa .nome{color:var(--texto2)}
.av{width:36px;height:36px;border-radius:50%;background:#E8EEF8;color:var(--azul);display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto}
.corpo{flex:1 1 auto;min-width:0}
.nome{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.det{color:var(--texto2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 0 auto;max-width:45%}
.chip{font-size:11px;font-weight:600;border-radius:20px;padding:3px 9px;background:#EEF2F9;color:var(--azul);white-space:nowrap}
.chip.laranja{background:var(--laranja-claro);color:#6B3F00}
.chip.cinza{background:#EEF0F3;color:var(--texto2)}
@media (max-width:600px){ .chips{display:none} .linha .chips-mob{display:flex} }
.chips-mob{display:none;gap:5px;flex-wrap:wrap;margin-top:4px}
.vazio{padding:28px 16px;text-align:center;color:var(--texto2)}
.dica{background:#fff;border:1px dashed var(--borda-forte);border-radius:10px;padding:10px 12px;color:var(--texto2);font-size:12.5px;margin-bottom:12px}

/* ---- setores ---- */
.setor{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--borda)}
.setor:first-child{border-top:0}
.setor .nome{flex:1 1 auto}
.setor input[type=number]{width:80px;flex:0 0 auto}

/* ---- permissões ---- */
.tabela-rolagem{background:#fff;border:1px solid var(--borda);border-radius:12px;overflow-x:auto}
table.perm{border-collapse:collapse;width:100%;min-width:640px}
table.perm th,table.perm td{padding:10px 12px;border-top:1px solid var(--borda);text-align:center;vertical-align:middle}
table.perm thead th{border-top:0;font-size:12px;color:var(--texto2);font-weight:600;background:#FAFBFD}
table.perm th.perfil,table.perm td.perfil{text-align:left;position:sticky;left:0;background:#fff;min-width:170px;box-shadow:1px 0 0 var(--borda)}
table.perm thead th.perfil{background:#FAFBFD}
table.perm td.perfil b{display:block;font-weight:600}
table.perm td.perfil small{color:var(--texto2);font-size:11.5px}
table.perm tr.travado td{background:#FAFBFD}
table.perm input[type=checkbox]{width:20px;height:20px;accent-color:var(--azul);cursor:pointer}
table.perm select{min-width:170px;width:auto}
table.perm .trava{font-size:11px;color:var(--texto2)}
@media (max-width:600px){
  table.perm th.perfil,table.perm td.perfil{min-width:118px;max-width:130px}
  table.perm select{min-width:0;max-width:150px}
  table.perm{min-width:0}
}

/* ---- formulário ---- */
.cartao{background:#fff;border:1px solid var(--borda);border-radius:12px;padding:18px}
.grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grade .inteiro{grid-column:1/-1}
@media (max-width:600px){ .grade{grid-template-columns:minmax(0,1fr)} }
label.rot{display:block;font-size:12px;font-weight:600;color:var(--texto2);margin-bottom:4px}
.leitura{padding:9px 0;min-height:40px}
.marcar{display:flex;align-items:center;gap:8px;min-height:40px;cursor:pointer}
.marcar input{width:18px;height:18px;accent-color:var(--azul)}
.recado{border-radius:9px;padding:10px 12px;font-size:13px;margin-top:12px}
.recado.erro{background:var(--erro-fundo);color:var(--erro)}
.recado.ok{background:var(--ok-fundo);color:var(--ok)}
.caixa-marcar{border:1px solid var(--borda-forte);border-radius:9px;background:var(--campo);max-height:220px;overflow:auto;padding:4px 10px}
.caixa-marcar .marcar{min-height:34px;font-size:13px}
.seg{display:flex;border:1px solid var(--borda-forte);border-radius:9px;overflow:hidden}
.seg button{flex:1;background:#fff;border:0;padding:9px 10px;cursor:pointer;min-height:40px;font-weight:600;color:var(--texto2)}
.seg button.ativo{background:var(--azul);color:#fff}

/* ---- modal ---- */
.fundo-modal{position:fixed;inset:0;background:rgba(0,15,40,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:14px;width:100%;max-width:640px;padding:20px;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h2{font-size:17px;color:var(--azul);margin-bottom:14px;padding-right:44px}
.fechar{position:absolute;top:10px;right:10px;width:44px;height:44px;border:0;background:none;font-size:26px;color:var(--texto2);cursor:pointer;border-radius:9px}
.acoes{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
@media (max-width:600px){
  .fundo-modal{padding:0;align-items:flex-end}
  .modal{border-radius:14px 14px 0 0;max-height:94svh;overflow:auto;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .acoes .botao{flex:1}
}

.aviso-flut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom));z-index:99;
  background:var(--azul);color:#fff;border-radius:10px;padding:10px 16px;max-width:92%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.aviso-flut.erro{background:var(--erro)}
.faixa-atualizar{position:fixed;left:0;right:0;top:0;z-index:55;background:var(--laranja);color:var(--azul);
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:700}
.faixa-atualizar button{background:var(--azul);color:#fff;border:0;border-radius:9px;padding:8px 14px;cursor:pointer;min-height:40px;font-weight:600}
.carregando{padding:60px 16px;text-align:center;color:var(--texto2)}
.rodape{text-align:center;color:var(--texto2);font-size:11px;padding:10px 0 24px}
</style>
</head>

<script>
/* ===================================================================== */
var SUPABASE_URL      = 'https://cupdrskggjmhbzdxiume.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1cGRyc2tnZ2ptaGJ6ZHhpdW1lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4MzM2MzcsImV4cCI6MjEwNTQwOTYzN30.EchdNikIkzkUjxuHWxUlyN0Sl_eO4NUrxni3UcQtB7g';

var APP_VERSION = '2026.09.25.3';

/* Edge function que cria o acesso (auth + core.pessoas + e-mail de senha).
   Vai ser RENOMEADA antes do passo 8 da virada (o Docs em produção tem uma
   de mesmo nome) — é só trocar aqui. */
var FUNCAO_CRIAR_PESSOA = 'criar-usuario';
/* Domínio do e-mail de colaborador — é da construtora cliente, não do BeMer. */
var DOMINIO_EMAIL = '@brandaoemarmo.com.br';
/* ===================================================================== */

var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
function core(t){ return sb.schema('core').from(t); }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function sem(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase(); }
function inicial(n){ return (String(n||'?').trim().charAt(0) || '?').toUpperCase(); }
function soDigitos(s){ return String(s||'').replace(/\D/g,''); }
function fmtCnpj(c){ c = soDigitos(c); return c.length === 14 ? c.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5') : c; }
function cnpjValido(c){
  c = soDigitos(c);
  if(!/^\d{14}$/.test(c) || /^(\d)\1{13}$/.test(c)) return false;
  function dv(n){ var p = n === 12 ? [5,4,3,2,9,8,7,6,5,4,3,2] : [6,5,4,3,2,9,8,7,6,5,4,3,2], s = 0;
    for(var i=0;i<n;i++) s += +c[i] * p[i]; return s % 11 < 2 ? 0 : 11 - s % 11; }
  return dv(12) === +c[12] && dv(13) === +c[13];
}
function aviso(msg, erro){
  var a = document.createElement('div'); a.className = 'aviso-flut' + (erro ? ' erro' : ''); a.textContent = msg;
  document.body.appendChild(a); setTimeout(function(){ a.remove(); }, erro ? Math.max(5000, msg.length * 60) : 2600);
}
/* erro do Supabase em português, sem o jargão */
function msgErro(e){
  var m = (e && (e.message || e.error_description)) || String(e || 'erro desconhecido');
  if(/duplicate key.*cnpj|empresas_cnpj_key/i.test(m)) return 'Já existe uma empresa com esse CNPJ.';
  if(/empresas_cnpj_digito|cnpj_valido/i.test(m)) return 'CNPJ inválido (confira os dígitos).';
  if(/duplicate key.*setores|setores_pkey/i.test(m)) return 'Já existe um setor com esse nome.';
  if(/row-level security|permission denied/i.test(m)) return 'Seu perfil não pode fazer essa alteração.';
  if(/Failed to fetch|NetworkError/i.test(m)) return 'Sem conexão. Confira a internet e tente de novo.';
  return m;
}
function ok(r){ if(r && r.error) throw r.error; return r; }

$('rodape').textContent = 'BeMer · Cadastros · v' + APP_VERSION + (AMBIENTE ? ' · ' + AMBIENTE : '');
$('btn-sair').addEventListener('click', function(){ sb.auth.signOut().then(function(){ location.replace('../'); }); });

/* ---------------------------------------------------------------------
   Estado
   --------------------------------------------------------------------- */
var EU = null;
var PODE = { admin:false, pessoas:false, empresas:false, folha:false };
var D = { pessoas:[], perfis:[], setores:[], obras:[], empresas:[], pessoaObras:[], empresaObras:[], construtora:null, perfilModulos:[], nivelPatrimonio:[] };
var ABA = 'pessoas';
var F = { pessoas:{ busca:'', sit:'ativos', tipo:'' } };

function perfilNome(c){ var p = D.perfis.find(function(x){ return x.codigo === c; }); return p ? p.nome : (c || '—'); }
function empresaNome(id){ var e = D.empresas.find(function(x){ return x.id === id; }); return e ? (e.nome_fantasia || e.razao_social) : '—'; }
function obrasDaPessoa(id){ return D.pessoaObras.filter(function(x){ return x.pessoa_id === id; }).map(function(x){ return x.obra_id; }); }

/* ---------------------------------------------------------------------
   Entrada: quem autentica é o portal
   --------------------------------------------------------------------- */
sb.auth.getSession().then(function(s){
  var sessao = s.data && s.data.session;
  if(!sessao) return location.replace('../');
  return core('pessoas').select('id,nome,perfil,tipo,ativo').eq('id', sessao.user.id).maybeSingle()
    .then(function(r){
      ok(r);
      if(!r.data || !r.data.ativo || r.data.tipo !== 'colaborador') return location.replace('../');
      EU = r.data;
      return core('perfil_modulos').select('modulo').eq('perfil', EU.perfil).eq('modulo', 'configuracoes')
        .then(function(pm){
          if(pm && !pm.error && Array.isArray(pm.data) && pm.data.length === 0){
            $('conteudo').innerHTML = '<div class="cartao" style="margin-top:20px"><h1>Sem acesso aos Cadastros</h1>'
              + '<p class="sub" style="margin-top:6px">Seu perfil não tem os Cadastros liberados. Se precisar, peça à diretoria ou à TI.</p>'
              + '<p style="margin-top:14px"><a href="../">Voltar ao portal</a></p></div>';
            return null;
          }
          return capacidades();
        }, capacidades);
    })
    .then(function(v){
      if(!v) return;
      PODE = { admin:v[0], pessoas:v[1], empresas:v[2], folha:v[3], gere:v[4] };   // gere nulo = 0028 ainda não rodou
      if(!PODE.pessoas) ABA = 'setores';
      return recarregar();
    });
}).catch(function(e){
  $('conteudo').innerHTML = '<div class="recado erro">Não foi possível carregar: ' + esc(msgErro(e)) + '</div>';
});
function capacidades(){
      function f(n){ return sb.schema('core').rpc(n).then(function(x){ return !x.error && x.data === true; }, function(){ return false; }); }
      return Promise.all([f('eh_admin'), f('pode_gerenciar_pessoas'), f('pode_cadastrar_empresa'), f('pode_conceder_folha'),
        sb.schema('core').rpc('perfis_que_gere', { p_ator: EU.perfil })
          .then(function(x){ return !x.error && Array.isArray(x.data) ? x.data : null; }, function(){ return null; })]);
}

var RECARGA = 0;
function recarregar(){
  var minha = ++RECARGA;   // uma recarga antiga que termina depois não sobrescreve a nova
  var pedidos = [
    core('perfis').select('codigo,nome,eh_externo,ativo').order('nome'),
    core('setores').select('nome,ordem,ativo').order('ordem').order('nome'),
    core('obras').select('id,nome,cno,ativa').order('nome'),
    core('empresas').select('id,cnpj,razao_social,nome_fantasia,ativa').order('razao_social'),
    Promise.resolve({ data: [] }),   // era a empresa_obras (saiu com a aba Empresas)
    core('construtora').select('*').maybeSingle(),
    PODE.pessoas ? core('pessoas').select('id,nome,email,tipo,perfil,setor,cargo,empresa_id,ativo,whatsapp,avisa_whatsapp').order('nome')
                 : Promise.resolve({ data: [] }),
    PODE.pessoas ? core('pessoa_obras').select('pessoa_id,obra_id') : Promise.resolve({ data: [] }),
    PODE.admin ? core('perfil_modulos').select('perfil,modulo') : Promise.resolve({ data: [] }),
    PODE.admin ? sb.schema('patrimonio').from('permissoes').select('perfil,nivel') : Promise.resolve({ data: [] }),
    PODE.admin ? core('niveis').select('modulo,codigo,nome,ordem,travado').order('ordem') : Promise.resolve({ data: [] }),
    PODE.admin ? core('acoes').select('modulo,codigo,nome,ordem').order('ordem') : Promise.resolve({ data: [] }),
    PODE.admin ? core('nivel_acoes').select('modulo,nivel,acao') : Promise.resolve({ data: [] }),
    PODE.admin ? sb.schema('flow').from('permissoes').select('perfil,nivel') : Promise.resolve({ data: [] })
  ];
  return Promise.all(pedidos).then(function(rs){
    if(minha !== RECARGA) return;
    rs.forEach(function(r, i){ if(r.error && i !== 5 && i < 9) throw r.error; });   // 9+ = 0025/0026 podem faltar
    D.perfis = rs[0].data || []; D.setores = rs[1].data || []; D.obras = rs[2].data || [];
    D.empresas = rs[3].data || []; D.empresaObras = rs[4].data || [];
    D.construtora = rs[5].error ? null : (rs[5].data || null);
    D.construtoraFalta = !!rs[5].error;   // 0024 ainda não rodada
    D.pessoas = rs[6].data || []; D.pessoaObras = rs[7].data || [];
    D.perfilModulos = rs[8].data || []; D.nivelPatrimonio = rs[9].data || [];
    D.niveis = rs[10].data || []; D.acoes = rs[11].data || []; D.nivelAcoes = rs[12].data || []; D.nivelFlow = rs[13].data || [];
    D.falta0026 = !!(rs[10].error || rs[11].error || rs[12].error || rs[13].error);
    desenhar();
  }).catch(function(e){
    $('conteudo').innerHTML = '<div class="recado erro">Não foi possível carregar: ' + esc(msgErro(e)) + '</div>';
  });
}

function abas(){
  var l = [];
  if(PODE.pessoas) l.push(['pessoas', 'Pessoas', D.pessoas.filter(function(p){ return p.ativo; }).length]);
  /* Obras e Empresas NÃO se cadastram aqui (decisão do Saurin, 24/09/2026):
     a empresa nasce no Docs (é lá que ela acessa e manda documentação) e a
     obra em cada sistema que precisa dela, de forma apartada. Aqui só se
     usam as listas: quais obras uma pessoa vê e de que empresa é o externo. */
  l.push(['setores', 'Setores', D.setores.filter(function(s){ return s.ativo; }).length]);
  l.push(['construtora', 'Construtora', null]);
  if(PODE.admin) l.push(['permissoes', 'Permissões', null]);
  return l;
}
function desenhar(){
  var l = abas();
  $('abas').classList.remove('oculto');
  $('trilho').innerHTML = l.map(function(a){
    return '<button type="button" data-aba="' + a[0] + '" class="' + (ABA === a[0] ? 'ativa' : '') + '">' + esc(a[1])
         + (a[2] != null ? '<span class="n">' + a[2] + '</span>' : '') + '</button>';
  }).join('');
  var fn = { pessoas:telaPessoas, setores:telaSetores, construtora:telaConstrutora, permissoes:telaPermissoes }[ABA];
  var foco = seletorDoFoco();
  $('conteudo').innerHTML = fn();
  if(!foco && FOCO_PENDENTE && (!document.activeElement || document.activeElement === document.body)) foco = FOCO_PENDENTE;
  FOCO_PENDENTE = null;
  if(foco){ try { var el = $('conteudo').querySelector(foco); if(el) el.focus({ preventScroll: true }); } catch(e){} }
  ligar();
}
$('trilho').addEventListener('click', function(e){
  var b = e.target.closest('[data-aba]'); if(!b) return;
  ABA = b.getAttribute('data-aba'); desenhar(); window.scrollTo(0, 0);
});

/* os filtros redesenham só a lista (a busca não perde o foco) */
function ligar(){
  document.querySelectorAll('[data-filtro]').forEach(function(el){
    el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', function(){
      var k = el.getAttribute('data-filtro').split('.');
      F[k[0]][k[1]] = el.value;
      var alvo = $('lista-' + k[0]);
      if(alvo) alvo.innerHTML = ({ pessoas:listaPessoas })[k[0]]();
    });
  });
}
$('conteudo').addEventListener('click', function(e){
  var b = e.target.closest('[data-acao]'); if(!b) return;
  var a = b.getAttribute('data-acao'), id = b.getAttribute('data-id');
  if(a === 'pessoa')      abrirPessoa(id);
  if(a === 'nova-pessoa') novaPessoa();
  if(a === 'novo-setor')  novoSetor();
  if(a === 'perm-vista')  { PERM_VISTA = id; desenhar(); }
  if(a === 'salvar-construtora') salvarConstrutora(b);
});

/* identifica o controle com foco pelos data-* (sobrevive ao redesenho). O
   controle é desabilitado antes de gravar e o navegador tira o foco dele —
   por isso quem grava guarda o seletor em FOCO_PENDENTE antes. */
var FOCO_PENDENTE = null;
function seletorDoFoco(){
  var a = document.activeElement;
  if(!a || !$('conteudo').contains(a)) return null;
  var chaves = ['data-perm','data-m','data-patr-liga','data-flow-nivel','data-na-mod','data-na-nivel','data-na-acao','data-ordem','data-setor-ativo','data-filtro','data-acao','data-id'];
  var partes = chaves.filter(function(k){ return a.hasAttribute(k); })
                     .map(function(k){ return '[' + k + '="' + String(a.getAttribute(k)).replace(/["\\]/g, '\\$&').replace(/[\n\r\f]/g, function(c){ return '\\' + c.charCodeAt(0).toString(16) + ' '; }) + '"]'; });
  return partes.length ? a.tagName.toLowerCase() + partes.join('') : null;
}
function cabecalho(titulo, sub, botao){
  return '<div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;justify-content:space-between">'
       +   '<div><h1>' + titulo + '</h1><div class="sub">' + sub + '</div></div>' + (botao || '') + '</div>';
}
function selSit(chave, valor, opcoes){
  return '<select data-filtro="' + chave + '" aria-label="Situação">' + opcoes.map(function(o){
    return '<option value="' + o[0] + '"' + (valor === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select>';
}

function listaPessoas(){
  var b = sem(F.pessoas.busca);

    if(F.pessoas.sit === 'ativos' && !p.ativo) return false;

    if(F.pessoas.tipo && p.tipo !== F.pessoas.tipo) return false;
    return !b || sem([p.nome, p.email, p.setor, p.cargo, perfilNome(p.perfil)].join(' ')).indexOf(b) >= 0;
  });

         +     '<div class="det">' + esc(p.email) + (p.cargo ? ' · ' + esc(p.cargo) : '') + '</div>'
         +     '<div class="chips-mob">' + ch + '</div></span>'
         +   '<span class="chips">' + ch + '</span></button>';
  }).join('');
}

/* Que perfis eu posso dar (espelha a regra do banco — 0004/0024 e a edge) */
/* no alcance da matriz? (sem a 0028: não restringe aqui; o banco confere) */
function noAlcance(perfil){ return PODE.admin || !PODE.gere || PODE.gere.indexOf(perfil) >= 0; }
function perfisQuePossoDar(tipo, atual){
  return D.perfis.filter(function(p){
    if(p.codigo === atual) return true;
    if(!noAlcance(p.codigo)) return false;
    if(!p.ativo) return false;
    if(tipo === 'externo') return p.codigo === 'fornecedor';
    if(p.eh_externo) return false;
    if((p.codigo === 'diretoria' || p.codigo === 'ti') && !PODE.admin) return false;
    if((p.codigo === 'diretoria' || p.codigo === 'dp') && !PODE.folha) return false;
    return true;
  });
}
function opcoesSetor(atual){
  return '<option value="">— sem setor —</option>' + D.setores.filter(function(s){ return s.ativo || s.nome === atual; })
    .map(function(s){ return '<option value="' + esc(s.nome) + '"' + (s.nome === atual ? ' selected' : '') + '>' + esc(s.nome) + '</option>'; }).join('');
}
function caixaMarcar(id, itens, marcados, editavel){
  if(!itens.length) return '<div class="leitura sub">Nenhuma cadastrada.</div>';
  return '<input type="search" placeholder="Filtrar" data-filtra="' + id + '" style="margin-bottom:6px"' + (itens.length < 8 ? ' class="oculto"' : '') + '>'
    + '<div class="caixa-marcar" id="' + id + '">' + itens.map(function(it){
      return '<label class="marcar" data-texto="' + esc(sem(it.nome)) + '"><input type="checkbox" value="' + esc(it.id) + '"'
           + (marcados.indexOf(it.id) >= 0 ? ' checked' : '') + (editavel ? '' : ' disabled') + '> ' + esc(it.nome) + '</label>';
    }).join('') + '</div>';
}
function marcadosEm(id){
  var c = $(id); if(!c) return null;
  return Array.prototype.map.call(c.querySelectorAll('input:checked'), function(i){ return i.value; });
}

function abrirPessoa(id){
  var p = D.pessoas.find(function(x){ return x.id === id; }); if(!p) return;
  if(p.tipo === 'externo') return verFornecedor(p);
  var sou = p.id === EU.id;
  var protegido = (p.perfil === 'diretoria' || p.perfil === 'ti') && !PODE.admin;   // 0024
  var folhaTrava = (p.perfil === 'diretoria' || p.perfil === 'dp') && !PODE.folha;
  var fora = !sou && p.tipo === 'colaborador' && !noAlcance(p.perfil);   // como no Docs: fora do alcance, só consulta nome/perfil
  var travaPerfil = sou || protegido || folhaTrava || fora;
  var travaSit = sou || protegido || folhaTrava || !PODE.admin;          // ativar/desativar: só diretoria/TI (como no Docs)
  var obras = D.obras.filter(function(o){ return o.ativa || obrasDaPessoa(p.id).indexOf(o.id) >= 0; })
                     .map(function(o){ return { id:o.id, nome:o.nome + (o.ativa ? '' : ' (encerrada)') }; });
  var marc = obrasDaPessoa(p.id);
  modal('Pessoa',
    '<div class="grade">'
    + campo('Nome', '<input type="text" id="p-nome" value="' + esc(p.nome) + '"' + (fora ? ' disabled' : '') + '>'
        + (fora ? '<div class="sub">Perfil fora do seu alcance: nome, perfil e situação só por quem gerencia esse perfil.</div>' : ''), true)
    + campo('E-mail (login)', '<div class="leitura">' + esc(p.email) + '</div>', true)
    + campo('Perfil', '<select id="p-perfil"' + (travaPerfil ? ' disabled' : '') + '>' + perfisQuePossoDar(p.tipo, p.perfil).map(function(x){
        return '<option value="' + esc(x.codigo) + '"' + (x.codigo === p.perfil ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('') + '</select>'
        + (sou ? '<div class="sub">Ninguém muda o próprio perfil.</div>' : protegido ? '<div class="sub">Perfil da diretoria/TI: só a diretoria ou a TI altera.</div>'
           : folhaTrava ? '<div class="sub">Perfil com acesso à folha: só a diretoria ou o DP altera.</div>' : ''))
    + (p.tipo === 'externo'
        ? campo('Empresa', '<div class="leitura">' + esc(empresaNome(p.empresa_id)) + '</div>')
        : campo('Setor', '<select id="p-setor">' + opcoesSetor(p.setor) + '</select>'))
    + campo('Cargo', '<input type="text" id="p-cargo" value="' + esc(p.cargo) + '">')
    + campo('WhatsApp', '<input type="tel" id="p-whats" placeholder="11 91234-5678" value="' + esc(p.whatsapp) + '">')
    + campo('', '<label class="marcar"><input type="checkbox" id="p-avisa"' + (p.avisa_whatsapp ? ' checked' : '') + '> Receber avisos pelo WhatsApp</label>', true)
    + campo('Situação', '<div class="seg" id="p-ativo" data-v="' + (p.ativo ? '1' : '0') + '">'
        + '<button type="button" data-v="1" class="' + (p.ativo ? 'ativo' : '') + '"' + (travaSit ? ' disabled' : '') + '>Ativo</button>'
        + '<button type="button" data-v="0" class="' + (p.ativo ? '' : 'ativo') + '"' + (travaSit ? ' disabled' : '') + '>Inativo</button></div>' + (!PODE.admin && !sou ? '<div class="sub">Ativar ou desativar: só a diretoria ou a TI.</div>' : ''), true)
    + (p.tipo === 'externo' ? '' : campo('Obras que vê',
        '<div class="sub" style="margin-bottom:6px">Nenhuma marcada = vê <b>todas</b> as obras.' + (PODE.admin ? '' : ' Só a diretoria ou a TI altera.') + '</div>'
        + caixaMarcar('p-obras', obras, marc, PODE.admin), true))
    + '</div>',
    function(btn){
      /* tudo lido AGORA (antes o modal podia trocar durante a gravação) */
      var tela = {
        nome: fora ? p.nome : $('p-nome').value.trim(),
        cargo: $('p-cargo').value.trim(),
        whatsapp: soDigitos($('p-whats').value),
        avisa_whatsapp: $('p-avisa').checked,
        ativo: $('p-ativo').getAttribute('data-v') === '1'
      };
      if(!travaPerfil) tela.perfil = $('p-perfil').value;
      if(p.tipo !== 'externo') tela.setor = $('p-setor').value || null;
      var novas = PODE.admin && p.tipo !== 'externo' ? marcadosEm('p-obras') : null;
      if(tela.nome.length < 3) throw new Error('Informe o nome completo.');
      if(tela.avisa_whatsapp && tela.whatsapp.length < 10) throw new Error('Para receber avisos, informe o WhatsApp com DDD.');
      /* só o que mudou: a página aberta há horas não desfaz o que outra pessoa gravou */
      var dados = {};
      Object.keys(tela).forEach(function(k){ if(tela[k] !== (p[k] == null ? (k === 'setor' ? null : '') : p[k])) dados[k] = tela[k]; });
      var mudouObras = novas && (novas.length !== marc.length || novas.some(function(x){ return marc.indexOf(x) < 0; }));
      var passo = Object.keys(dados).length ? core('pessoas').update(dados).eq('id', p.id).then(ok) : Promise.resolve();
      return passo.then(function(){ return mudouObras ? definirObras(p.id, marc, novas) : null; })
        .then(function(){ if(!Object.keys(dados).length && !mudouObras) return 'Nada mudou.'; });
    });
  segmento('p-ativo');
}

function novaPessoa(){
  var tipo = 'colaborador';
  modal('Nova pessoa',
    '<div class="grade">'
    /* fornecedor (acesso de empresa) se cadastra no Docs — decisão de 25/09/2026 */
    + '<div class="inteiro dica" style="margin:0">Aqui se cadastra quem é da construtora. Fornecedor (acesso de empresa) se cadastra no Docs.</div>'
    + campo('Nome completo', '<input type="text" id="n-nome" autocomplete="off">', true)
    + campo('E-mail', '<input type="email" id="n-email" autocomplete="off" placeholder="nome' + esc(DOMINIO_EMAIL) + '">', true)
    + '<div id="n-colab" class="inteiro grade" style="padding:0">'
    +   campo('Perfil', '<select id="n-perfil">' + perfisQuePossoDar('colaborador', null).map(function(x){
          return '<option value="' + esc(x.codigo) + '"' + (x.codigo === 'colaborador' ? ' selected' : '') + '>' + esc(x.nome) + '</option>'; }).join('') + '</select>')
    +   campo('Setor', '<select id="n-setor">' + opcoesSetor(null) + '</select>')
    + '</div>'
    + '<div id="n-ext" class="inteiro oculto">' + campo('Empresa', '<select id="n-empresa"><option value="">— escolha —</option>'
        + D.empresas.filter(function(e){ return e.ativa; }).map(function(e){ return '<option value="' + esc(e.id) + '">' + esc(e.razao_social) + ' · ' + esc(fmtCnpj(e.cnpj)) + '</option>'; }).join('')
        + '</select>') + '</div>'
    + campo('Cargo', '<input type="text" id="n-cargo">')
    + campo('WhatsApp', '<input type="tel" id="n-whats" placeholder="11 91234-5678">')
    + '<div class="inteiro dica" style="margin:0">A pessoa recebe um e-mail para criar a senha e entra pelo portal.</div>'
    + '</div>',
    function(){
      tipo = 'colaborador';
      var email = $('n-email').value.trim().toLowerCase(), nome = $('n-nome').value.trim();
      if(nome.length < 3) throw new Error('Informe o nome completo.');
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) throw new Error('Informe um e-mail válido.');
      var corpo = { email:email, nome:nome, tipo:tipo, cargo:$('n-cargo').value.trim(),
                    redirect: new URL('../', location.href).href };
      if(tipo === 'colaborador'){
        if(email.slice(-DOMINIO_EMAIL.length) !== DOMINIO_EMAIL) throw new Error('Colaborador usa e-mail ' + DOMINIO_EMAIL + '.');
        corpo.perfil = $('n-perfil').value; corpo.setor = $('n-setor').value || null;
      } else {
        corpo.perfil = 'fornecedor'; corpo.empresa_id = $('n-empresa').value;
        if(!corpo.empresa_id) throw new Error('Escolha a empresa do fornecedor.');
      }
      var whats = soDigitos($('n-whats').value);
      return criarAcesso(corpo).then(function(dados){
        /* o telefone não passa pela edge (ela cuida só do acesso). Se falhar,
           o acesso JÁ foi criado: não é erro de repetir (daria "já tem acesso") */
        var tel = whats && dados.id
          ? core('pessoas').update({ whatsapp: whats }).eq('id', dados.id).then(ok).then(function(){ return ''; },
              function(){ return ' O WhatsApp não foi salvo — edite a pessoa para incluir.'; })
          : Promise.resolve('');
        return tel.then(function(extra){
          if(dados.aviso) return { ficar: dados.aviso + extra };
          if(extra) return { erro: 'Acesso criado.' + extra };
          return 'Acesso criado. O e-mail para criar a senha foi enviado.';
        });
      });
    }, 'Criar acesso');
  segmento('n-tipo', function(v){
    $('n-colab').classList.toggle('oculto', v !== 'colaborador');
    $('n-ext').classList.toggle('oculto', v !== 'externo');
  });
}

function criarAcesso(corpo){
  return sb.functions.invoke(FUNCAO_CRIAR_PESSOA, { body: corpo }).then(function(r){
    /* quando a função recusa (400/403/409) a mensagem de verdade está no corpo */
    if(r.error && r.error.context && typeof r.error.context.json === 'function'){
      return r.error.context.json().catch(function(){ return {}; }).then(function(c){
        throw new Error(c.erro || r.error.message || 'Falha ao criar o acesso.');
      });
    }
    var d = r.data || {};
    if(r.error || d.erro){
      var m = d.erro || (r.error && r.error.message) || 'Falha ao criar o acesso.';
      if(/Failed to send a request|Failed to fetch|FunctionsFetchError/i.test(m))
        m = 'Não consegui falar com a função que cria o acesso ("' + FUNCAO_CRIAR_PESSOA + '"). Confira a internet; se persistir, avise a TI.';
      throw new Error(m);
    }
    return d;
  });
}

/* troca as obras que a pessoa vê numa transação só (0027). Sem a função,
   PÕE antes de TIRAR: se falhar no meio, a pessoa fica com obra a mais —
   nunca com nenhuma (que quer dizer "vê todas"). */
function definirObras(pessoa, antes, depois){
  return sb.schema('core').rpc('definir_obras_da_pessoa', { p_pessoa: pessoa, p_obras: depois }).then(function(r){
    if(!r || !r.error) return;
    if(!/definir_obras_da_pessoa|Could not find the function|does not exist/i.test(r.error.message || '')) throw r.error;
    var tira = antes.filter(function(x){ return depois.indexOf(x) < 0; });
    var poe  = depois.filter(function(x){ return antes.indexOf(x) < 0; });
    var p = Promise.resolve();
    if(poe.length)  p = p.then(function(){ return core('pessoa_obras').upsert(poe.map(function(x){ return { pessoa_id: pessoa, obra_id: x }; }), { onConflict: 'pessoa_id,obra_id', ignoreDuplicates: true }).then(ok); });
    if(tira.length) p = p.then(function(){ return core('pessoa_obras').delete().eq('pessoa_id', pessoa).in('obra_id', tira).then(ok); });
    return p;
  });
}

/* ---------------------------------------------------------------------
   PERMISSÕES — perfil × sistema (só diretoria/TI). Grava por
   core.definir_acesso (0025): card do portal + nível do Patrimônio juntos,
   e as travas (Diretoria, TI nos Cadastros, externos) conferidas no banco.
   --------------------------------------------------------------------- */
var SISTEMAS = [
  { m:'flow',          nome:'Flow',        dica:'Pendências' },
  { m:'patrimonio',    nome:'Patrimônio',  dica:'Bens — escolha o nível' },
  { m:'docs',          nome:'Docs',        dica:'Até a virada o Docs tem acesso próprio; aqui é só o card' },
  { m:'configuracoes', nome:'Cadastros',   dica:'A engrenagem do portal' }
];
var NIVEIS_FLOW = [['ti', 'TI'], ['gestor', 'Gestor'], ['colaborador', 'Colaborador']];
function nivelFlowDe(perfil){ var n = (D.nivelFlow || []).find(function(x){ return x.perfil === perfil; }); return n ? n.nivel : 'colaborador'; }
var PERM_VISTA = 'quem';
var NIVEIS_PATRIMONIO = [
  ['operador_ti', 'Gestor de TI'],
  ['admin_obras', 'Gestor de Obra (Administrativo)'],
  ['almoxarife',  'Almoxarife'],
  ['operador',    'Só o que está com ele'],
  ['admin_ti',    'Administrador de TI']
];
function temModulo(perfil, m){ return D.perfilModulos.some(function(x){ return x.perfil === perfil && x.modulo === m; }); }
function nivelPatr(perfil){ var n = D.nivelPatrimonio.find(function(x){ return x.perfil === perfil; }); return n ? n.nivel : ''; }
function telaPermissoes(){
  var perfis = D.perfis.filter(function(p){ return p.ativo || D.perfilModulos.some(function(x){ return x.perfil === p.codigo; }); });
  var internos = perfis.filter(function(p){ return !p.eh_externo; });
  function qtd(c){ var n = D.pessoas.filter(function(p){ return p.ativo && p.perfil === c; }).length; return n + (n === 1 ? ' pessoa' : ' pessoas'); }
  var linhas = internos.map(function(p){
    var dir = p.codigo === 'diretoria';
    return '<tr' + (dir ? ' class="travado"' : '') + '><td class="perfil"><b>' + esc(p.nome) + '</b><small>' + qtd(p.codigo) + (dir ? ' · travado' : '') + '</small></td>'
      + SISTEMAS.map(function(sis){
          if(sis.m === 'patrimonio'){
            var nv = nivelPatr(p.codigo);
            if(dir) return '<td><span class="trava">Diretoria (tudo)</span></td>';
            /* mesma caixa dos outros; marcada, aparece o nível (o Patrimônio exige um) */
            return '<td><div style="display:flex;align-items:center;justify-content:center;gap:8px">'
              + '<input type="checkbox" data-patr-liga="' + esc(p.codigo) + '"' + (nv ? ' checked' : '') + ' aria-label="Patrimônio para ' + esc(p.nome) + '">'
              + '<select data-perm="' + esc(p.codigo) + '" data-m="patrimonio" aria-label="Nível no Patrimônio para ' + esc(p.nome) + '"' + (nv ? '' : ' class="oculto"') + '>'
              + (nv ? '' : '<option value="">— escolha o nível —</option>')
              + NIVEIS_PATRIMONIO.filter(function(n){ return n[0] !== 'admin_ti' || nv === 'admin_ti'; }).map(function(n){
                  return '<option value="' + n[0] + '"' + (nv === n[0] ? ' selected' : '') + '>' + esc(n[1]) + '</option>'; }).join('')
              + '</select></div>' + (nv && !temModulo(p.codigo, 'patrimonio') ? '<div class="trava">sem o card no portal</div>' : '') + '</td>';
          }
          if(sis.m === 'flow' && !dir && !D.falta0026){
            var fl = temModulo(p.codigo, 'flow'), nf = nivelFlowDe(p.codigo);
            return '<td><div style="display:flex;align-items:center;justify-content:center;gap:8px">'
              + '<input type="checkbox" data-perm="' + esc(p.codigo) + '" data-m="flow"' + (fl ? ' checked' : '') + ' aria-label="Flow para ' + esc(p.nome) + '">'
              + '<select data-flow-nivel="' + esc(p.codigo) + '" aria-label="Nível no Flow para ' + esc(p.nome) + '"' + (fl ? '' : ' class="oculto"') + '>'
              + NIVEIS_FLOW.map(function(n){ return '<option value="' + n[0] + '"' + (nf === n[0] ? ' selected' : '') + '>' + esc(n[1]) + '</option>'; }).join('')
              + '</select></div></td>';
          }
          var trava = dir || (sis.m === 'configuracoes' && p.codigo === 'ti');
          return '<td><input type="checkbox" data-perm="' + esc(p.codigo) + '" data-m="' + sis.m + '"' + (temModulo(p.codigo, sis.m) ? ' checked' : '')
               + (trava ? ' disabled title="Travado"' : '') + ' aria-label="' + esc(sis.nome) + ' para ' + esc(p.nome) + '"></td>';
        }).join('') + '</tr>';
  }).join('');
  var externos = perfis.filter(function(p){ return p.eh_externo; }).map(function(p){ return esc(p.nome); }).join(', ');
  return cabecalho('Permissões', 'A mudança vale na hora, para todas as pessoas do perfil.')
    + vistasPermissoes()
    + (PERM_VISTA !== 'quem' ? telaAcoes(PERM_VISTA) : '<div class="dica" style="margin-top:14px">Travado de propósito: o perfil Diretoria, a TI nos Cadastros'
    + (externos ? ' e os externos (' + externos + ' — só a área do fornecedor)' : '') + '. '
    + 'Dentro de cada sistema, o que a pessoa pode fazer segue as regras dele (no Patrimônio, pelo nível).</div>'
    + '<div class="tabela-rolagem"><table class="perm"><thead><tr><th class="perfil">Perfil</th>'
    + SISTEMAS.map(function(sis){ return '<th title="' + esc(sis.dica) + '">' + esc(sis.nome) + '</th>'; }).join('')
    + '</tr></thead><tbody>' + linhas + '</tbody></table></div>');
}
function vistasPermissoes(){
  var v = [['quem', 'Quem entra em cada sistema'], ['patrimonio', 'O que cada nível faz · Patrimônio'], ['flow', 'O que cada nível faz · Flow']];
  return '<div class="seg" style="margin-top:14px;max-width:760px">' + v.map(function(x){
    return '<button type="button" data-acao="perm-vista" data-id="' + x[0] + '" class="' + (PERM_VISTA === x[0] ? 'ativo' : '') + '">' + esc(x[1]) + '</button>'; }).join('') + '</div>';
}
/* nível × ação de um sistema (0026) — o banco obedece a esta tabela */
function telaAcoes(mod){
  if(D.falta0026) return '<div class="recado erro">Falta rodar a migração 0026 no banco.</div>';
  var niveis = D.niveis.filter(function(n){ return n.modulo === mod; });
  var acoes  = D.acoes.filter(function(a){ return a.modulo === mod; });
  function tem(n, a){ return D.nivelAcoes.some(function(x){ return x.modulo === mod && x.nivel === n && x.acao === a; }); }
  var dica = mod === 'patrimonio'
    ? 'O banco do Patrimônio obedece a esta tabela. Quem gerencia uma área já vê os bens dela; Excluir e Aprovar baixa só valem na área que o nível gerencia. "Cadastrar, editar, movimentar e aprovar" é uma ação só por área porque é a mesma gravação no bem. Quem não gerencia a área só pede (cadastro, movimentação do que está com ele).'
    : 'No Flow, quem vê cada pendência continua sendo: quem criou, o responsável, os envolvidos e quem vê a obra.';
  return '<div class="dica" style="margin-top:14px">' + esc(dica) + ' Qual nível cada perfil tem: em "Quem entra".</div>'
    + '<div class="tabela-rolagem"><table class="perm"><thead><tr><th class="perfil">Ação</th>'
    + niveis.map(function(n){ return '<th>' + esc(n.nome) + (n.travado ? '<div class="trava">tudo</div>' : '') + '</th>'; }).join('')
    + '</tr></thead><tbody>' + acoes.map(function(a){
        return '<tr><td class="perfil"><b>' + esc(a.nome) + '</b></td>' + niveis.map(function(n){
          return '<td><input type="checkbox" data-na-mod="' + esc(mod) + '" data-na-nivel="' + esc(n.codigo) + '" data-na-acao="' + esc(a.codigo) + '"'
               + (n.travado || tem(n.codigo, a.codigo) ? ' checked' : '') + (n.travado ? ' disabled title="Travado"' : '')
               + ' aria-label="' + esc(a.nome) + ' — ' + esc(n.nome) + '"></td>'; }).join('') + '</tr>';
      }).join('') + '</tbody></table></div>';
}
$('conteudo').addEventListener('change', function(e){
  var t = e.target;
  if(t.hasAttribute('data-na-acao')){
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return sb.schema('core').rpc('definir_acao', { p_modulo: t.getAttribute('data-na-mod'), p_nivel: t.getAttribute('data-na-nivel'),
                                                   p_acao: t.getAttribute('data-na-acao'), p_ligado: t.checked }).then(ok)
      .then(function(){ aviso('Permissão atualizada.'); return recarregar(); })
      .catch(function(err){ aviso(msgErro(err), true); recarregar(); });
  }
  if(t.hasAttribute('data-flow-nivel')){
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return definirAcesso(t.getAttribute('data-flow-nivel'), 'flow', true, t.value);
  }
  if(t.hasAttribute('data-patr-liga')){
    var sel = t.parentNode.querySelector('select');
    if(t.checked){ sel.classList.remove('oculto'); sel.focus(); return; }   // grava quando escolher o nível
    sel.classList.add('oculto');
    if(!nivelPatr(t.getAttribute('data-patr-liga'))) return;               // nunca foi gravado
    FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
    return definirAcesso(t.getAttribute('data-patr-liga'), 'patrimonio', false, null);
  }
  if(!t.hasAttribute('data-perm')) return;
  var perfil = t.getAttribute('data-perm'), m = t.getAttribute('data-m');
  var ligado = t.tagName === 'SELECT' ? !!t.value : t.checked;
  var nivel = t.tagName === 'SELECT' ? (t.value || null) : null;
  if(m === 'flow' && ligado){ var sf = t.parentNode.querySelector('select[data-flow-nivel]'); if(sf) nivel = sf.value; }
  if(t.tagName === 'SELECT' && !t.value) return;
  FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
  definirAcesso(perfil, m, ligado, nivel);
});
function definirAcesso(perfil, m, ligado, nivel){
  return sb.schema('core').rpc('definir_acesso', { p_perfil: perfil, p_modulo: m, p_ligado: ligado, p_nivel: nivel }).then(ok)
    .then(function(){ aviso('Permissão de ' + perfilNome(perfil) + ' atualizada.'); return recarregar(); })
    .catch(function(err){
      var msg = msgErro(err);
      if(/definir_acesso|function .* does not exist|Could not find the function/i.test(msg)) msg = 'Falta rodar a migração 0025 no banco.';
      aviso(msg, true); recarregar();
    });
}

function telaSetores(){
  var ed = PODE.admin;

           ed ? '<button class="botao" data-acao="novo-setor">+ Novo setor</button>' : '')
    + (ed ? '' : '<div class="dica" style="margin-top:14px">Só a diretoria e a TI alteram os setores.</div>')
    + '<div class="lista" style="margin-top:14px">' + (D.setores.length ? D.setores.map(function(s){
        return '<div class="setor"><span class="nome' + (s.ativo ? '' : ' sub') + '">' + esc(s.nome) + '</span>'

$('conteudo').addEventListener('change', function(e){
  var t = e.target, nome, dados;
  if(t.hasAttribute('data-ordem')){ nome = t.getAttribute('data-ordem'); dados = { ordem: Math.max(0, Math.min(999, parseInt(t.value, 10) || 0)) }; }
  else if(t.hasAttribute('data-setor-ativo')){ nome = t.getAttribute('data-setor-ativo'); dados = { ativo: t.checked }; }
  else return;
  FOCO_PENDENTE = seletorDoFoco(); t.disabled = true;
  core('setores').update(dados).eq('nome', nome).then(ok)
    .then(function(){ aviso('Setor atualizado.'); return recarregar(); })
    .catch(function(err){ aviso(msgErro(err), true); t.disabled = false; });
});
function novoSetor(){
  var max = D.setores.reduce(function(m, s){ return Math.max(m, s.ordem || 0); }, 0);
  modal('Novo setor', '<div class="grade">' + campo('Nome do setor', '<input type="text" id="s-nome" maxlength="60">', true)
      + campo('Ordem', '<input type="number" id="s-ordem" min="0" max="999" value="' + (max + 10) + '">') + '</div>',
    function(){
      var nome = $('s-nome').value.trim();
      if(!nome) throw new Error('Informe o nome do setor.');
      var ord = parseInt($('s-ordem').value, 10);
      ord = isNaN(ord) ? 100 : Math.max(0, Math.min(999, ord));
      return core('setores').insert({ nome: nome, ordem: ord }).then(ok);
    });
}

function telaConstrutora(){
  if(D.construtoraFalta) return cabecalho('Construtora', 'Dados cadastrais da construtora.')
    + '<div class="recado erro">A tabela da construtora ainda não existe neste banco (migração 0024).</div>';
  var c = D.construtora || {}, ed = PODE.admin;
  function cp(rot, k, tipo, inteiro, extra){
    var v = c[k] || '';
    if(k === 'cnpj') v = fmtCnpj(v);
    if(k === 'cep' && v.length === 8) v = v.slice(0, 5) + '-' + v.slice(5);
    return campo(rot, ed ? '<input type="' + (tipo || 'text') + '" id="c-' + k + '" value="' + esc(v) + '"' + (extra || '') + '>'
                         : '<div class="leitura">' + esc(v || '—') + '</div>', inteiro);
  }
  return cabecalho('Construtora', 'Dados cadastrais da empresa que usa o BeMer.' + (ed ? '' : ' Só a diretoria e a TI alteram.'))
    + '<div class="cartao" style="margin-top:14px"><div class="grade">'
    + cp('Razão social', 'razao_social', 'text', true) + cp('Nome fantasia', 'nome_fantasia')
    + cp('CNPJ', 'cnpj', 'text', false, ' inputmode="numeric" placeholder="00.000.000/0000-00"')
    + cp('Inscrição estadual', 'inscricao_estadual') + cp('Inscrição municipal', 'inscricao_municipal')
    + cp('Endereço', 'endereco', 'text', true) + cp('Cidade', 'cidade')
    + '<div class="grade" style="padding:0;grid-template-columns:90px minmax(0,1fr)">' + cp('UF', 'uf', 'text', false, ' maxlength="2"') + cp('CEP', 'cep', 'text', false, ' inputmode="numeric"') + '</div>'
    + cp('Telefone', 'telefone', 'tel') + cp('E-mail', 'email', 'email') + cp('Site', 'site', 'text', true)
    + '</div>' + (ed ? '<div class="acoes"><button class="botao" data-acao="salvar-construtora">Salvar</button></div>' : '')
    + '<div id="c-recado"></div></div>';
}
function salvarConstrutora(btn){
  var k = ['razao_social','nome_fantasia','cnpj','inscricao_estadual','inscricao_municipal','endereco','cidade','uf','cep','telefone','email','site'];
  var d = { id: true };
  k.forEach(function(x){ d[x] = $('c-' + x).value.trim(); });
  d.cnpj = soDigitos(d.cnpj); d.cep = soDigitos(d.cep); d.uf = d.uf.toUpperCase();
  var r = $('c-recado');
  function erro(m){ r.innerHTML = '<div class="recado erro">' + esc(m) + '</div>'; }
  if(d.cnpj && !cnpjValido(d.cnpj)) return erro('CNPJ inválido (confira os 14 dígitos).');
  if(d.cep && d.cep.length !== 8) return erro('CEP tem 8 dígitos.');
  if(d.uf && !/^[A-Z]{2}$/.test(d.uf)) return erro('UF são 2 letras (ex.: SP).');
  btn.disabled = true;
  core('construtora').upsert(d, { onConflict: 'id' }).then(ok)
    .then(function(){ aviso('Dados da construtora salvos.'); return recarregar(); })
    .catch(function(e){ erro(msgErro(e)); btn.disabled = false; });
}

/* ---------------------------------------------------------------------
   Modal genérico: salvar() devolve promessa (ou lança erro de validação)
   --------------------------------------------------------------------- */
function campo(rot, html, inteiro){
  return '<div' + (inteiro ? ' class="inteiro"' : '') + '>' + (rot ? '<label class="rot">' + esc(rot) + '</label>' : '') + html + '</div>';
}
function modal(titulo, corpo, salvar, rotulo){
  fecharModal();
  var f = document.createElement('div');
  f.className = 'fundo-modal'; f.id = 'modal';
  f.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(titulo) + '">'
    + '<button class="fechar" type="button" aria-label="Fechar">&times;</button><h2>' + esc(titulo) + '</h2>' + corpo
    + '<div id="m-recado"></div><div class="acoes">'
    + (salvar ? '<button class="botao sec" type="button" data-m="cancelar">Cancelar</button><button class="botao" type="button" data-m="salvar">' + esc(rotulo || 'Salvar') + '</button>'
              : '<button class="botao sec" type="button" data-m="cancelar">Fechar</button>')
    + '</div></div>';
  document.body.appendChild(f);
  document.body.style.overflow = 'hidden';
  var fechar = function(){ if(!f.hasAttribute('data-salvando')) fecharModal(); };   // gravando: espera
  f.querySelector('.fechar').addEventListener('click', fechar);
  f.querySelector('[data-m="cancelar"]').addEventListener('click', fechar);
  /* filtro das caixas de marcar */
  f.querySelectorAll('[data-filtra]').forEach(function(i){
    i.addEventListener('input', function(){
      var b = sem(i.value);
      $(i.getAttribute('data-filtra')).querySelectorAll('.marcar').forEach(function(l){
        l.style.display = !b || l.getAttribute('data-texto').indexOf(b) >= 0 ? '' : 'none'; });
    });
  });
  var bs = f.querySelector('[data-m="salvar"]');
  if(bs) bs.addEventListener('click', function(){
    var rec = f.querySelector('#m-recado'); rec.innerHTML = '';
    var p;
    try { p = Promise.resolve(salvar(bs)); } catch(e){ rec.innerHTML = '<div class="recado erro">' + esc(e.message) + '</div>'; return; }
    bs.disabled = true; bs.textContent = 'Salvando…'; f.setAttribute('data-salvando', '1');
    p.then(function(res){
       f.removeAttribute('data-salvando');
       if(res && res.ficar){
         /* deu certo, mas há um recado que a pessoa precisa ler (ex.: o e-mail
            de senha não saiu): o modal fica aberto, sem "repetir" (daria 409) */
         rec.innerHTML = '<div class="recado erro">' + esc(res.ficar) + '</div>';
         bs.remove();
         var c = f.querySelector('[data-m="cancelar"]'); if(c) c.textContent = 'Fechar';
         return recarregar();
       }
       if($('modal') === f) fecharModal();
       if(res && res.erro) aviso(res.erro, true); else aviso(typeof res === 'string' ? res : 'Salvo.');
       return recarregar();
     })
     .catch(function(e){
       f.removeAttribute('data-salvando');
       if($('modal') === f){ rec.innerHTML = '<div class="recado erro">' + esc(msgErro(e)) + '</div>'; bs.disabled = false; bs.textContent = rotulo || 'Salvar'; }
       else aviso(msgErro(e), true);
       recarregar();   // parte pode ter gravado (ex.: dados sim, vínculos não)
     });
  });
  var pri = f.querySelector('input:not([disabled]):not([type=checkbox]):not([type=search]),select:not([disabled])');
  if(pri && window.innerWidth > 600) pri.focus();
}
function fecharModal(){ var m = $('modal'); if(m) m.remove(); document.body.style.overflow = ''; }
document.addEventListener('keydown', function(e){ var m = $('modal'); if(e.key === 'Escape' && m && !m.hasAttribute('data-salvando')) fecharModal(); });
function segmento(id, aoMudar){
  var s = $(id); if(!s) return;
  s.addEventListener('click', function(e){
    var b = e.target.closest('button[data-v]'); if(!b || b.disabled) return;
    s.setAttribute('data-v', b.getAttribute('data-v'));
    s.querySelectorAll('button').forEach(function(x){ x.classList.toggle('ativo', x === b); });
    if(aoMudar) aoMudar(b.getAttribute('data-v'));
  });
}

/* ---------- aviso de nova versão (mesmo padrão do portal e dos módulos) ---------- */
(function(){
  var avisando = false, emVoo = false;
  function conferir(){
    if(avisando || emVoo || document.hidden) return;
    emVoo = true;
    fetch('version.json?t=' + Date.now(), { cache:'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(v){
        if(!v || !v.versao || v.versao === APP_VERSION || avisando) return;
        avisando = true;
        var f = document.createElement('div');
        f.className = 'faixa-atualizar'; f.setAttribute('role', 'status');
        f.innerHTML = '<span>Nova versão dos Cadastros disponível</span><button type="button">Atualizar agora</button>';
        document.body.appendChild(f);
        f.querySelector('button').addEventListener('click', function(){ location.reload(); });
      })
      .catch(function(){})
      .then(function(){ emVoo = false; });
  }
  setInterval(conferir, 120000);
  document.addEventListener('visibilitychange', conferir);
  setTimeout(conferir, 8000);
})();
</script>
